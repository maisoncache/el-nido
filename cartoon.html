  /* the body handle: bigger, a different shape and a different colour, so it
     never gets confused with a limb */
  const r = toScreen(c.root.x, c.root.y);
  g.fillStyle = dragging && dragging.kind === "move" ? "#ffd964" : "#4a7de0";
  g.strokeStyle = "#fff"; g.lineWidth = 3.5;
  g.beginPath(); g.arc(r.x, r.y, ROOT_R, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "#fff"; g.font = "bold 15px system-ui,sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("✥", r.x, r.y + 1);
}

/* ---------------------------------------------------------------------------
   HIT TESTING
   Fourteen handles on a character a few hundred pixels tall will always
   overlap, so rather than "the first one under the finger" we take the NEAREST
   one. That is deterministic and it is what a person means.
   --------------------------------------------------------------------------- */
function pickHandle(c, sx, sy) {
  const sk = skeleton(c);
  let best = null, bestD = HIT_R;
  const rp = toScreen(c.root.x, c.root.y);
  const rd = Math.hypot(rp.x - sx, rp.y - sy);
  if (rd <= ROOT_R + 10) return { kind:"move" };
  if (locked) return null;
  HANDLES.forEach((n) => {
    if (n === "neck") return;
    const p = handlePos(c, sk, n), s = toScreen(p.x, p.y);
    const d = Math.hypot(s.x - sx, s.y - sy);
    if (d < bestD) { bestD = d; best = n; }
  });
  return best ? { kind:"pose", joint:best } : null;
}
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function pickCharacter(wx, wy) {
  const list = sortedChars(frame()).slice().reverse();   // topmost first
  for (let i = 0; i < list.length; i++) {
    const c = list[i], sk = skeleton(c), pad = 16 * (c.scale || 1);
    const hd = headDisc(c, sk);
    if (Math.hypot(wx - hd.x, wy - hd.y) <= hd.r + pad) return c;
    for (let k = 0; k < BONES.length; k++) {
      const b = sk[BONES[k].n];
      if (distToSeg(wx, wy, b.ax, b.ay, b.bx, b.by) <= pad) return c;
    }
  }
  return null;
}

/* ---------------------------------------------------------------------------
   POINTERS
   One finger poses or moves; two fingers pinch and pan. The moment a second
   finger lands, whatever the first was doing is undone — a pinch should never
   leave a bent elbow behind.
   --------------------------------------------------------------------------- */
const pointers = new Map();
let dragging = null, pinch = null, panning = null;

function localXY(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function cancelDrag(restore) {
  if (dragging && restore && dragging.before) {
    const c = chars().find((x) => x.id === dragging.before.id);
    if (c) { c.joints = clone(dragging.before.joints); c.root = clone(dragging.before.root); }
  }
  dragging = null; panning = null; draw();
}

cv.addEventListener("pointerdown", (ev) => {
  ev.preventDefault();
  cv.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, localXY(ev));
  if (playing) { stopPlayback(); return; }

  if (pointers.size === 2) {
    cancelDrag(true);                      // a pinch must not disturb a pose
    const pts = [...pointers.values()];
    pinch = {
      d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
      mid: { x:(pts[0].x + pts[1].x) / 2, y:(pts[0].y + pts[1].y) / 2 },
      z: view.z, vx: view.x, vy: view.y
    };
    return;
  }
  if (pointers.size !== 1) return;

  const p = localXY(ev), w = toWorld(p.x, p.y);
  const sel = selected();
  if (sel) {
    const h = pickHandle(sel, p.x, p.y);
    if (h) {
      dragging = { kind:h.kind, joint:h.joint, id:sel.id, moved:false,
                   before:{ id:sel.id, joints:clone(sel.joints), root:clone(sel.root) },
                   grab:{ x:w.x - sel.root.x, y:w.y - sel.root.y } };
      draw(); return;
    }
  }
  const hit = pickCharacter(w.x, w.y);
  if (hit) {
    selId = hit.id;
    dragging = { kind:"move", id:hit.id, moved:false, pending:true,
                 before:{ id:hit.id, joints:clone(hit.joints), root:clone(hit.root) },
                 grab:{ x:w.x - hit.root.x, y:w.y - hit.root.y } };
    refreshSelUI(); draw(); return;
  }
  panning = { sx:p.x, sy:p.y, vx:view.x, vy:view.y, moved:false };
});

cv.addEventListener("pointermove", (ev) => {
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, localXY(ev));

  if (pinch && pointers.size >= 2) {
    const pts = [...pointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const mid = { x:(pts[0].x + pts[1].x) / 2, y:(pts[0].y + pts[1].y) / 2 };
    const z = Math.max(0.18, Math.min(4, pinch.z * (d / Math.max(12, pinch.d))));
    view.z = z;
    view.x = pinch.vx - (mid.x - pinch.mid.x) / z;
    view.y = pinch.vy - (mid.y - pinch.mid.y) / z;
    draw(); return;
  }
  const p = localXY(ev);
  if (panning) {
    if (Math.hypot(p.x - panning.sx, p.y - panning.sy) > 5) panning.moved = true;
    view.x = panning.vx - (p.x - panning.sx) / view.z;
    view.y = panning.vy - (p.y - panning.sy) / view.z;
    draw(); return;
  }
  if (!dragging) return;
  const c = chars().find((x) => x.id === dragging.id);
  if (!c) return;
  const w = toWorld(p.x, p.y);
  if (dragging.kind === "move") {
    if (dragging.pending) {
      const s0 = toScreen(dragging.before.root.x + dragging.grab.x, dragging.before.root.y + dragging.grab.y);
      if (Math.hypot(s0.x - p.x, s0.y - p.y) < 6) return;   // a tap is not a drag
      dragging.pending = false;
    }
    c.root.x = Math.max(-200, Math.min(STAGE_W + 200, w.x - dragging.grab.x));
    c.root.y = Math.max(-200, Math.min(STAGE_H + 200, w.y - dragging.grab.y));
    dragging.moved = true;
  } else {
    c.joints[dragging.joint] = aimBone(c, dragging.joint, w.x, w.y);
    dragging.moved = true;
  }
  markFrameDirty(); draw();
});

function endPointer(ev) {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size > 0) return;

  if (panning) {
    if (!panning.moved) { selId = null; refreshSelUI(); }
    panning = null; draw(); return;
  }
  if (dragging) {
    if (dragging.moved) { pushHistoryFrom(dragging.before); refreshStrip(); autosave(); }
    dragging = null; draw();
  }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const p = localXY(ev), before = toWorld(p.x, p.y);
  view.z = Math.max(0.18, Math.min(4, view.z * (ev.deltaY > 0 ? 0.9 : 1.1)));
  const after = toWorld(p.x, p.y);
  view.x += before.x - after.x; view.y += before.y - after.y;
  draw();
}, { passive:false });

/* The snapshot for undo is taken from BEFORE the drag began, so one undo puts
   the whole gesture back rather than unpicking it a pixel at a time. */
function pushHistoryFrom(before) {
  const snap = clone(P);
  const f = snap.frames[frameIx];
  const c = f && f.characters.find((x) => x.id === before.id);
  if (c) { c.joints = clone(before.joints); c.root = clone(before.root); }
  undoStack.push(serialise(snap));
  redoStack.length = 0;
  while (undoStack.length > HIST_MAX) undoStack.shift();
  refreshHistUI();
}

/* ---------------------------------------------------------------------------
   PLAYBACK
   --------------------------------------------------------------------------- */
function playbackFrame() {
  const f = P.frames[playIx] || P.frames[0];
  if (P.playbackMode !== "smooth") return f;
  const nx = P.frames[(playIx + 1) % P.frames.length];
  return tweenFrame(f, nx, playSub);
}
function startPlayback() {
  if (P.frames.length < 1) return;
  playing = true; playIx = frameIx; playSub = 0; playT0 = performance.now();
  selId = null;
  $("bPlay").innerHTML = '<span class="ic">⏹</span>';
  $("bPlay").setAttribute("aria-label", "Stop the cartoon");
  refreshSelUI(); refreshStrip(); draw();
}
function stopPlayback() {
  if (!playing) return;
  playing = false;
  frameIx = Math.min(playIx, P.frames.length - 1);
  $("bPlay").innerHTML = '<span class="ic">▶</span>';
  $("bPlay").setAttribute("aria-label", "Play the cartoon");
  /* a full play-through is what earns the first unlock */
  noteStats((s) => {
    s.played++;
    if (P.playbackMode === "smooth") s.smoothPlays++;
    const most = P.frames.reduce((m, f) => Math.max(m, f.characters.length), 0);
    s.maxChars = Math.max(s.maxChars, most);
  });
  celebrate(checkUnlocks());
  refreshStrip(); refreshSelUI(); draw();
}
function stepPlayback() {
  const now = performance.now();
  const f = P.frames[playIx] || P.frames[0];
  const dur = Math.max(40, f.durationMs);
  const el = now - playT0;
  if (P.playbackMode === "smooth") playSub = Math.max(0, Math.min(1, el / dur));
  if (el >= dur) {
    playT0 = now; playSub = 0;
    playIx = (playIx + 1) % P.frames.length;
    refreshStrip();
  }
  draw();
}

/* ---------------------------------------------------------------------------
   THUMBNAILS — the same painter, shrunk. Cached per frame and redrawn only
   when that frame actually changes, so a hundred-frame cartoon stays smooth.
   --------------------------------------------------------------------------- */
const thumbCache = new Map();
function markFrameDirty(ix) {
  const f = P.frames[ix == null ? frameIx : ix];
  if (f) thumbCache.delete(f.id);
  dirty = true;
}
/* A short description of everything in a frame that is visible. The cached
   thumbnail is kept against this rather than against the frame's id alone,
   so a thumbnail cannot go stale just because some edit forgot to say it had
   changed one. Building it for a hundred-frame cartoon costs well under a
   millisecond, which is far less than redrawing a hundred thumbnails. */
function frameSig(f) {
  let s = f.backgroundId + "|" + f.characters.length;
  for (let i = 0; i < f.characters.length; i++) {
    const c = f.characters[i];
    s += "|" + c.id + c.type + c.eyeStyle + (c.colour || "-") + c.zIndex +
         Math.round(c.root.x) + "," + Math.round(c.root.y) + "," +
         Math.round(c.scale * 100) + "," + Math.round(c.rotation);
    for (let k = 0; k < JOINT_NAMES.length; k++) s += "," + Math.round(c.joints[JOINT_NAMES[k]]);
    for (let k = 0; k < c.accessories.length; k++) s += "+" + c.accessories[k].type;
  }
  return s;
}
function renderThumb(f, canvas) {
  const w = canvas.width, h = canvas.height;
  const t = canvas.getContext("2d");
  t.setTransform(1, 0, 0, 1, 0, 0);
  t.clearRect(0, 0, w, h);
  const z = Math.min(w / STAGE_W, h / STAGE_H);
  t.save();
  t.translate((w - STAGE_W * z) / 2, (h - STAGE_H * z) / 2);
  t.scale(z, z);
  t.beginPath(); t.rect(0, 0, STAGE_W, STAGE_H); t.clip();
  drawBg(t, f.backgroundId);
  sortedChars(f).forEach((c) => drawCharacter(t, c, {}));
  t.restore();
}
function thumbFor(f, w, h) {
  const sig = frameSig(f);
  const hit = thumbCache.get(f.id);
  if (hit && hit.sig === sig && hit.cv.width === w && hit.cv.height === h) return hit.cv;
  const c = (hit && hit.cv.width === w && hit.cv.height === h) ? hit.cv : document.createElement("canvas");
  c.width = w; c.height = h;
  renderThumb(f, c);
  thumbCache.set(f.id, { sig: sig, cv: c });
  if (thumbCache.size > 400) thumbCache.delete(thumbCache.keys().next().value);
  return c;
}

/* ===========================================================================
   THE CONTROLS
   =========================================================================== */
let dirty = false, saveTimer = 0, bigWarned = false;

let toastT = 0;
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms || 2200);
}
function setSaved(txt, busy) {
  const e = $("tSaved");
  e.textContent = txt;
  e.classList.toggle("busy", !!busy);
}
function autosave() {
  dirty = true;
  setSaved("saving…", true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}
function saveNow() {
  clearTimeout(saveTimer);
  if (!P) return;
  let quota = false;
  const ok = saveProject(P, () => { quota = true; });
  if (ok) { dirty = false; setSaved("saved"); }
  else {
    setSaved("not saved!", true);
    sheetNote(quota
      ? "This device has run out of room to save in. Nothing you have made has been thrown away — but to save again, delete a cartoon you have finished with from 📁 My cartoons."
      : "That did not save. Your cartoon is still here on screen; try again in a moment.", true);
  }
}

/* ---------------------------------------------------------------------------
   SHEETS
   --------------------------------------------------------------------------- */
let sheetClose = null;
function openSheet(title, bodyHTML, footer, onClose) {
  $("shT").textContent = title;
  $("shB").innerHTML = bodyHTML;
  const ft = $("shF"); ft.innerHTML = "";
  (footer || []).forEach((b) => {
    const el = document.createElement("button");
    el.className = "btn" + (b.cls ? " " + b.cls : "");
    el.textContent = b.label;
    if (b.id) el.id = b.id;
    el.addEventListener("click", () => { if (b.go) b.go(); });
    ft.appendChild(el);
  });
  sheetClose = onClose || null;
  $("sheet").classList.add("show");
}
function closeSheet() {
  $("sheet").classList.remove("show");
  const f = sheetClose; sheetClose = null;
  if (f) f();
}
$("shX").addEventListener("click", closeSheet);
$("sheet").addEventListener("pointerdown", (e) => { if (e.target === $("sheet")) closeSheet(); });

function sheetNote(text, bad) {
  openSheet("Hang on", '<div class="note' + (bad ? " bad" : "") + '">' + esc(text) + "</div>",
    [{ label:"OK", cls:"go", go:closeSheet }]);
}
function confirmSheet(title, text, okLabel, go) {
  openSheet(title, '<div class="note bad">' + esc(text) + "</div>", [
    { label:"Cancel", go:closeSheet },
    { label:okLabel, cls:"warn", go:() => { closeSheet(); go(); } }
  ]);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------------------------------------------------------------------------
   UNLOCK CELEBRATION — brief, cheerful, and it never interrupts a drag.
   --------------------------------------------------------------------------- */
let winQueue = [];
function celebrate(won) {
  if (!won || !won.length) return;
  winQueue = winQueue.concat(won);
  showNextWin();
}
function showNextWin() {
  if (!winQueue.length) { $("unlock").classList.remove("show"); return; }
  const w = winQueue[0];
  $("ulE").textContent = w.kind === "character" ? "🧍" : "🎁";
  $("ulT").textContent = "New " + w.kind + " unlocked!";
  $("ulP").textContent = w.nm + " is yours. Find it in the workshop.";
  $("unlock").classList.add("show");
}
$("ulOk").addEventListener("click", () => { winQueue.shift(); showNextWin(); });

/* ---------------------------------------------------------------------------
   TOOL ROW
   --------------------------------------------------------------------------- */
const TOOLS = [
  { id:"tAdd",   label:"＋ Character", cls:"go",  aria:"Add a character" },
  { id:"tEdit",  label:"🎨 Change",    aria:"Change the selected character", needSel:true },
  { id:"tCopy",  label:"⧉ Copy",       aria:"Copy the selected character", needSel:true },
  { id:"tUp",    label:"⬆ Front",      aria:"Bring the selected character to the front", needSel:true },
  { id:"tDown",  label:"⬇ Back",       aria:"Send the selected character to the back", needSel:true },
  { id:"tDel",   label:"🗑 Remove",    cls:"warn", aria:"Remove the selected character", needSel:true },
  { id:"tJoint", label:"🦴 Joints",   aria:"Adjust joints with buttons instead of dragging", needSel:true },
  { sep:true },
  { id:"tScene", label:"🎬 Scene",     aria:"Choose where the cartoon happens" },
  { id:"tMode",  label:"Play: Step",      aria:"Playback style: step or smooth" }
];
function buildTools() {
  const box = $("tools"); box.innerHTML = "";
  TOOLS.forEach((t) => {
    if (t.sep) { const s = document.createElement("div"); s.className = "sep"; box.appendChild(s); return; }
    const b = document.createElement("button");
    b.className = "btn" + (t.cls ? " " + t.cls : "");
    b.id = t.id; b.textContent = t.label;
    b.setAttribute("aria-label", t.aria);
    box.appendChild(b);
  });
  $("tAdd").addEventListener("click", () => openWorkshop("add"));
  $("tEdit").addEventListener("click", () => { if (selected()) openWorkshop("edit"); });
  $("tCopy").addEventListener("click", copyCharacter);
  $("tUp").addEventListener("click", () => layer(1));
  $("tDown").addEventListener("click", () => layer(-1));
  $("tDel").addEventListener("click", removeCharacter);
  $("tJoint").addEventListener("click", openJoints);
  $("tScene").addEventListener("click", openScenes);
  $("tMode").addEventListener("click", toggleMode);
}
function refreshSelUI() {
  const has = !!selected();
  TOOLS.forEach((t) => {
    if (!t.needSel || !t.id) return;
    const b = $(t.id); if (b) b.disabled = !has || playing;
  });
  $("tMode").textContent = P.playbackMode === "smooth" ? "Play: Smooth" : "Play: Step";
  $("tMode").setAttribute("aria-label",
    "Playback style: currently " + (P.playbackMode === "smooth" ? "smooth" : "step"));
}
function refreshHistUI() {
  $("bUndo").disabled = !undoStack.length;
  $("bRedo").disabled = !redoStack.length;
}

function commit(label) {            /* snapshot THEN change, for one-tap undo */
  histPush(P);
  if (label) toast(label);
  refreshHistUI();
}
function afterEdit() {
  markFrameDirty();
  refreshStrip(); refreshSelUI(); draw(); autosave();
}

function copyCharacter() {
  const c = selected(); if (!c) return;
  commit();
  const d = clone(c);
  d.id = newId("c");
  d.accessories.forEach((a) => { a.id = newId("a"); });
  d.root.x += 70; d.zIndex = topZ() + 1;
  chars().push(d); selId = d.id;
  afterEdit();
}
function removeCharacter() {
  const c = selected(); if (!c) return;
  commit();
  frame().characters = chars().filter((x) => x.id !== c.id);
  selId = null;
  toast("Removed — tap ↶ to put it back");
  afterEdit();
}
function topZ() { return chars().reduce((m, c) => Math.max(m, c.zIndex), 0); }
function layer(dir) {
  const c = selected(); if (!c) return;
  commit();
  c.zIndex = dir > 0 ? topZ() + 1 : chars().reduce((m, x) => Math.min(m, x.zIndex), 0) - 1;
  afterEdit();
}
function toggleMode() {
  P.playbackMode = P.playbackMode === "smooth" ? "step" : "smooth";
  refreshSelUI(); autosave();
  toast(P.playbackMode === "smooth"
    ? "Smooth: the poses slide into each other"
    : "Step: one pose, then the next");
}

/* ---------------------------------------------------------------------------
   FRAMES
   --------------------------------------------------------------------------- */
function refreshStrip() {
  const box = $("frames");
  box.innerHTML = "";
  const TW = window.innerWidth < 620 ? 74 : 92, TH = Math.round(TW * STAGE_H / STAGE_W);
  P.frames.forEach((f, i) => {
    const b = document.createElement("button");
    b.className = "fr" + (i === frameIx && !playing ? " cur" : "") + (playing && i === playIx ? " playing" : "");
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", String(i === frameIx));
    b.setAttribute("aria-label", "Frame " + (i + 1) + " of " + P.frames.length);
    const c = thumbFor(f, Math.round(TW * 2), Math.round(TH * 2));
    const shown = document.createElement("canvas");
    shown.width = c.width; shown.height = c.height;
    shown.getContext("2d").drawImage(c, 0, 0);
    b.appendChild(shown);
    const no = document.createElement("span");
    no.className = "no"; no.textContent = i + 1;
    b.appendChild(no);
    b.addEventListener("click", () => { if (playing) stopPlayback(); gotoFrame(i); });
    if (i === frameIx && !playing && P.frames.length > 1) {
      [["l", -1, "◀", "Move this frame earlier"], ["r", 1, "▶", "Move this frame later"]].forEach((m) => {
        if ((m[1] < 0 && i === 0) || (m[1] > 0 && i === P.frames.length - 1)) return;
        const mv = document.createElement("button");
        mv.className = "mv " + m[0]; mv.textContent = m[2];
        mv.setAttribute("aria-label", m[3]);
        mv.addEventListener("click", (ev) => { ev.stopPropagation(); moveFrame(m[1]); });
        b.appendChild(mv);
      });
    }
    box.appendChild(b);
  });
  const cur = box.children[playing ? playIx : frameIx];
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block:"nearest", inline:"nearest" });
  $("bDelFrame").disabled = P.frames.length <= 1 || playing;
  $("bSpeed").innerHTML = P.fps + "<small>fps</small>";
}
function gotoFrame(i) {
  frameIx = Math.max(0, Math.min(P.frames.length - 1, i));
  if (!chars().some((c) => c.id === selId)) selId = null;
  refreshStrip(); refreshSelUI(); draw();
}
/* Both of these copy a whole frame — poses, costumes, background and all — so
   that only the thing you want to change has to be touched. The copy keeps the
   SAME character ids, because it is the same cast standing somewhere new.
   `atEnd` is the difference: ＋ frame grows the cartoon, ⧉ slots a copy in
   beside the frame you are looking at. */
function addFrame(atEnd) {
  commit();
  const srcIx = atEnd ? P.frames.length - 1 : frameIx;
  const at = atEnd ? P.frames.length : frameIx + 1;
  const f = duplicateFrame(P.frames[srcIx]);
  P.frames.splice(at, 0, f);
  frameIx = at;
  noteStats((s) => {
    s.totalFrames++;
    s.maxFrames = Math.max(s.maxFrames, P.frames.length);
  });
  celebrate(checkUnlocks());
  warnIfHuge();
  refreshStrip(); refreshSelUI(); draw(); autosave();
}
function deleteFrame() {
  if (P.frames.length <= 1) return;
  confirmSheet("Delete this frame?",
    "Frame " + (frameIx + 1) + " will go. You can always tap ↶ Undo straight afterwards.",
    "Delete it", () => {
      commit();
      const f = P.frames.splice(frameIx, 1)[0];
      thumbCache.delete(f.id);
      frameIx = Math.min(frameIx, P.frames.length - 1);
      selId = null;
      toast("Frame deleted — ↶ puts it back");
      refreshStrip(); refreshSelUI(); draw(); autosave();
    });
}
function moveFrame(dir) {
  const j = frameIx + dir;
  if (j < 0 || j >= P.frames.length) return;
  commit();
  const f = P.frames.splice(frameIx, 1)[0];
  P.frames.splice(j, 0, f);
  frameIx = j;
  refreshStrip(); draw(); autosave();
}
function warnIfHuge() {
  if (bigWarned) return;
  const chars_ = P.frames.reduce((n, f) => n + f.characters.length, 0);
  if (P.frames.length < 180 && chars_ < 700) return;
  bigWarned = true;
  sheetNote("This is a big cartoon now — " + P.frames.length + " frames. It will keep working, " +
    "but it may start to feel slower, and some devices run out of saving room. " +
    "Starting a second cartoon for the next scene is a good idea.");
}

const FPS_STEPS = [2, 3, 4, 6, 8, 12, 16, 24];
$("bSpeed").addEventListener("click", () => {
  const i = FPS_STEPS.indexOf(P.fps);
  P.fps = FPS_STEPS[(i + 1) % FPS_STEPS.length];
  const d = Math.round(1000 / P.fps);
  P.frames.forEach((f) => { f.durationMs = d; });
  refreshStrip(); autosave();
  toast(P.fps + " frames a second");
});
$("bPlay").addEventListener("click", () => { playing ? stopPlayback() : startPlayback(); });
$("bAddFrame").addEventListener("click", () => addFrame(true));
$("bDupFrame").addEventListener("click", () => addFrame(false));
$("bDelFrame").addEventListener("click", deleteFrame);

$("bUndo").addEventListener("click", () => {
  const p = histUndo(P); if (!p) return;
  P = p; clampIx(); thumbCache.clear();
  refreshStrip(); refreshSelUI(); refreshHistUI(); draw(); autosave();
});
$("bRedo").addEventListener("click", () => {
  const p = histRedo(P); if (!p) return;
  P = p; clampIx(); thumbCache.clear();
  refreshStrip(); refreshSelUI(); refreshHistUI(); draw(); autosave();
});
function clampIx() {
  frameIx = Math.max(0, Math.min(P.frames.length - 1, frameIx));
  if (!chars().some((c) => c.id === selId)) selId = null;
}

$("bFit").addEventListener("click", fitView);
$("bGhost").addEventListener("click", () => {
  ghost = !ghost;
  $("bGhost").classList.toggle("on", ghost);
  $("bGhost").setAttribute("aria-pressed", String(ghost));
  draw();
});
$("bLock").addEventListener("click", () => {
  locked = !locked;
  const b = $("bLock");
  b.classList.toggle("on", locked);
  b.setAttribute("aria-pressed", String(locked));
  b.textContent = locked ? "🔒 Locked" : "🔓 Pose";
  b.setAttribute("aria-label", locked
    ? "Poses are locked. Tap to let limbs move again."
    : "Poses can be changed. Tap to lock them.");
  toast(locked ? "Limbs locked — you can still move the whole character" : "You can pose limbs again");
  draw();
});

/* ---------------------------------------------------------------------------
   JOINT INSPECTOR
   Dragging a handle is the fun way, but hands and feet sit close together and
   not everybody can land on a small target. Every joint can also be nudged a
   few degrees at a time with a plain pair of buttons, which needs no aim at
   all and is the only way some people will be able to use this at all.
   --------------------------------------------------------------------------- */
function openJoints() {
  const c = selected(); if (!c) return;
  openSheet("Nudge the joints", '<div id="jtList"></div>' +
    '<div class="note">Every one of these can also be posed by dragging its white dot on the stage. ' +
    "This way is for when that is fiddly.</div>", [
    { label:"Straighten everything", go:() => {
        commit(); c.joints = restPose(); renderJoints(); afterEdit(); } },
    { label:"Done", cls:"go", go:closeSheet }
  ]);
  renderJoints();
}
function renderJoints() {
  const c = selected(), box = $("jtList");
  if (!c || !box) return;
  box.innerHTML = "";
  HANDLES.filter((n) => n !== "neck").forEach((n) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:7px";
    const lab = document.createElement("span");
    lab.style.cssText = "flex:1;font-size:.86rem;font-weight:bold";
    lab.textContent = HANDLE_LABEL[n];
    const val = document.createElement("span");
    val.style.cssText = "font-size:.76rem;color:var(--ink2);min-width:46px;text-align:right";
    val.textContent = Math.round(c.joints[n]) + "\u00b0";
    [["\u2212", -8, "Bend the " + HANDLE_LABEL[n] + " one way"],
     ["+", 8, "Bend the " + HANDLE_LABEL[n] + " the other way"]].forEach((b) => {
      const el = document.createElement("button");
      el.className = "btn"; el.textContent = b[0];
      el.setAttribute("aria-label", b[2]);
      el.addEventListener("click", () => {
        if (!nudging) { commit(); nudging = true; setTimeout(() => { nudging = false; }, 900); }
        c.joints[n] = clampJoint(n, c.joints[n] + b[1]);
        val.textContent = Math.round(c.joints[n]) + "\u00b0";
        afterEdit();
      });
      row.appendChild(el);
    });
    row.insertBefore(val, row.firstChild);
    row.insertBefore(lab, row.firstChild);
    box.appendChild(row);
  });
}
let nudging = false;

/* ---------------------------------------------------------------------------
   CHARACTER WORKSHOP
   --------------------------------------------------------------------------- */
let ws = null;
function previewChar(draft) {
  return makeCharacter({
    type:draft.type, eyeStyle:draft.eyeStyle, colour:draft.colour,
    accessories:draft.accessories.slice(), x:0, y:0
  });
}
function miniCanvas(draft, w, h, zoom) {
  const c = document.createElement("canvas");
  c.width = w * 2; c.height = h * 2;
  c.style.width = w + "px"; c.style.height = h + "px";
  const t = c.getContext("2d");
  const ch = previewChar(draft);
  const z = (zoom || 0.3) * 2;
  t.save();
  t.translate(c.width / 2, c.height * 0.63);
  t.scale(z, z);
  drawCharacter(t, ch, {});
  t.restore();
  return c;
}
function openWorkshop(mode) {
  const cur = mode === "edit" ? selected() : null;
  ws = {
    mode: mode,
    id: cur ? cur.id : null,
    type: cur ? cur.type : "regular",
    eyeStyle: cur ? cur.eyeStyle : "dots",
    colour: cur ? cur.colour : null,
    accessories: cur ? cur.accessories.map((a) => a.type) : []
  };
  openSheet(mode === "edit" ? "Change this character" : "Add a character", "", [
    { label:"Cancel", go:closeSheet },
    { label: mode === "edit" ? "Save changes" : "Put it on stage", cls:"go", go:applyWorkshop }
  ]);
  renderWorkshop();
}
function renderWorkshop() {
  const b = $("shB");
  b.innerHTML =
    '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">' +
      '<div id="wsPrev" style="flex:0 0 auto;background:#fff;border:3px solid var(--line);border-radius:14px;padding:4px"></div>' +
      '<div style="flex:1;min-width:190px"><div class="fieldlab">Who</div><div class="cards" id="wsTypes"></div></div>' +
    "</div>" +
    '<div class="fieldlab">Eyes <span style="font-weight:normal;text-transform:none;letter-spacing:0">(no mouths in this game)</span></div>' +
    '<div class="cards" id="wsEyes"></div>' +
    '<div class="fieldlab">Colour</div><div class="pillrow" id="wsCols"></div>' +
    '<div class="fieldlab">Things to wear</div><div class="cards" id="wsAcc"></div>';

  $("wsPrev").appendChild(miniCanvas(ws, 128, 172, 0.40));

  const types = $("wsTypes");
  TYPES.forEach((t) => {
    const ok = typeAvailable(t.id);
    const card = document.createElement("button");
    card.className = "card" + (ws.type === t.id ? " sel" : "") + (ok ? "" : " locked");
    card.disabled = !ok;
    card.setAttribute("aria-label", t.nm + (ok ? "" : " — locked. " + howToGet(t.need)));
    card.appendChild(miniCanvas({ type:t.id, eyeStyle:"dots", colour:null, accessories:[] }, 62, 80, 0.19));
    const nm = document.createElement("span"); nm.className = "cn"; nm.textContent = t.nm;
    card.appendChild(nm);
    if (!ok) { const lk = document.createElement("span"); lk.className = "lk";
      lk.textContent = "🔒 " + howToGet(t.need); card.appendChild(lk); }
    else if (ws.type === t.id) { const tk = document.createElement("span");
      tk.className = "tick"; tk.textContent = "✓"; card.appendChild(tk); }
    if (ok) card.addEventListener("click", () => { ws.type = t.id; renderWorkshop(); });
    types.appendChild(card);
  });

  const eyes = $("wsEyes");
  EYES.forEach((e) => {
    const card = document.createElement("button");
    card.className = "card" + (ws.eyeStyle === e.id ? " sel" : "");
    card.setAttribute("aria-label", "Eyes: " + e.nm);
    card.appendChild(eyeSwatch(e.id, ws.colour));
    const nm = document.createElement("span"); nm.className = "cn"; nm.textContent = e.nm;
    card.appendChild(nm);
    card.addEventListener("click", () => { ws.eyeStyle = e.id; renderWorkshop(); });
    eyes.appendChild(card);
  });

  const cols = $("wsCols");
  const none = document.createElement("button");
  none.className = "swatch" + (ws.colour ? "" : " sel");
  none.style.background = "repeating-linear-gradient(45deg,#fff,#fff 6px,#ddd 6px,#ddd 12px)";
  none.setAttribute("aria-label", "Default colour");
  none.addEventListener("click", () => { ws.colour = null; renderWorkshop(); });
  cols.appendChild(none);
  COLOURS.forEach((c) => {
    const s = document.createElement("button");
    s.className = "swatch" + (ws.colour === c ? " sel" : "");
    s.style.background = c;
    s.setAttribute("aria-label", "Colour " + c);
    s.addEventListener("click", () => { ws.colour = c; renderWorkshop(); });
    cols.appendChild(s);
  });

  const acc = $("wsAcc");
  ACCS.forEach((a) => {
    const ok = accAvailable(a.id);
    const on = ws.accessories.indexOf(a.id) !== -1;
    const card = document.createElement("button");
    card.className = "card" + (on ? " sel" : "") + (ok ? "" : " locked");
    card.disabled = !ok;
    card.setAttribute("aria-label", a.nm + (ok ? (on ? " — on" : " — off") : " — locked. " + howToGet(a.need)));
    card.appendChild(miniCanvas({ type:ws.type, eyeStyle:"dots", colour:ws.colour, accessories:[a.id] }, 62, 80, 0.19));
    const nm = document.createElement("span"); nm.className = "cn"; nm.textContent = a.nm;
    card.appendChild(nm);
    if (!ok) { const lk = document.createElement("span"); lk.className = "lk";
      lk.textContent = "🔒 " + howToGet(a.need); card.appendChild(lk); }
    else if (on) { const tk = document.createElement("span");
      tk.className = "tick"; tk.textContent = "✓"; card.appendChild(tk); }
    if (ok) card.addEventListener("click", () => {
      const i = ws.accessories.indexOf(a.id);
      if (i === -1) ws.accessories.push(a.id); else ws.accessories.splice(i, 1);
      renderWorkshop();
    });
    acc.appendChild(card);
  });
}
function eyeSwatch(style, colour) {
  const c = document.createElement("canvas");
  c.width = 124; c.height = 124; c.style.width = "62px"; c.style.height = "62px";
  const t = c.getContext("2d");
  t.fillStyle = "#fff3dc"; t.strokeStyle = colour || "#2b2a3d"; t.lineWidth = 5;
  t.beginPath(); t.arc(62, 62, 44, 0, 7); t.fill(); t.stroke();
  t.save(); t.translate(62, 62);
  drawEyes(t, style, 44, colour || "#2b2a3d", 1.7);
  t.restore();
  return c;
}
/* Changing a character applies to the character ON EVERY FRAME it appears in,
   because a Ninja that turns into a Robot halfway through a cartoon is almost
   never what anybody meant. The pose in each frame is left exactly as it was. */
function applyWorkshop() {
  commit();
  if (ws.mode === "add") {
    const c = makeCharacter({
      type:ws.type, eyeStyle:ws.eyeStyle, colour:ws.colour, accessories:ws.accessories,
      x: STAGE_W / 2 + (chars().length % 5 - 2) * 150, y: STAGE_H * 0.64,
      zIndex: topZ() + 1
    });
    chars().push(c);
    selId = c.id;
  } else {
    let touched = 0;
    P.frames.forEach((f) => {
      const c = f.characters.find((x) => x.id === ws.id);
      if (!c) return;
      touched++;
      c.type = ws.type; c.eyeStyle = ws.eyeStyle; c.colour = ws.colour;
      c.accessories = ws.accessories.map((t) => ({ id:newId("a"), type:t, anchor:ACC[t].anchor }));
      thumbCache.delete(f.id);
    });
    if (touched > 1) toast("Changed in all " + touched + " frames");
  }
  closeSheet();
  afterEdit();
}

/* ---------------------------------------------------------------------------
   SCENE PICKER
   --------------------------------------------------------------------------- */
function openScenes() {
  openSheet("Where does it happen?", '<div class="cards" id="bgCards"></div>' +
    '<div class="note">The background is part of the frame, so you can change scene ' +
    "partway through a cartoon and it will change as it plays.</div>", [
    { label:"Done", cls:"go", go:closeSheet }]);
  const box = $("bgCards");
  BGS.forEach((b) => {
    const card = document.createElement("button");
    card.className = "card" + (frame().backgroundId === b.id ? " sel" : "");
    card.setAttribute("aria-label", "Background: " + b.nm);
    const c = document.createElement("canvas");
    c.width = 192; c.height = 120; c.style.width = "96px"; c.style.height = "60px";
    const t = c.getContext("2d");
    t.save(); t.scale(192 / STAGE_W, 120 / STAGE_H); drawBg(t, b.id); t.restore();
    card.appendChild(c);
    const nm = document.createElement("span"); nm.className = "cn"; nm.textContent = b.nm;
    card.appendChild(nm);
    card.addEventListener("click", () => {
      commit();
      frame().backgroundId = b.id;
      noteStats((s) => { if (s.bgs.indexOf(b.id) === -1) s.bgs.push(b.id); });
      celebrate(checkUnlocks());
      closeSheet(); afterEdit();
    });
    box.appendChild(card);
  });
}

/* ---------------------------------------------------------------------------
   LIBRARY — many cartoons, each its own saved thing. Starting a new one never
   touches an old one.
   --------------------------------------------------------------------------- */
function openLibrary() {
  if (playing) stopPlayback();
  saveNow();
  openSheet("📁 My cartoons", '<div id="libList"></div>', [
    { label:"Close", go:closeSheet },
    { label:"＋ New cartoon", cls:"go", go:newCartoon }
  ]);
  renderLibrary();
}
function renderLibrary() {
  const box = $("libList");
  if (!box) return;
  box.innerHTML = "";
  if (!DB.index.length) {
    box.innerHTML = '<div class="note">No cartoons saved yet.</div>';
    return;
  }
  DB.index.forEach((row) => {
    const d = document.createElement("div");
    d.className = "prj" + (P && row.id === P.id ? " cur" : "");
    const c = document.createElement("canvas");
    c.width = 160; c.height = 100; c.style.width = "80px"; c.style.height = "50px";
    const p = (P && row.id === P.id) ? P : loadProject(row.id);
    if (p) renderThumb(p.frames[0], c);
    d.appendChild(c);
    const meta = document.createElement("div");
    meta.className = "meta";
    const when = new Date(row.updatedAt);
    meta.innerHTML = "<b>" + esc(row.title) + "</b><span>" + row.frames +
      (row.frames === 1 ? " frame" : " frames") + " · " +
      (isNaN(when) ? "" : when.toLocaleDateString()) +
      (P && row.id === P.id ? " · open now" : "") + "</span>";
    d.appendChild(meta);
    const acts = document.createElement("div");
    acts.className = "acts";
    [["Open", "go", () => openCartoon(row.id)],
     ["⧉", "", () => dupCartoon(row.id)],
     ["🗑", "warn", () => delCartoon(row)]].forEach((a) => {
      const b = document.createElement("button");
      b.className = "btn " + a[1]; b.textContent = a[0];
      b.setAttribute("aria-label",
        a[0] === "⧉" ? "Make a copy of " + row.title :
        a[0] === "🗑" ? "Delete " + row.title : "Open " + row.title);
      if (a[0] === "Open" && P && row.id === P.id) b.disabled = true;
      b.addEventListener("click", a[2]);
      acts.appendChild(b);
    });
    d.appendChild(acts);
    box.appendChild(d);
  });
}
function newCartoon() {
  saveNow();
  const n = DB.index.length + 1;
  const p = makeProject("Cartoon " + n);
  noteStats((s) => { s.projects++; });
  celebrate(checkUnlocks());
  saveProject(p, () => {});
  DB.currentId = p.id; writeDB();
  adopt(p);
  closeSheet();
  toast("New cartoon started — the old ones are safe in 📁");
}
function openCartoon(id) {
  saveNow();
  const p = loadProject(id);
  if (!p) { sheetNote("That cartoon could not be opened. It may have been damaged.", true); return; }
  DB.currentId = id; writeDB();
  adopt(p);
  closeSheet();
}
function dupCartoon(id) {
  const src = (P && P.id === id) ? P : loadProject(id);
  if (!src) return;
  const copy = clone(src);
  copy.id = newId("p");
  copy.title = (src.title + " copy").slice(0, 60);
  copy.createdAt = copy.updatedAt = new Date().toISOString();
  copy.frames.forEach((f) => { f.id = newId("f"); });
  noteStats((s) => { s.projects++; });
  celebrate(checkUnlocks());
  if (!saveProject(copy, () => {})) {
    sheetNote("There was not enough room to copy that one.", true); return;
  }
  renderLibrary();
  toast("Copied");
}
function delCartoon(row) {
  confirmSheet("Delete “" + row.title + "”?",
    "This one cannot be undone — the cartoon will be gone for good.", "Delete it", () => {
      const wasCurrent = P && P.id === row.id;
      deleteProject(row.id);
      if (wasCurrent) {
        const next = DB.index[0] ? loadProject(DB.index[0].id) : null;
        adopt(next || makeProject("My cartoon"));
        if (!next) saveProject(P, () => {});
        DB.currentId = P.id; writeDB();
      }
      openLibrary();
    });
}
function adopt(p) {
  P = p;
  frameIx = 0; selId = null; bigWarned = false;
  histReset(); thumbCache.clear(); fitted = false;
  $("tName").textContent = P.title;
  $("tSub").textContent = "tap to rename";
  fitView(); refreshStrip(); refreshSelUI(); refreshHistUI(); setSaved("saved"); draw();
}
$("bLib").addEventListener("click", openLibrary);

/* rename */
$("tTitle").addEventListener("click", () => {
  openSheet("Name this cartoon",
    '<input id="rnIn" type="text" maxlength="60" value="' + esc(P.title) + '" ' +
    'style="width:100%;font:inherit;font-size:1rem;padding:12px;border:2px solid var(--line);' +
    'border-radius:12px;min-height:48px" aria-label="Cartoon name">', [
    { label:"Cancel", go:closeSheet },
    { label:"Save name", cls:"go", go:() => {
      const v = ($("rnIn").value || "").trim().slice(0, 60);
      if (v) { P.title = v; $("tName").textContent = v; autosave(); }
      closeSheet();
    } }
  ]);
  const i = $("rnIn"); if (i) { i.focus(); i.select(); }
});

/* ---------------------------------------------------------------------------
   FIRST-RUN HINT — one card, one obvious way to get rid of it, never again.
   --------------------------------------------------------------------------- */
function maybeHint() {
  if (DB.hintSeen) return;
  $("hintText").innerHTML =
    "<b>Tap a character to pick it.</b> White dots are its joints — drag one to bend that bit. " +
    "The big blue ✥ moves the whole body. Then press <b>＋ frame</b>, move it a little, and press ▶.";
  $("hint").hidden = false;
}
$("hintOk").addEventListener("click", () => {
  $("hint").hidden = true;
  DB.hintSeen = true; writeDB();
});

/* ---------------------------------------------------------------------------
   KEYBOARD — a convenience, never the only way to do anything.
   --------------------------------------------------------------------------- */
window.addEventListener("keydown", (e) => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === "z") { e.preventDefault(); (e.shiftKey ? $("bRedo") : $("bUndo")).click(); }
  else if (k === " ") { e.preventDefault(); $("bPlay").click(); }
  else if (k === "arrowleft") { e.preventDefault(); gotoFrame(frameIx - 1); }
  else if (k === "arrowright") { e.preventDefault(); gotoFrame(frameIx + 1); }
  else if (k === "escape" && $("sheet").classList.contains("show")) closeSheet();
});

/* ---------------------------------------------------------------------------
   START
   --------------------------------------------------------------------------- */
function boot() {
  DB = readDB();
  const recovered = recoverIndex();

  let p = DB.currentId ? loadProject(DB.currentId) : null;
  if (!p && DB.index.length) p = loadProject(DB.index[0].id);
  if (!p) {
    p = makeProject("My first cartoon");
    p.frames[0].characters.push(makeCharacter({ type:"regular", x:STAGE_W / 2, y:STAGE_H * 0.64 }));
    noteStats((s) => { s.projects++; });
    saveProject(p, () => {});
  }
  DB.currentId = p.id; writeDB();

  buildTools();
  adopt(p);
  maybeHint();
  if (recovered.length) {
    toast("Recovered " + recovered.length + (recovered.length === 1 ? " cartoon" : " cartoons"), 3200);
  }

  if (window.ResizeObserver) new ResizeObserver(resize).observe($("stagewrap"));
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 220));
  document.addEventListener("visibilitychange", () => { if (document.hidden) { stopPlayback(); saveNow(); } });
  window.addEventListener("pagehide", saveNow);
  resize();
  tick();
}

/* Opened up so the pose maths, cloning, ids, saving and unlocks can be tested
   on their own rather than only through the screen. */
window.Cartoon = {
  STAGE_W:STAGE_W, STAGE_H:STAGE_H, BONES:BONES, JOINT_NAMES:JOINT_NAMES, HANDLES:HANDLES,
  TYPES:TYPES, EYES:EYES, ACCS:ACCS, BGS:BGS, UNLOCKS:UNLOCKS, SCHEMA:SCHEMA,
  skeleton:skeleton, headDisc:headDisc, aimBone:aimBone, clampJoint:clampJoint, wrapDeg:wrapDeg,
  restPose:restPose, makeCharacter:makeCharacter, makeFrame:makeFrame, makeProject:makeProject,
  duplicateFrame:duplicateFrame, clone:clone, newId:newId,
  serialise:serialise, migrate:migrate, sanitiseProject:sanitiseProject,
  tweenCharacter:tweenCharacter, tweenFrame:tweenFrame,
  saveProject:saveProject, loadProject:loadProject, recoverIndex:recoverIndex,
  checkUnlocks:checkUnlocks, typeAvailable:typeAvailable, accAvailable:accAvailable,
  get DB() { return DB; }, get P() { return P; },
  get frameIx() { return frameIx; }, get selId() { return selId; },
  set selId(v) { selId = v; refreshSelUI(); draw(); },
  get playing() { return playing; },
  addFrame:addFrame, gotoFrame:gotoFrame, deleteFrame:deleteFrame, moveFrame:moveFrame,
  startPlayback:startPlayback, stopPlayback:stopPlayback,
  openWorkshop:openWorkshop, openLibrary:openLibrary, newCartoon:newCartoon,
  __draw:(g2, ch) => drawCharacter(g2, ch, {}),
  toScreen:toScreen, toWorld:toWorld, fitView:fitView, pickCharacter:pickCharacter,
  saveNow:saveNow, boot:boot
};

boot();

</script>
