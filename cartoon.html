<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />

  <meta name="referrer" content="no-referrer">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <title>Make a Cartoon</title>
<style>
  :root{
    --bg:#171a2b; --panel:#f4f1ea; --ink:#23203a; --ink2:#6d6785;
    --line:#d6cfc0; --white:#fffdf8; --accent:#4a7de0; --go:#1f8a52;
    --warn:#c2473f; --gold:#e0a21c; --bar:#201f36;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- buttons, shared ---------- */
  .btn{
    font-family:inherit;font-size:.86rem;font-weight:bold;color:var(--ink);
    background:var(--white);border:2px solid var(--line);border-radius:12px;
    min-height:46px;min-width:46px;padding:8px 13px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    white-space:nowrap;line-height:1.1;
  }
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.38;cursor:default}
  .btn.on{background:var(--accent);border-color:#2f5cb0;color:#fff}
  .btn.go{background:var(--go);border-color:#17663c;color:#fff}
  .btn.warn{background:#f6e2e1;border-color:#d8a9a5;color:#8d2f29}
  .btn.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#f2efe6}
  .btn .ic{font-size:1.1rem}
  .btn small{display:block;font-size:.66rem;font-weight:normal;opacity:.7}

  /* ---------- top bar ---------- */
  .top{
    flex:0 0 auto;background:var(--bar);color:#f2efe6;
    display:flex;align-items:center;gap:7px;padding:6px 9px;
  }
  .top .ttl{
    flex:1;min-width:0;font-weight:bold;font-size:.95rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:none;border:none;color:#f2efe6;font-family:inherit;
    text-align:left;padding:8px 6px;min-height:44px;cursor:pointer;
  }
  .top .ttl .sub{display:block;font-size:.66rem;font-weight:normal;opacity:.62}
  .saved{font-size:.7rem;opacity:.7;white-space:nowrap;padding:0 4px}
  .saved.busy{color:#ffd98a}

  /* ---------- stage ---------- */
  .stagewrap{flex:1 1 auto;position:relative;min-height:0;background:#0e1020;overflow:hidden}
  canvas#stage{display:block;width:100%;height:100%;touch-action:none}
  .float{position:absolute;display:flex;gap:6px;z-index:5}
  .float.tl{top:8px;left:8px}
  .float.tr{top:8px;right:8px;flex-direction:column;align-items:flex-end}
  .float .btn{min-height:44px;padding:6px 10px;font-size:.78rem;
    background:rgba(28,30,50,.84);border-color:rgba(255,255,255,.26);color:#f2efe6}
  .float .btn.on{background:var(--accent);border-color:#8fb4ff;color:#fff}
  .hintcard{
    position:absolute;left:50%;top:10px;transform:translateX(-50%);
    background:rgba(18,20,36,.95);color:#f4f1ea;border:2px solid var(--gold);
    border-radius:14px;padding:10px 14px;max-width:min(92%,520px);z-index:9;
    font-size:.84rem;line-height:1.5;display:flex;gap:10px;align-items:flex-start;
  }
  .hintcard[hidden]{display:none}   /* a class with display:flex beats the hidden attribute */
  .hintcard p{margin:0}
  .hintcard .btn{flex:0 0 auto;min-height:40px;padding:6px 10px;font-size:.76rem}
  .bigmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#8e8aa8;font-size:.95rem;text-align:center;padding:24px;pointer-events:none}

  /* ---------- tool row ---------- */
  .tools{
    flex:0 0 auto;display:flex;gap:7px;padding:7px 9px;background:#2a2843;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  }
  .tools::-webkit-scrollbar{height:0}
  .tools .sep{flex:0 0 auto;width:1px;background:rgba(255,255,255,.17);margin:4px 2px}

  /* ---------- frame strip ---------- */
  .strip{
    flex:0 0 auto;background:var(--panel);border-top:3px solid #3a3658;
    display:flex;align-items:stretch;gap:8px;padding:7px 8px;
  }
  .strip .grp{display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .frames{
    flex:1 1 auto;min-width:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;align-items:center;padding:2px;
  }
  .fr{
    flex:0 0 auto;position:relative;width:92px;height:66px;border-radius:10px;
    border:3px solid var(--line);background:#fff;overflow:hidden;cursor:pointer;padding:0;
  }
  .fr canvas{display:block;width:100%;height:100%}
  .fr .no{position:absolute;left:3px;top:2px;background:rgba(20,18,36,.72);color:#fff;
    font-size:.64rem;font-weight:bold;border-radius:6px;padding:1px 5px}
  .fr.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,125,224,.3)}
  .fr.playing{border-color:var(--go)}
  .fr .mv{position:absolute;bottom:2px;width:26px;height:24px;border:none;border-radius:6px;
    background:rgba(20,18,36,.6);color:#fff;font-size:.8rem;cursor:pointer;padding:0}
  .fr .mv.l{left:2px} .fr .mv.r{right:2px}

  /* ---------- sheets (modal panels) ---------- */
  .sheet{position:fixed;inset:0;background:rgba(10,8,20,.72);z-index:60;
    display:none;align-items:center;justify-content:center;padding:14px}
  .sheet.show{display:flex}
  .sheetbox{background:var(--panel);border-radius:20px;width:100%;max-width:760px;
    max-height:92vh;display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.6)}
  .sheethd{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:2px solid var(--line)}
  .sheethd h2{margin:0;font-size:1.05rem;flex:1}
  .sheetbd{padding:13px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheetft{padding:11px 13px;border-top:2px solid var(--line);display:flex;gap:8px;
    flex-wrap:wrap;justify-content:flex-end}

  .cards{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .card{
    background:var(--white);border:3px solid var(--line);border-radius:14px;padding:8px 6px;
    text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);min-height:120px;
    display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;
  }
  .card.sel{border-color:var(--accent);background:#eef3fd}
  .card.locked{opacity:.62;cursor:default;background:#ece7dc}
  .card canvas{display:block;border-radius:8px}
  .card .cn{font-size:.78rem;font-weight:bold;line-height:1.15}
  .card .lk{font-size:.64rem;color:#8d2f29;line-height:1.25;margin-top:1px}
  .card .tick{position:absolute;top:3px;right:5px;font-size:.95rem}

  .fieldlab{font-size:.74rem;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);margin:14px 0 6px}
  .fieldlab:first-child{margin-top:0}
  .pillrow{display:flex;flex-wrap:wrap;gap:7px}
  .swatch{width:46px;height:46px;border-radius:12px;border:3px solid var(--line);cursor:pointer;padding:0}
  .swatch.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(35,32,58,.2)}

  .prj{display:flex;gap:10px;align-items:center;background:var(--white);
    border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:9px}
  .prj canvas{flex:0 0 auto;border-radius:9px;border:1px solid var(--line)}
  .prj .meta{flex:1;min-width:0}
  .prj .meta b{display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prj .meta span{font-size:.72rem;color:var(--ink2)}
  .prj .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .prj .acts .btn{min-height:42px;padding:6px 9px;font-size:.76rem}
  .prj.cur{border-color:var(--accent);background:#eef3fd}

  .note{background:#fff6e0;border:2px solid var(--gold);border-radius:12px;
    padding:9px 11px;font-size:.82rem;line-height:1.5;margin:10px 0}
  .note.bad{background:#fae8e6;border-color:#d8a9a5}

  .toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:rgba(16,14,30,.96);color:#fff;
    border:2px solid var(--gold);border-radius:13px;padding:10px 16px;font-weight:bold;
    font-size:.84rem;max-width:90vw;text-align:center;z-index:90;display:none;pointer-events:none}
  .toast.show{display:block}

  .unlock{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--panel);border:4px solid var(--gold);border-radius:22px;
    padding:18px 22px;text-align:center;z-index:95;display:none;
    box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:92vw}
  .unlock.show{display:block}
  .unlock .big{font-size:2.6rem;line-height:1}
  .unlock h3{margin:6px 0 4px;font-size:1.1rem}
  .unlock p{margin:0 0 10px;font-size:.86rem;color:var(--ink2)}

  .sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* Phone / portrait: keep everything reachable, shrink the furniture. */
  @media (max-height:560px), (max-width:620px){
    .fr{width:74px;height:54px}
    .btn{font-size:.78rem;padding:7px 10px}
    .strip{padding:5px 6px;gap:6px}
  }
</style>

<body>

<div class="top">
  <a class="btn ghost" href="index.html" aria-label="Back to Dot Arcade">←</a>
  <button class="ttl" id="tTitle" aria-label="Project name — tap to rename">
    <span id="tName">Untitled cartoon</span>
    <span class="sub" id="tSub">tap to rename</span>
  </button>
  <span class="saved" id="tSaved">saved</span>
  <button class="btn ghost" id="bUndo" aria-label="Undo" title="Undo">↶</button>
  <button class="btn ghost" id="bRedo" aria-label="Redo" title="Redo">↷</button>
  <button class="btn ghost" id="bLib" aria-label="My cartoons">📁</button>
</div>

<div class="stagewrap" id="stagewrap">
  <canvas id="stage"></canvas>
  <div class="float tl">
    <button class="btn" id="bFit" aria-label="Fit the whole stage on screen">⤢ Fit</button>
  </div>
  <div class="float tr">
    <button class="btn" id="bGhost" aria-pressed="false" aria-label="Show a ghost of the frame before">👻 Ghost</button>
    <button class="btn" id="bLock" aria-pressed="false" aria-label="Lock poses so limbs cannot move">🔓 Pose</button>
  </div>
  <div class="hintcard" id="hint" hidden>
    <p id="hintText"></p>
    <button class="btn" id="hintOk">Got it</button>
  </div>
</div>

<div class="tools" id="tools"></div>

<div class="strip">
  <div class="grp">
    <button class="btn go" id="bPlay" aria-label="Play the cartoon"><span class="ic">▶</span></button>
    <button class="btn" id="bSpeed" aria-label="Playback speed">6<small>fps</small></button>
  </div>
  <div class="frames" id="frames" role="listbox" aria-label="Frames"></div>
  <div class="grp">
    <button class="btn go" id="bAddFrame" aria-label="Add a new frame">＋<small>frame</small></button>
    <button class="btn" id="bDupFrame" aria-label="Duplicate this frame">⧉</button>
    <button class="btn warn" id="bDelFrame" aria-label="Delete this frame">🗑</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="unlock" id="unlock" role="status" aria-live="polite">
  <div class="big" id="ulE">🎁</div>
  <h3 id="ulT"></h3>
  <p id="ulP"></p>
  <button class="btn go" id="ulOk">Nice!</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sheetbox">
    <div class="sheethd"><h2 id="shT"></h2>
      <button class="btn" id="shX" aria-label="Close">✕</button></div>
    <div class="sheetbd" id="shB"></div>
    <div class="sheetft" id="shF"></div>
  </div>
</div>

<script>
"use strict";
/* ===========================================================================
   MAKE A CARTOON
   A stick-figure animation studio. Pose a character, add a frame, pose again,
   press play.

   Two decisions worth knowing about before reading on:

   1. The rig is stored as LOCAL JOINT ANGLES, not joint positions. One number
      per joint, in degrees, measured against the bone it hangs off. That means
      limb lengths can never stretch, joint limits are a simple clamp, and
      smooth playback is just "lerp the angles". Storing joint positions would
      need inverse kinematics and would let arms grow.

   2. Everything is drawn on a 2D canvas rather than SVG, because that is what
      every other game in this hub uses, because one painter can then draw both
      the stage and the little frame thumbnails (so they can never drift apart),
      and because hit-testing fourteen crowded joint handles is more reliable as
      "whichever handle is nearest the finger" than as overlapping DOM targets.
   =========================================================================== */

const STAGE_W = 1000, STAGE_H = 620;      // one fixed world, whatever the screen
const DEG = Math.PI / 180;
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------------------
   THE SKELETON
   Bones in parent-before-child order. `from` is the bone whose far end this one
   hangs off ("root" means the character's hip point). `off` nudges the join in
   character space. `rest` is the angle it sits at before any posing, and
   min/max are how far it is allowed to be bent from there.
   --------------------------------------------------------------------------- */
const BONES = [
  { n:"torso",         from:"root",          off:{x:0,y:0},   len:86, rest:-90,  min:-55,  max:55,  w:7 },
  { n:"neck",          from:"torso",         off:{x:0,y:0},   len:14, rest:0,    min:-35,  max:35,  w:6 },
  { n:"head",          from:"neck",          off:{x:0,y:0},   len:40, rest:0,    min:-48,  max:48,  w:0 },
  { n:"leftShoulder",  from:"torso",         off:{x:-12,y:3}, len:46, rest:-160, min:-200, max:200, w:6 },
  { n:"leftElbow",     from:"leftShoulder",  off:{x:0,y:0},   len:42, rest:0,    min:-10,  max:160, w:5.5 },
  { n:"leftWrist",     from:"leftElbow",     off:{x:0,y:0},   len:30, rest:0,    min:-75,  max:75,  w:5 },
  { n:"rightShoulder", from:"torso",         off:{x:12,y:3},  len:46, rest:160,  min:-200, max:200, w:6 },
  { n:"rightElbow",    from:"rightShoulder", off:{x:0,y:0},   len:42, rest:0,    min:-160, max:10,  w:5.5 },
  { n:"rightWrist",    from:"rightElbow",    off:{x:0,y:0},   len:30, rest:0,    min:-75,  max:75,  w:5 },
  { n:"leftHip",       from:"root",          off:{x:-9,y:0},  len:52, rest:100,  min:-200, max:200, w:6.5 },
  { n:"leftKnee",      from:"leftHip",       off:{x:0,y:0},   len:48, rest:0,    min:-160, max:10,  w:6 },
  { n:"leftAnkle",     from:"leftKnee",      off:{x:0,y:0},   len:30, rest:80,   min:-55,  max:55,  w:5.5 },
  { n:"rightHip",      from:"root",          off:{x:9,y:0},   len:52, rest:80,   min:-200, max:200, w:6.5 },
  { n:"rightKnee",     from:"rightHip",      off:{x:0,y:0},   len:48, rest:0,    min:-10,  max:160, w:6 },
  { n:"rightAnkle",    from:"rightKnee",     off:{x:0,y:0},   len:30, rest:-80,  min:-55,  max:55,  w:5.5 }
];
const BONE = {};
BONES.forEach((b) => { BONE[b.n] = b; });
const JOINT_NAMES = BONES.map((b) => b.n);

/* Handles the player can actually grab, in the order they are hit-tested.
   Hands, feet and head come first so they win a tie against the limb above. */
const HANDLES = ["head","leftWrist","rightWrist","leftAnkle","rightAnkle",
                 "leftElbow","rightElbow","leftKnee","rightKnee",
                 "leftShoulder","rightShoulder","leftHip","rightHip","neck","torso"];

const HANDLE_LABEL = {
  torso:"body lean", neck:"neck", head:"head",
  leftShoulder:"left upper arm", leftElbow:"left forearm", leftWrist:"left hand",
  rightShoulder:"right upper arm", rightElbow:"right forearm", rightWrist:"right hand",
  leftHip:"left thigh", leftKnee:"left shin", leftAnkle:"left foot",
  rightHip:"right thigh", rightKnee:"right shin", rightAnkle:"right foot"
};

function restPose() {
  const j = {};
  BONES.forEach((b) => { j[b.n] = 0; });
  return j;
}
function clampJoint(name, deg) {
  const b = BONE[name];
  if (!b) return 0;
  return Math.max(b.min, Math.min(b.max, deg));
}
/* Wrap to (-180, 180] so "turn a bit left" never becomes "spin all the way round". */
function wrapDeg(d) {
  d = ((d + 180) % 360 + 360) % 360 - 180;
  return d;
}

/* ---------------------------------------------------------------------------
   FORWARD KINEMATICS
   Turn a character's angles into world-space line segments. Pure: give it the
   same character and it gives the same bones back, which is what makes the
   pose maths testable on its own.
   --------------------------------------------------------------------------- */
function skeleton(ch) {
  const out = {};
  const s = ch.scale || 1;
  const rot = (ch.rotation || 0) * DEG;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const rx = ch.root.x, ry = ch.root.y;

  for (let i = 0; i < BONES.length; i++) {
    const b = BONES[i];
    let px, py, pang;
    if (b.from === "root") { px = rx; py = ry; pang = rot; }
    else { const pa = out[b.from]; px = pa.bx; py = pa.by; pang = pa.ang; }
    /* the join nudge is in character space, so it turns with the whole body
       but not with the limb it hangs off */
    const ox = b.off.x * s, oy = b.off.y * s;
    const ax = px + (ox * cr - oy * sr);
    const ay = py + (ox * sr + oy * cr);
    const ang = pang + (b.rest + (ch.joints[b.n] || 0)) * DEG;
    const len = b.len * s;
    out[b.n] = { ax:ax, ay:ay, bx:ax + Math.cos(ang) * len, by:ay + Math.sin(ang) * len,
                 ang:ang, len:len, w:b.w * s };
  }
  return out;
}

/* Where the head circle sits, and how big. Eyes and hats hang off this. */
function headDisc(ch, sk) {
  const h = sk.head, s = ch.scale || 1;
  return { x:(h.ax + h.bx) / 2, y:(h.ay + h.by) / 2, r:25 * s, ang:h.ang };
}

/* The point you grab to swing a bone: its far end. The body handle is the hips. */
function handlePos(ch, sk, name) {
  if (name === "root") return { x:ch.root.x, y:ch.root.y };
  const b = sk[name];
  return { x:b.bx, y:b.by };
}

/* Point a bone at a world position, and give back the clamped local angle.
   This is the whole of posing: everything below the bone comes along for free. */
function aimBone(ch, name, wx, wy) {
  const sk = skeleton(ch);
  const b = sk[name], def = BONE[name];
  const parentAng = b.ang - (def.rest + (ch.joints[name] || 0)) * DEG;
  const want = Math.atan2(wy - b.ay, wx - b.ax);
  return clampJoint(name, wrapDeg(want / DEG - parentAng / DEG - def.rest));
}

/* ---------------------------------------------------------------------------
   WHO YOU CAN BE
   Every design here is original. Types change colours and the extra bits drawn
   over the rig; the skeleton underneath is identical for all of them, which is
   what lets a character change costume mid-cartoon without losing its pose.
   --------------------------------------------------------------------------- */
const TYPES = [
  { id:"regular", nm:"Stickman", ink:"#2b2a3d", skin:"#fff3dc", tint:"#4a7de0", start:true,
    blurb:"A classic." },
  { id:"ninja", nm:"Ninja", ink:"#232a44", skin:"#f3e4c6", tint:"#2f3a63", start:true,
    blurb:"Hood and a long headband." },
  { id:"girl-tutu", nm:"Tutu Girl", ink:"#3a2436", skin:"#fff0e2", tint:"#e2679b", start:true,
    blurb:"A tutu and a top bun." },
  { id:"robot", nm:"Robot", ink:"#3a4350", skin:"#d7e2ec", tint:"#7bc7d6", start:false,
    blurb:"Square head and a bouncy antenna.", need:"frames3" },
  { id:"astronaut", nm:"Astronaut", ink:"#4a4f63", skin:"#eef3fa", tint:"#e8e8ef", start:false,
    blurb:"Helmet bubble and a air tank.", need:"projects3" },
  { id:"hero", nm:"Super", ink:"#2b2a3d", skin:"#ffeeda", tint:"#d64545", start:false,
    blurb:"Cape and a star on the chest.", need:"frames10" },
  { id:"dino", nm:"Dino Suit", ink:"#27402c", skin:"#eaf6e4", tint:"#4e9d55", start:false,
    blurb:"Spiky back and a swishy tail.", need:"crowd3" }
];
const TYPE = {};
TYPES.forEach((t) => { TYPE[t.id] = t; });

const EYES = [
  { id:"none",   nm:"No eyes" },
  { id:"dots",   nm:"Dots" },
  { id:"round",  nm:"Round" },
  { id:"googly", nm:"Googly" },
  { id:"angry",  nm:"Angry" },
  { id:"sleepy", nm:"Sleepy" },
  { id:"one",    nm:"One eye" }
];
const EYE_IDS = EYES.map((e) => e.id);

/* Accessories hang off a named bone and travel with it. No mouths, and
   nothing weapon-shaped: these are hats, bows and a balloon. */
const ACCS = [

    g.fillStyle = "#c8c3dc"; g.beginPath(); g.arc(980, 150, 62, 0, 7); g.fill();
    g.fillStyle = "#b1aac8";
    [[962,132,13],[1004,166,9],[972,180,7]].forEach((c) => {

  } else if (id === "city") {
    sky("#2d3d63", "#7d6a96");

      for (let wy = ground - bh + 16; wy < ground - 22; wy += 26)
        for (let wx = bx + 12; wx < bx + bw - 14; wx += 24)

    g.fillStyle = "#6b4a2c"; g.fillRect(0, ground - 16, W, 16);

/* ---------------------------------------------------------------------------
   THE PAINTER
   One function draws a character, and it is used for the big stage, the frame
   thumbnails, the character picker and the workshop preview. They cannot drift
   apart because there is only one of it.
   --------------------------------------------------------------------------- */
const HALO = "rgba(255,253,248,.92)";
/* Limbs are drawn a chain at a time — a whole arm, a whole leg — and each
   chain lays down its pale halo before any of its own ink. Doing it bone by
   bone instead would let each bone's halo rub out the end of the one before
   it, and the character comes out looking stitched together from dashes.
   Between chains the halo is exactly what is wanted: it is what makes an arm
   swung across the body read as being in front of it rather than vanishing
   into it, since both are the same colour. */
function chain(g, sk, names, colour) {
  g.lineCap = "round";
  g.strokeStyle = HALO;
  names.forEach((n) => {
    const b = sk[n]; if (!b) return;
    g.lineWidth = b.w + 4.5;
    g.beginPath(); g.moveTo(b.ax, b.ay); g.lineTo(b.bx, b.by); g.stroke();
  });
  g.strokeStyle = colour;
  names.forEach((n) => {
    const b = sk[n]; if (!b) return;
    g.lineWidth = b.w;
    g.beginPath(); g.moveTo(b.ax, b.ay); g.lineTo(b.bx, b.by); g.stroke();
  });
}
const L_ARM = ["leftShoulder","leftElbow","leftWrist"];
const R_ARM = ["rightShoulder","rightElbow","rightWrist"];
const L_LEG = ["leftHip","leftKnee","leftAnkle"];
const R_LEG = ["rightHip","rightKnee","rightAnkle"];

function drawCharacter(g, ch, opts) {
  opts = opts || {};
  const sk = skeleton(ch);
  const t = TYPE[ch.type] || TYPE.regular;
  const s = ch.scale || 1;
  const ink = ch.colour || t.ink;
  const hd = headDisc(ch, sk);

  g.save();
  if (opts.alpha != null) g.globalAlpha = opts.alpha;

  /* things that sit behind the body */
  (ch.accessories || []).forEach((a) => { const d = ACC_DRAW[a.type]; if (d && d.back) d.back(g, sk, ch, hd, s); });
  if (t.id === "hero" && !(ch.accessories || []).some((a) => a.type === "cape")) capeShape(g, sk, s, "#d64545");
  if (t.id === "dino") dinoTail(g, sk, ch, s);

  /* legs, then body, then arms — arms last so a pose reads from the front */
  chain(g, sk, L_LEG, ink);
  chain(g, sk, R_LEG, ink);
  chain(g, sk, ["torso","neck"], ink);

  if (t.id === "girl-tutu") tutu(g, sk, ch, s);
  if (t.id === "ninja") ninjaSuit(g, sk, ch, s);
  if (t.id === "astronaut") spaceSuit(g, sk, ch, s);
  if (t.id === "robot") robotBody(g, sk, ch, s);
  if (t.id === "dino") dinoBack(g, sk, ch, s);
  if (t.id === "hero") heroChest(g, sk, ch, s);

  chain(g, sk, L_ARM, ink);
  chain(g, sk, R_ARM, ink);
  /* hands and feet, so the ends of the limbs read as hands and feet */
  [["leftWrist",5.2],["rightWrist",5.2]].forEach((p) => {
    const b = sk[p[0]];
    g.fillStyle = t.skin; g.strokeStyle = ink; g.lineWidth = 2.2 * s;
    g.beginPath(); g.arc(b.bx, b.by, p[1] * s, 0, 7); g.fill(); g.stroke();
  });

  /* head */
  drawHead(g, ch, sk, hd, t, ink, s);

  /* things that sit in front */
  (ch.accessories || []).forEach((a) => { const d = ACC_DRAW[a.type]; if (d && d.front) d.front(g, sk, ch, hd, s); });

  g.restore();
  return sk;
}

function drawHead(g, ch, sk, hd, t, ink, s) {
  g.save();
  g.translate(hd.x, hd.y);
  g.rotate(hd.ang + Math.PI / 2);     /* head bone points "up" out of the neck */
  const r = hd.r;

  if (t.id === "robot") {
    g.fillStyle = t.skin; g.strokeStyle = ink; g.lineWidth = 3 * s;
    g.beginPath(); g.rect(-r * 0.95, -r * 0.95, r * 1.9, r * 1.9); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(0, -r * 0.95); g.lineTo(0, -r * 1.7); g.stroke();
    g.fillStyle = t.tint; g.beginPath(); g.arc(0, -r * 1.85, r * 0.26, 0, 7); g.fill();
  } else if (t.id === "astronaut") {
    g.fillStyle = t.skin; g.strokeStyle = ink; g.lineWidth = 3 * s;
    g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
    g.strokeStyle = "rgba(150,200,240,.95)"; g.lineWidth = 5 * s;
    g.beginPath(); g.arc(0, 0, r * 1.18, 0, 7); g.stroke();
    g.fillStyle = "rgba(170,215,245,.3)";
    g.beginPath(); g.arc(0, 0, r * 1.14, 0, 7); g.fill();
  } else if (t.id === "ninja") {
    g.fillStyle = t.tint; g.strokeStyle = ink; g.lineWidth = 3 * s;
    g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
    /* an eye slot cut out of the hood — a strip of face, nothing below it */
    g.fillStyle = t.skin;
    g.beginPath(); g.rect(-r * 0.92, -r * 0.34, r * 1.84, r * 0.5); g.fill();
  } else {
    g.fillStyle = t.skin; g.strokeStyle = ink; g.lineWidth = 3 * s;
    g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke();
  }
  if (t.id === "girl-tutu") {
    g.fillStyle = ch.colour || t.tint;
    g.beginPath(); g.arc(0, -r * 1.02, r * 0.42, 0, 7); g.fill();
  }
  if (t.id === "dino") {
    g.fillStyle = t.tint; g.strokeStyle = ink; g.lineWidth = 2.4 * s;
    [-0.5, 0, 0.5].forEach((o) => {
      g.beginPath(); g.moveTo(o * r - r * 0.2, -r * 0.92);
      g.lineTo(o * r, -r * 1.42); g.lineTo(o * r + r * 0.2, -r * 0.92);
      g.closePath(); g.fill(); g.stroke();
    });
  }
  drawEyes(g, ch.eyeStyle, r, ink, s);
  g.restore();
}

/* Eyes live in the head's own frame, so they turn with it for free.
   There are no mouths in this game, anywhere, on purpose. */
function drawEyes(g, style, r, ink, s) {
  const ex = r * 0.40, ey = -r * 0.14;
  const white = "#fffdf8";
  if (!style || style === "none") return;
  if (style === "dots") {
    g.fillStyle = ink;
    [-ex, ex].forEach((x) => { g.beginPath(); g.arc(x, ey, r * 0.12, 0, 7); g.fill(); });
  } else if (style === "round") {
    [-ex, ex].forEach((x) => {
      g.fillStyle = white; g.strokeStyle = ink; g.lineWidth = 1.8 * s;
      g.beginPath(); g.arc(x, ey, r * 0.23, 0, 7); g.fill(); g.stroke();
      g.fillStyle = ink; g.beginPath(); g.arc(x, ey, r * 0.1, 0, 7); g.fill();
    });
  } else if (style === "googly") {
    [-ex * 1.08, ex * 1.08].forEach((x) => {
      g.fillStyle = white; g.strokeStyle = ink; g.lineWidth = 2 * s;
      g.beginPath(); g.arc(x, ey, r * 0.33, 0, 7); g.fill(); g.stroke();
      g.fillStyle = ink; g.beginPath(); g.arc(x, ey + r * 0.13, r * 0.14, 0, 7); g.fill();
    });
  } else if (style === "angry") {
    [-ex, ex].forEach((x, i) => {
      g.fillStyle = white; g.strokeStyle = ink; g.lineWidth = 1.8 * s;
      g.beginPath(); g.arc(x, ey + r * 0.04, r * 0.22, 0, 7); g.fill(); g.stroke();
      g.fillStyle = ink; g.beginPath(); g.arc(x, ey + r * 0.06, r * 0.1, 0, 7); g.fill();
      g.strokeStyle = ink; g.lineWidth = 3 * s; g.lineCap = "round";
      g.beginPath();
      g.moveTo(x - (i ? -1 : 1) * r * 0.3, ey - r * 0.42);
      g.lineTo(x + (i ? -1 : 1) * r * 0.26, ey - r * 0.2);
      g.stroke();
    });
  } else if (style === "sleepy") {
    g.strokeStyle = ink; g.lineWidth = 2.6 * s; g.lineCap = "round";
    [-ex, ex].forEach((x) => {
      g.beginPath(); g.arc(x, ey, r * 0.24, Math.PI * 0.08, Math.PI * 0.92); g.stroke();
    });
  } else if (style === "one") {
    g.fillStyle = white; g.strokeStyle = ink; g.lineWidth = 2.2 * s;
    g.beginPath(); g.arc(0, ey, r * 0.38, 0, 7); g.fill(); g.stroke();
    g.fillStyle = ink; g.beginPath(); g.arc(0, ey, r * 0.17, 0, 7); g.fill();
  }
}

/* ---- costume extras ---- */
function tutu(g, sk, ch, s) {
  const hp = { x:ch.root.x, y:ch.root.y };
  const col = ch.colour || TYPE["girl-tutu"].tint;
  g.save(); g.translate(hp.x, hp.y); g.rotate((ch.rotation || 0) * DEG);
  for (let i = 0; i < 3; i++) {
    g.fillStyle = i % 2 ? col : "rgba(255,255,255,.85)";
    g.beginPath();
    g.moveTo(-6 * s, -6 * s); g.lineTo(-(34 - i * 4) * s, (16 + i * 7) * s);
    g.lineTo((34 - i * 4) * s, (16 + i * 7) * s); g.lineTo(6 * s, -6 * s);
    g.closePath(); g.fill();
  }
  g.restore();
}
function ninjaSuit(g, sk, ch, s) {
  const t = sk.torso, col = ch.colour || TYPE.ninja.tint;
  g.lineCap = "round";
  g.strokeStyle = HALO; g.lineWidth = 12 * s + 4.5;
  g.beginPath(); g.moveTo(t.ax, t.ay); g.lineTo(t.bx, t.by); g.stroke();
  g.strokeStyle = col; g.lineWidth = 12 * s;
  g.beginPath(); g.moveTo(t.ax, t.ay); g.lineTo(t.bx, t.by); g.stroke();
  /* a long headband trailing off the back of the hood */
  const h = sk.head;
  g.strokeStyle = "#c0392b"; g.lineWidth = 4 * s;
  g.beginPath(); g.moveTo(h.ax, h.ay);
  g.quadraticCurveTo(h.ax - 34 * s, h.ay - 6 * s, h.ax - 54 * s, h.ay + 16 * s); g.stroke();
}
function spaceSuit(g, sk, ch, s) {
  const t = sk.torso;
  g.lineCap = "round";
  g.strokeStyle = HALO; g.lineWidth = 15 * s + 4.5;
  g.beginPath(); g.moveTo(t.ax, t.ay); g.lineTo(t.bx, t.by); g.stroke();
  g.strokeStyle = ch.colour || "#e8e8ef"; g.lineWidth = 15 * s;
  g.beginPath(); g.moveTo(t.ax, t.ay); g.lineTo(t.bx, t.by); g.stroke();
  const mx = (t.ax + t.bx) / 2, my = (t.ay + t.by) / 2;
  g.fillStyle = "#8fa6bd";
  g.beginPath(); g.arc(mx, my, 6 * s, 0, 7); g.fill();
}
function robotBody(g, sk, ch, s) {
  const t = sk.torso;
  g.save();
  g.translate((t.ax + t.bx) / 2, (t.ay + t.by) / 2);
  g.rotate(t.ang + Math.PI / 2);
  g.fillStyle = ch.colour || TYPE.robot.skin; g.strokeStyle = TYPE.robot.ink; g.lineWidth = 3 * s;
  g.beginPath(); g.rect(-15 * s, -40 * s, 30 * s, 80 * s); g.fill(); g.stroke();
  g.fillStyle = TYPE.robot.tint;
  g.beginPath(); g.rect(-9 * s, -26 * s, 18 * s, 13 * s); g.fill();
  g.restore();
}
function heroChest(g, sk, ch, s) {
  const t = sk.torso;
  g.lineCap = "round";
  g.strokeStyle = HALO; g.lineWidth = 13 * s + 4.5;
  g.beginPath(); g.moveTo(t.ax, t.ay); g.lineTo(t.bx, t.by); g.stroke();
  g.strokeStyle = ch.colour || TYPE.hero.tint; g.lineWidth = 13 * s;
  g.beginPath(); g.moveTo(t.ax, t.ay); g.lineTo(t.bx, t.by); g.stroke();
  const mx = t.ax + (t.bx - t.ax) * 0.38, my = t.ay + (t.by - t.ay) * 0.38;
  g.save(); g.translate(mx, my); g.rotate(t.ang + Math.PI / 2);
  g.fillStyle = "#ffd964"; star(g, 0, 0, 10 * s, 4.6 * s, 5); g.fill();
  g.restore();
}
function dinoBack(g, sk, ch, s) {
  const t = sk.torso;
  g.save(); g.translate(t.ax, t.ay); g.rotate(t.ang);
  g.fillStyle = ch.colour || TYPE.dino.tint;
  for (let i = 0; i < 4; i++) {
    const d = 18 + i * 20;
    g.beginPath(); g.moveTo(d * s, -3 * s); g.lineTo((d + 9) * s, -15 * s);
    g.lineTo((d + 17) * s, -3 * s); g.closePath(); g.fill();
  }
  g.restore();
}
function dinoTail(g, sk, ch, s) {
  const r = ch.root, rot = (ch.rotation || 0) * DEG;
  g.save(); g.translate(r.x, r.y); g.rotate(rot);
  g.fillStyle = ch.colour || TYPE.dino.tint;
  g.beginPath(); g.moveTo(0, -8 * s);
  g.quadraticCurveTo(-52 * s, -14 * s, -74 * s, 18 * s);
  g.quadraticCurveTo(-46 * s, 4 * s, 0, 8 * s);
  g.closePath(); g.fill();
  g.restore();
}
function capeShape(g, sk, s, col) {
  const t = sk.torso;
  g.save(); g.translate(t.bx, t.by); g.rotate(t.ang + Math.PI / 2);
  g.fillStyle = col;
  g.beginPath(); g.moveTo(-13 * s, 0);
  g.quadraticCurveTo(-40 * s, 54 * s, -26 * s, 96 * s);
  g.lineTo(26 * s, 96 * s);
  g.quadraticCurveTo(40 * s, 54 * s, 13 * s, 0);
  g.closePath(); g.fill();
  g.restore();
}
function star(g, cx, cy, ro, ri, pts) {
  g.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? ri : ro;
    if (i) g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    else g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  g.closePath();
}

/* ---- accessories: each draws in the frame of the bone it hangs off ---- */
function onHead(g, hd, s, fn) {
  g.save(); g.translate(hd.x, hd.y); g.rotate(hd.ang + Math.PI / 2);
  fn(g, hd.r, s); g.restore();
}
const ACC_DRAW = {
  glasses: { front:(g, sk, ch, hd, s) => onHead(g, hd, s, (g, r) => {
    g.strokeStyle = "#2b2a3d"; g.lineWidth = 2.6 * s;
    [-r * 0.4, r * 0.4].forEach((x) => { g.beginPath(); g.arc(x, -r * 0.14, r * 0.28, 0, 7); g.stroke(); });
    g.beginPath(); g.moveTo(-r * 0.12, -r * 0.14); g.lineTo(r * 0.12, -r * 0.14);
    g.moveTo(-r * 0.68, -r * 0.2); g.lineTo(-r * 0.98, -r * 0.3);
    g.moveTo(r * 0.68, -r * 0.2); g.lineTo(r * 0.98, -r * 0.3); g.stroke();
  }) },
  bow: { front:(g, sk, ch, hd, s) => onHead(g, hd, s, (g, r) => {
    g.fillStyle = "#e2679b";

/* ===========================================================================
   THE PROJECT: shape, cloning, saving, undo, unlocks
   =========================================================================== */
const SCHEMA = 1;
const KEY = "cartoon-v1";              // the index, settings and unlocks
const PKEY = "cartoon-v1-p-";          // one key per project, so saving one
                                       // cartoon never rewrites the others
let idSeq = 0;
function newId(prefix) {
  idSeq++;
  return (prefix || "x") + "_" + Date.now().toString(36) + "_" +
         idSeq.toString(36) + Math.floor(Math.random() * 1296).toString(36);
}
/* Plain data only, so a JSON round trip is a complete and dependable deep copy.
   This is what keeps one frame's poses from leaking into another's. */
function clone(v) { return JSON.parse(JSON.stringify(v)); }

function makeCharacter(opts) {
  opts = opts || {};
  return {
    id: opts.id || newId("c"),
    type: opts.type || "regular",
    root: { x: opts.x == null ? STAGE_W / 2 : opts.x, y: opts.y == null ? STAGE_H * 0.78 - 123 * (opts.scale || 1.25) : opts.y },
    scale: opts.scale || 1.25,
    rotation: 0,
    joints: restPose(),
    eyeStyle: opts.eyeStyle || "dots",
    colour: opts.colour || null,
    accessories: (opts.accessories || []).map((t) => ({ id: newId("a"), type: t, anchor: (ACC[t] || {}).anchor || "head" })),
    zIndex: opts.zIndex || 0
  };
}
function makeFrame(opts) {
  opts = opts || {};
  return {
    id: newId("f"),
    durationMs: opts.durationMs || Math.round(1000 / 6),
    backgroundId: opts.backgroundId || "blank",
    characters: opts.characters || []
  };
}
function makeProject(title) {
  const now = new Date().toISOString();
  return {
    schemaVersion: SCHEMA,
    id: newId("p"),
    title: title || "My cartoon",
    createdAt: now, updatedAt: now,
    fps: 6,
    playbackMode: "step",
    frames: [makeFrame({})]

}

/* A new frame is a complete copy of the one before it, with fresh frame id but
   the SAME character ids — stable ids are what let playback and interpolation
   know that this Ninja and that Ninja are the same Ninja. */
function duplicateFrame(fr) {
  const copy = clone(fr);
  copy.id = newId("f");
  return copy;
}

/* --------------------------------------------------------------------------
   Reading a project back in. Anything missing, out of range or the wrong type
   is replaced rather than trusted — a half-written save should open as a
   slightly smaller cartoon, never as a crash.
   -------------------------------------------------------------------------- */
function num(v, d) { return (typeof v === "number" && isFinite(v)) ? v : d; }

  if (!c || typeof c !== "object") return null;
  const type = TYPE[c.type] ? c.type : "regular";
  const out = {
    id: typeof c.id === "string" && c.id ? c.id : newId("c"),
    type: type,
    root: { x: num(c.root && c.root.x, STAGE_W / 2), y: num(c.root && c.root.y, STAGE_H * 0.78 - 154) },
    scale: Math.max(0.35, Math.min(2.6, num(c.scale, 1))),
    rotation: num(c.rotation, 0),
    joints: {},
    eyeStyle: EYE_IDS.indexOf(c.eyeStyle) === -1 ? "dots" : c.eyeStyle,
    colour: typeof c.colour === "string" && /^#[0-9a-f]{6}$/i.test(c.colour) ? c.colour : null,
    accessories: [],
    zIndex: num(c.zIndex, 0)

  BONES.forEach((b) => {
    out.joints[b.n] = clampJoint(b.n, num(c.joints && c.joints[b.n], 0));
  });
  if (Array.isArray(c.accessories)) {
    const seen = {};
    c.accessories.forEach((a) => {
      const t = a && a.type;
      if (!ACC[t] || seen[t]) return;
      seen[t] = 1;
      out.accessories.push({ id: (a && a.id) || newId("a"), type: t, anchor: ACC[t].anchor });
    });

}
function sanitiseFrame(f) {
  if (!f || typeof f !== "object") return null;
  const chars = Array.isArray(f.characters)
    ? f.characters.map(sanitiseCharacter).filter(Boolean) : [];
  return {
    id: typeof f.id === "string" && f.id ? f.id : newId("f"),
    durationMs: Math.max(40, Math.min(5000, num(f.durationMs, 167))),
    backgroundId: BG_IDS.indexOf(f.backgroundId) === -1 ? "blank" : f.backgroundId,
    characters: chars

}
function sanitiseProject(p) {
  if (!p || typeof p !== "object") return null;
  const frames = Array.isArray(p.frames) ? p.frames.map(sanitiseFrame).filter(Boolean) : [];
  if (!frames.length) frames.push(makeFrame({}));
  const now = new Date().toISOString();
  return {
    schemaVersion: SCHEMA,
    id: typeof p.id === "string" && p.id ? p.id : newId("p"),
    title: (typeof p.title === "string" && p.title.trim()) ? p.title.trim().slice(0, 60) : "My cartoon",
    createdAt: typeof p.createdAt === "string" ? p.createdAt : now,
    updatedAt: typeof p.updatedAt === "string" ? p.updatedAt : now,
    fps: Math.max(1, Math.min(24, Math.round(num(p.fps, 6)))),
    playbackMode: p.playbackMode === "smooth" ? "smooth" : "step",

/* Future schema bumps land here; version 1 needs nothing doing to it. */
function migrate(p) {

  return sanitiseProject(p);
}

/* Angles and positions are rounded on the way out. A frame is ~15 numbers per
   character and projects can run to hundreds of frames, so dropping six
   meaningless decimal places roughly halves what we ask the browser to store. */
function serialise(p) {
  const r1 = (v) => Math.round(v * 10) / 10;
  const out = clone(p);
  out.frames.forEach((f) => f.characters.forEach((c) => {
    c.root.x = r1(c.root.x); c.root.y = r1(c.root.y);
    c.scale = Math.round(c.scale * 1000) / 1000;
    c.rotation = r1(c.rotation);
    Object.keys(c.joints).forEach((k) => { c.joints[k] = r1(c.joints[k]); });
  }));
  return JSON.stringify(out);

/* --------------------------------------------------------------------------
   STORAGE
   localStorage, the same as every other game here. One key per project plus a
   small index, so a quota failure while saving one cartoon cannot take the
   others down with it.
   -------------------------------------------------------------------------- */
const BLANK_STATS = { played:0, maxFrames:1, totalFrames:0, bgs:[], projects:0, smoothPlays:0, maxChars:0 };
let DB = null;

function readDB() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { raw = null; }
  const d = { v:1, currentId:null, unlocks:[], stats:clone(BLANK_STATS), hintSeen:false, index:[] };
  if (!raw || typeof raw !== "object") return d;
  if (typeof raw.currentId === "string") d.currentId = raw.currentId;
  if (Array.isArray(raw.unlocks)) d.unlocks = raw.unlocks.filter((u) => typeof u === "string");
  if (raw.stats && typeof raw.stats === "object") {
    Object.keys(BLANK_STATS).forEach((k) => {
      if (k === "bgs") d.stats.bgs = Array.isArray(raw.stats.bgs)
        ? raw.stats.bgs.filter((b) => BG_IDS.indexOf(b) !== -1) : [];
      else d.stats[k] = Math.max(0, num(raw.stats[k], BLANK_STATS[k]));
    });
  }
  d.hintSeen = !!raw.hintSeen;
  if (Array.isArray(raw.index)) {
    d.index = raw.index.filter((e) => e && typeof e.id === "string").map((e) => ({
      id: e.id,
      title: typeof e.title === "string" ? e.title : "My cartoon",
      updatedAt: typeof e.updatedAt === "string" ? e.updatedAt : new Date().toISOString(),
      frames: Math.max(1, num(e.frames, 1))

  }

}
function writeDB() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch (e) { return false; }
}
function projectKey(id) { return PKEY + id; }

function loadProject(id) {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(projectKey(id)) || "null"); } catch (e) { raw = null; }
  return migrate(raw);
}
/* Save the cartoon first, then the index. If we are interrupted between the
   two, the cartoon is on disk but unlisted — and recoverIndex() below finds it
   again next time, rather than it quietly vanishing. */
function saveProject(p, onQuota) {
  p.updatedAt = new Date().toISOString();
  let ok = true;
  try { localStorage.setItem(projectKey(p.id), serialise(p)); }
  catch (e) { ok = false; if (onQuota) onQuota(e); }
  if (!ok) return false;
  const e = DB.index.find((x) => x.id === p.id);
  const row = { id:p.id, title:p.title, updatedAt:p.updatedAt, frames:p.frames.length };
  if (e) Object.assign(e, row); else DB.index.unshift(row);
  DB.index.sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1));
  writeDB();
  return true;
}
function deleteProject(id) {
  try { localStorage.removeItem(projectKey(id)); } catch (e) {}
  DB.index = DB.index.filter((x) => x.id !== id);
  if (DB.currentId === id) DB.currentId = null;
  writeDB();
}
/* Put the index back together from what is actually on disk: adds cartoons a
   half-finished save left unlisted, and drops rows whose cartoon has gone. */
function recoverIndex() {
  const found = {}, added = [];
  let n = 0;
  try { n = localStorage.length; } catch (e) { return added; }
  for (let i = 0; i < n; i++) {
    let k = null;
    try { k = localStorage.key(i); } catch (e) { continue; }
    if (!k || k.indexOf(PKEY) !== 0) continue;
    const id = k.slice(PKEY.length);
    found[id] = true;
    if (DB.index.some((x) => x.id === id)) continue;
    const p = loadProject(id);
    if (!p) continue;
    DB.index.push({ id:p.id, title:p.title, updatedAt:p.updatedAt, frames:p.frames.length });
    added.push(p.title);
  }
  const before = DB.index.length;
  DB.index = DB.index.filter((x) => found[x.id]);
  DB.index.sort((a, b) => (a.updatedAt < b.updatedAt ? 1 : -1));
  if (added.length || DB.index.length !== before) writeDB();
  return added;

/* --------------------------------------------------------------------------
   UNLOCKS
   Earned by making cartoons, never bought and never ground out. The three
   starter characters and every editing tool stay unlocked whatever happens.
   -------------------------------------------------------------------------- */
const UNLOCKS = {
  played1:   { how:"Play a cartoon all the way through", test:(s) => s.played >= 1 },
  frames3:   { how:"Make a cartoon with 3 frames",       test:(s) => s.maxFrames >= 3 },
  bg3:       { how:"Try 3 different backgrounds",        test:(s) => s.bgs.length >= 3 },
  projects3: { how:"Start 3 different cartoons",         test:(s) => s.projects >= 3 },
  frames10:  { how:"Make a cartoon with 10 frames",      test:(s) => s.maxFrames >= 10 },
  frames20:  { how:"Make 20 frames altogether",          test:(s) => s.totalFrames >= 20 },
  crowd3:    { how:"Play a cartoon with 3 characters",   test:(s) => s.maxChars >= 3 },
  smooth1:   { how:"Play a cartoon in Smooth mode",      test:(s) => s.smoothPlays >= 1 }
};
function isUnlocked(need) { return !need || DB.unlocks.indexOf(need) !== -1; }
function typeAvailable(id) { const t = TYPE[id]; return !!t && (t.start || isUnlocked(t.need)); }
function accAvailable(id) { const a = ACC[id]; return !!a && (a.start || isUnlocked(a.need)); }
function howToGet(need) { return (UNLOCKS[need] || {}).how || "Keep making cartoons"; }

/* Check every rule, award anything newly earned, and hand back what to crow
   about. Counters only ever go up; nothing here can be lost or taken away. */
function checkUnlocks() {
  const won = [];
  Object.keys(UNLOCKS).forEach((k) => {
    if (DB.unlocks.indexOf(k) !== -1) return;
    if (!UNLOCKS[k].test(DB.stats)) return;
    DB.unlocks.push(k);
    TYPES.forEach((t) => { if (t.need === k) won.push({ kind:"character", nm:t.nm, id:t.id }); });
    ACCS.forEach((a) => { if (a.need === k) won.push({ kind:"accessory", nm:a.nm, id:a.id }); });
  });
  if (won.length) writeDB();
  return won;
}
function noteStats(fn) { fn(DB.stats); writeDB(); }

/* --------------------------------------------------------------------------
   UNDO / REDO — whole-project snapshots. Simple, and it cannot half-apply.
   -------------------------------------------------------------------------- */
const HIST_MAX = 40, HIST_BYTES = 6e6;

function histReset() { undoStack = []; redoStack = []; }

  undoStack.push(serialise(p));

  while (undoStack.length > HIST_MAX || (bytes > HIST_BYTES && undoStack.length > 2)) {
    bytes -= undoStack[0].length;
    undoStack.shift();
  }

  if (!undoStack.length) return null;
  redoStack.push(serialise(cur));
  return migrate(JSON.parse(undoStack.pop()));
}
function histRedo(cur) {
  if (!redoStack.length) return null;
  undoStack.push(serialise(cur));
  return migrate(JSON.parse(redoStack.pop()));
}

/* --------------------------------------------------------------------------
   INTERPOLATION for smooth playback. Characters are matched by their stable
   id; one that appears or disappears simply pops, because a half-faded
   character mid-leap looks like a bug rather than a choice.
   -------------------------------------------------------------------------- */
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) { return a + wrapDeg(b - a) * t; }

  out.scale = lerp(a.scale, b.scale, t);
  out.rotation = lerpAngle(a.rotation, b.rotation, t);
  JOINT_NAMES.forEach((n) => {

  const chars = f1.characters.map((c) => (byId[c.id] ? tweenCharacter(c, byId[c.id], t) : c));
  return { id:f1.id, durationMs:f1.durationMs, backgroundId:f1.backgroundId, characters:chars };

/* ===========================================================================
   THE STAGE: camera, drawing, touch, playback
   =========================================================================== */
let P = null;                 // the open project
let frameIx = 0;              // which frame is being edited
let selId = null;             // which character is selected
let locked = false;           // Lock Pose: limbs held still, body still movable
let ghost = false;            // onion skin of the frame before
let playing = false, playT0 = 0, playIx = 0, playSub = 0;

const cv = $("stage"), g = cv.getContext("2d");

function resize() {
  const r = $("stagewrap").getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cw = Math.max(80, Math.round(r.width)); chh = Math.max(80, Math.round(r.height));
  cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr);
  /* the first resize is the first moment the canvas has a real size, so
     that is when the camera can actually be fitted to the stage */

}
function fitView() {
  if (cw < 2 || chh < 2) return;
  fitted = true;
  view.z = Math.min(cw / STAGE_W, chh / STAGE_H) * 0.95;
  view.x = STAGE_W / 2; view.y = STAGE_H / 2;
  draw();
}
const toScreen = (wx, wy) => ({ x:(wx - view.x) * view.z + cw / 2, y:(wy - view.y) * view.z + chh / 2 });
const toWorld = (sx, sy) => ({ x:(sx - cw / 2) / view.z + view.x, y:(sy - chh / 2) / view.z + view.y });

function tick() {
  rafId = requestAnimationFrame(tick);

  needsDraw = false;

}
function paint() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0e1020"; g.fillRect(0, 0, cw, chh);
  g.save();
  g.translate(cw / 2, chh / 2); g.scale(view.z, view.z); g.translate(-view.x, -view.y);

  const f = playing ? playbackFrame() : frame();
  g.save(); g.beginPath(); g.rect(0, 0, STAGE_W, STAGE_H); g.clip();
  drawBg(g, f.backgroundId);

  if (!playing && ghost && frameIx > 0) {
    sortedChars(P.frames[frameIx - 1]).forEach((c) => drawCharacter(g, c, { alpha:0.26 }));
  }
  sortedChars(f).forEach((c) => drawCharacter(g, c, {}));
  g.restore();

  /* a frame round the stage, so the edge of the cartoon is obvious */
  g.strokeStyle = "rgba(255,255,255,.3)"; g.lineWidth = 3 / view.z;
  g.strokeRect(0, 0, STAGE_W, STAGE_H);

/* Handles are drawn in screen pixels, not world units, so they stay the same
   comfortable size whatever the zoom. */
const HANDLE_R = 11, HIT_R = 26, ROOT_R = 18;
function drawHandles() {
  const c = selected();
  if (!c) return;
  const sk = skeleton(c);

  if (!locked) {
    HANDLES.forEach((n) => {
      if (n === "neck") return;                 // the head handle covers head tilt
      const p = handlePos(c, sk, n), s = toScreen(p.x, p.y);
      const live = dragging && dragging.joint === n;
      g.fillStyle = live ? "#ffd964" : "rgba(255,255,255,.52)";
      g.strokeStyle = live ? "#8a6a10" : "rgba(28,26,46,.85)";
      g.lineWidth = live ? 3.5 : 2.5;

    });
