<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ezra's Legendary Pets</title>
  <style>
    :root {
      --bg: #fff7e6;
      --card: #ffffff;
      --text: #2a2440;
      --legendary: #f5b400;
      --epic: #a66cff;
      --rare: #4dc1f0;
      --common: #6cbf6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, #ffe7b0 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, #ffd1f0 0%, transparent 45%),
        var(--bg);
      padding: 16px;
      display: grid;
      place-items: center;
    }
    .page {
      width: min(960px, 100%);
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 14px 36px rgba(40, 30, 80, 0.15);
      padding: clamp(16px, 4vw, 32px);
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.8rem, 4.6vw, 2.4rem);
    }
    .subtitle {
      text-align: center;
      opacity: 0.85;
      margin: 8px auto 14px;
      max-width: 60ch;
      font-size: 0.95rem;
    }
    .progress-line {
      text-align: center;
      font-weight: bold;
      margin: 6px 0;
      color: #6a5a20;
    }
    .progress-bar {
      width: 100%;
      max-width: 320px;
      margin: 4px auto 14px;
      height: 10px;
      background: #f0e6c8;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--common), var(--rare), var(--epic), var(--legendary));
      transition: width 0.6s ease;
    }
    .filters {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0 14px;
    }
    .filters button {
      background: white;
      border: 2px solid #d6d0c0;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      color: #5a5547;
    }
    .filters button.active { background: var(--text); color: white; border-color: var(--text); }
    .filters button.r-common.active    { background: var(--common);    border-color: var(--common); }
    .filters button.r-rare.active      { background: var(--rare);      border-color: var(--rare); }
    .filters button.r-epic.active      { background: var(--epic);      border-color: var(--epic); }
    .filters button.r-legendary.active { background: var(--legendary); color: #4a3500; border-color: var(--legendary); }

    .binder {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .mini {
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .mini:hover { transform: translateY(-3px) scale(1.02); }
    .mini.legendary {
      background: linear-gradient(160deg, #fffbef, #fff5d8);
      border: 3px solid var(--legendary);
      box-shadow: 0 4px 14px rgba(245, 180, 0, 0.35);
    }
    .mini.epic {
      background: linear-gradient(160deg, #faf5ff, #f0e6ff);
      border: 3px solid var(--epic);
      box-shadow: 0 4px 14px rgba(166, 108, 255, 0.3);
    }
    .mini.rare {
      background: linear-gradient(160deg, #f0fbff, #d8efff);
      border: 3px solid var(--rare);
      box-shadow: 0 4px 14px rgba(77, 193, 240, 0.3);
    }
    .mini.common {
      background: linear-gradient(160deg, #f4faf0, #ddeed8);
      border: 3px solid var(--common);
      box-shadow: 0 4px 12px rgba(108, 191, 108, 0.25);
    }
    .mini.locked {
      background: #f4f1ec;
      border: 3px dashed #cfc6b3;
      box-shadow: none;
      color: #8a8676;
      cursor: pointer;
    }
    .mini .num {
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      font-weight: bold;
      opacity: 0.7;
    }
    .mini .face {
      font-size: 2.6rem;
      line-height: 1;
      margin: 4px 0;
    }
    .mini.locked .face {
      filter: brightness(0) opacity(0.22);
    }
    .mini .name {
      font-size: 0.78rem;
      font-weight: bold;
      text-align: center;
      line-height: 1.1;
      padding: 0 2px;
    }
    .mini .rar {
      font-size: 0.62rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: bold;
      margin-top: auto;
    }
    .mini.legendary .rar { color: #8a6300; }
    .mini.epic .rar      { color: #6b3eb6; }
    .mini.rare .rar      { color: #2a7099; }
    .mini.common .rar    { color: #2f6b2f; }

    .mini.new-pop::after {
      content: "NEW!";
      position: absolute;
      top: 5px;
      right: 5px;
      background: #e44a4a;
      color: white;
      font-size: 0.6rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 999px;
      animation: pop 0.8s ease-in-out infinite alternate;
    }
    @keyframes pop {
      from { transform: scale(1); }
      to   { transform: scale(1.15); }
    }

    a.back-link {
      display: inline-block;
      margin-top: 20px;
      color: #2f6df3;
      text-decoration: none;
      font-weight: bold;
    }
    a.back-link:hover { text-decoration: underline; }

    /* DETAIL MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 15, 40, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 14px;
    }
    .modal-backdrop.show { display: flex; }
    .detail-card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      max-width: 380px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
      animation: modalIn 0.35s cubic-bezier(0.5, 1.5, 0.6, 1);
    }
    @keyframes modalIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .detail-card.legendary {
      background: linear-gradient(160deg, #fffbef, #fff5d8);
      border: 4px solid var(--legendary);
      box-shadow: 0 0 30px rgba(245, 180, 0, 0.4);
    }
    .detail-card.epic {
      background: linear-gradient(160deg, #faf5ff, #f0e6ff);
      border: 4px solid var(--epic);
      box-shadow: 0 0 30px rgba(166, 108, 255, 0.4);
    }
    .detail-card.rare {
      background: linear-gradient(160deg, #f0fbff, #d8efff);
      border: 4px solid var(--rare);
      box-shadow: 0 0 30px rgba(77, 193, 240, 0.4);
    }
    .detail-card.common {
      background: linear-gradient(160deg, #f4faf0, #ddeed8);
      border: 4px solid var(--common);
      box-shadow: 0 0 24px rgba(108, 191, 108, 0.35);
    }
    .detail-card.locked {
      background: #f4f1ec;
      border: 4px dashed #cfc6b3;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(255,255,255,0.7);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      color: #4a4030;
    }
    .rarity-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .detail-card.legendary .rarity-tag { background: var(--legendary); color: #4a3500; }
    .detail-card.epic       .rarity-tag { background: var(--epic);      color: white; }
    .detail-card.rare       .rarity-tag { background: var(--rare);      color: white; }
    .detail-card.common     .rarity-tag { background: var(--common);    color: white; }
    .detail-card.locked     .rarity-tag { background: #cfc6b3; color: #5a5547; }
    .pet-id-row {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #7a7460;
      font-weight: bold;
      margin: 8px 0 2px;
    }
    .pet-name {
      margin: 0;
      font-size: 1.5rem;
    }
    .pet-stage {
      position: relative;
      height: 140px;
      margin: 8px 0 12px;
      display: grid;
      place-items: center;
      user-select: none;
    }
    .pet-emoji {
      font-size: 5.5rem;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
    }
    .pet-emoji:hover { transform: scale(1.08) rotate(-6deg); }
    .pet-emoji.anim-spin    { animation: nuckyWaddle 0.9s ease-in-out; }
    .pet-emoji.anim-dash    { animation: zoomDash    0.8s ease-in-out; }
    .pet-emoji.anim-turn    { animation: pipTurn     1.2s ease-in-out; }
    .pet-emoji.anim-bounce  { animation: cometBounce 1.1s ease-in-out; }
    .pet-emoji.anim-wiggle  { animation: wiggle      0.7s ease-in-out; }
    .pet-emoji.anim-hop     { animation: hop         0.8s ease-in-out; }
    .pet-emoji.anim-flutter { animation: flutter     1s ease-in-out; }

    @keyframes nuckyWaddle {
      0% { transform: scale(1) rotate(0deg) translateY(0); }
      30% { transform: scale(1.15) rotate(180deg) translateY(-12px); }
      60% { transform: scale(1.15) rotate(360deg) translateY(-14px); }
      100% { transform: scale(1) rotate(360deg) translateY(0); }
    }
    @keyframes zoomDash {
      0% { transform: translateX(0) scale(1); }
      30% { transform: translateX(60px) scale(1.15); }
      35% { opacity: 0; }
      36% { transform: translateX(-80px) scale(1.15); opacity: 0; }
      37% { opacity: 1; }
      100% { transform: translateX(0) scale(1); }
    }
    @keyframes pipTurn {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(360deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes cometBounce {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      25% { transform: translateY(-40px) scale(1.1) rotate(-15deg); }
      50% { transform: translateY(0) scale(1) rotate(0deg); }
      75% { transform: translateY(-30px) scale(1.1) rotate(15deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg) scale(1.1); }
      75% { transform: rotate(15deg) scale(1.1); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-30px) scale(1.12); }
      70% { transform: translateY(-6px) scale(1.05); }
    }
    @keyframes flutter {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-12px) translateX(-8px) rotate(-8deg); }
      50% { transform: translateY(-18px) translateX(8px) rotate(8deg); }
      75% { transform: translateY(-6px) translateX(-4px) rotate(-4deg); }
    }

    .callout-bubble {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scale(0);
      background: white;
      border: 2px solid currentColor;
      border-radius: 14px;
      padding: 6px 12px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      font-size: 1rem;
    }
    .detail-card.legendary .callout-bubble { color: #b88200; }
    .detail-card.epic       .callout-bubble { color: #6b3eb6; }
    .detail-card.rare       .callout-bubble { color: #2a7099; }
    .detail-card.common     .callout-bubble { color: #2f6b2f; }
    .callout-bubble.show { transform: translateX(-50%) scale(1); opacity: 1; }

    .desc { font-style: italic; margin: 6px 0 12px; line-height: 1.4; font-size: 0.95rem; }
    .ability {
      background: rgba(255,255,255,0.7);
      border-left: 4px solid currentColor;
      padding: 8px 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .detail-card.legendary .ability { border-left-color: var(--legendary); }
    .detail-card.epic       .ability { border-left-color: var(--epic); }
    .detail-card.rare       .ability { border-left-color: var(--rare); }
    .detail-card.common     .ability { border-left-color: var(--common); }
    .ability-name { font-weight: bold; }
    .detail-card.legendary .ability-name { color: #8a6300; }
    .detail-card.epic       .ability-name { color: #6b3eb6; }
    .detail-card.rare       .ability-name { color: #2a7099; }
    .detail-card.common     .ability-name { color: #2f6b2f; }

    .info-row { display: flex; gap: 8px; margin: 6px 0; font-size: 0.92rem; }
    .info-row .label { font-weight: bold; min-width: 100px; }
    .stat-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; font-size: 0.88rem; }
    .stat-label { min-width: 80px; font-weight: bold; }
    .stars { letter-spacing: 1px; }
    .star-off { color: #e0d5b3; }
    .detail-card.legendary .star-on { color: var(--legendary); }
    .detail-card.epic       .star-on { color: var(--epic); }
    .detail-card.rare       .star-on { color: var(--rare); }
    .detail-card.common     .star-on { color: var(--common); }

    .silhouette { font-size: 5.5rem; filter: brightness(0) opacity(0.22); }
    .unlock-clue {
      text-align: center;
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: bold;
      color: #6a5a40;
      border: 2px dashed #cfc6b3;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    /* CELEBRATION MODAL */
    .celeb-card {
      background: linear-gradient(160deg, #fffbef, #ffe7a8);
      border-radius: 24px;
      padding: 26px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 4px solid var(--legendary);
      position: relative;
      overflow: hidden;
      animation: modalIn 0.5s cubic-bezier(0.5, 1.5, 0.6, 1);
    }
    .celeb-card.epic   { border-color: var(--epic); background: linear-gradient(160deg, #faf5ff, #e8d6ff); }
    .celeb-card.rare   { border-color: var(--rare); background: linear-gradient(160deg, #f0fbff, #c8e6f5); }
    .celeb-card.common { border-color: var(--common); background: linear-gradient(160deg, #f4faf0, #ccdec5); }
    .celeb-card h2 { margin: 0 0 6px; font-size: 1.3rem; color: #4a3500; }
    .celeb-card.epic   h2 { color: #4a2890; }
    .celeb-card.rare   h2 { color: #1a4d6e; }
    .celeb-card.common h2 { color: #1f4a1f; }
    .big-emoji {
      font-size: 4.5rem;
      margin: 12px 0;
      display: inline-block;
      animation: spin360 1.2s ease-in-out;
    }
    @keyframes spin360 {
      from { transform: rotate(0deg) scale(0.4); }
      to   { transform: rotate(360deg) scale(1); }
    }
    .pet-tag { font-size: 1.15rem; font-weight: bold; margin-bottom: 6px; }
    .celeb-card button {
      background: var(--legendary);
      color: #4a3500;
      border: none;
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      font-family: inherit;
    }
    .celeb-card.epic button   { background: var(--epic); color: white; }
    .celeb-card.rare button   { background: var(--rare); color: white; }
    .celeb-card.common button { background: var(--common); color: white; }
    .confetti { position: absolute; width: 8px; height: 8px; pointer-events: none; }
  </style>
</head>
<body>
  <main class="page">
    <h1>🐾 Ezra's Legendary Pets</h1>
    <p class="subtitle">Tap a pet card to see them in action. Find more by playing the other games!</p>
    <p class="progress-line" id="summary"></p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="filters" id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="common" class="r-common">Common</button>
      <button data-filter="rare" class="r-rare">Rare</button>
      <button data-filter="epic" class="r-epic">Epic</button>
      <button data-filter="legendary" class="r-legendary">Legendary</button>
      <button data-filter="locked">🔒 Locked</button>
    </div>

    <section class="binder" id="binder"></section>

    <a class="back-link" href="index.html">← Back to Game Hub</a>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div id="modalContent"></div>
  </div>

  <script>
    // ============ PET DATA (35 pets) ============
    const PETS = [

      { id: "001", name: "Nucky the Duck",     emoji: "🦆", rarity: "Legendary",

      { id: "007", name: "Fang the Tiger", emoji: "🐯", rarity: "Epic",

      { id: "009", name: "Tusker the Elephant", emoji: "🐘", rarity: "Epic",

      { id: "010", name: "Hop the Kangaroo", emoji: "🦘", rarity: "Epic",

        personality: { Friendly: 5, Silly: 4, Calm: 5 },
        sound: "chime", callout: "Brrr-illiant!", anim: "wiggle",
        unlock: { type: "drop" }, unlockHint: "A pet drop reward — keep playing!" }
    ];

    const DROP_WEIGHTS = { Common: 35, Rare: 18, Epic: 5, Legendary: 1 };

    // ============ STORAGE ============
    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    }
    function saveJSON(key, data) {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }
    const loadAchievements = () => loadJSON("ezraAchievements_v1", {});
    const loadBrainQuest = () => loadJSON("ezraBrainQuestProgress_v1", { badges: {} });
    const loadDrops = () => loadJSON("ezraPetUnlocks_v1", {});
    const saveDrops = d => saveJSON("ezraPetUnlocks_v1", d);
    const loadSeen = () => loadJSON("ezraPetSeen_v1", {});
    const saveSeen = d => saveJSON("ezraPetSeen_v1", d);
    const loadTriggers = () => loadJSON("ezraPetTriggers_v1", { pendingRolls: 0 });
    const saveTriggers = d => saveJSON("ezraPetTriggers_v1", d);

    function isUnlocked(pet) {
      const u = pet.unlock;
      if (u.type === "always") return true;
      if (u.type === "carodsWin") return (loadAchievements().carodsWins || 0) >= 1;
      if (u.type === "brainQuestGold") {
        return Object.entries(loadBrainQuest().badges || {})
          .some(([k, v]) => v === "gold" && k.endsWith("-2"));
      }
      if (u.type === "principalChallenge") {
        const b = (loadBrainQuest().badges || {})["principal-0"];
        return b === "silver" || b === "gold";
      }
      if (u.type === "drop") return !!loadDrops()[pet.id];
      return false;
    }

    // Consume pending pet rolls and grant random locked drop-pool pets
    function consumePendingRolls() {
      const trig = loadTriggers();
      let rolls = trig.pendingRolls || 0;
      if (rolls <= 0) return [];
      const drops = loadDrops();
      const dropPool = PETS.filter(p => p.unlock.type === "drop" && !drops[p.id]);
      const granted = [];
      while (rolls > 0 && dropPool.length > 0) {
        // weighted random
        const weighted = [];
        dropPool.forEach(p => {
          const w = DROP_WEIGHTS[p.rarity] || 1;
          for (let i = 0; i < w; i++) weighted.push(p);
        });
        const chosen = weighted[Math.floor(Math.random() * weighted.length)];
        drops[chosen.id] = true;
        granted.push(chosen);
        const idx = dropPool.indexOf(chosen);
        if (idx >= 0) dropPool.splice(idx, 1);
        rolls--;
      }
      saveDrops(drops);
      // any leftover rolls (no drops available because all unlocked) are wasted
      saveTriggers({ pendingRolls: 0 });
      return granted;
    }

    // ============ SOUNDS ============
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
      }
      return audioCtx;
    }
    function tone(freq, dur, type, vol, delay, finalFreq) {
      const ctx = ensureAudio(); if (!ctx) return;
      const start = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, start);
      if (finalFreq) osc.frequency.exponentialRampToValueAtTime(finalFreq, start + dur);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(vol || 0.16, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.05);
    }
    function filteredTone(freq, finalFreq, dur, vol) {
      const ctx = ensureAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(finalFreq, now + dur);
      filter.type = "bandpass"; filter.frequency.value = 900; filter.Q.value = 4;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(vol || 0.22, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + dur + 0.05);
    }
    const SOUNDS = {
      quack:   () => filteredTone(600, 420, 0.25),
      zoom:    () => tone(180, 0.4, "sawtooth", 0.18, 0, 900),
      hoot:    () => { tone(440, 0.25, "sine", 0.18, 0, 374); tone(440, 0.25, "sine", 0.18, 0.35, 374); },
      woof:    () => { tone(220, 0.2, "square", 0.16, 0, 110); tone(300, 0.2, "square", 0.16, 0.18, 150); },
      meow:    () => tone(700, 0.25, "sine", 0.16, 0, 500),
      roar:    () => tone(120, 0.45, "sawtooth", 0.22, 0, 80),
      growl:   () => tone(140, 0.35, "sawtooth", 0.18, 0, 100),
      yip:     () => { tone(900, 0.08, "square", 0.14); tone(1100, 0.08, "square", 0.14, 0.1); },
      howl:    () => tone(330, 0.6, "sine", 0.16, 0, 660),
      hiss:    () => tone(2000, 0.4, "sawtooth", 0.05, 0, 1200),
      squeak:  () => tone(1200, 0.1, "square", 0.12, 0, 1600),
      ribbit:  () => { tone(180, 0.08, "square", 0.18); tone(140, 0.12, "square", 0.18, 0.1); },
      buzz:    () => tone(220, 0.35, "sawtooth", 0.1),
      chirp:   () => { tone(2200, 0.05, "sine", 0.12); tone(2600, 0.05, "sine", 0.12, 0.06); tone(2400, 0.05, "sine", 0.12, 0.12); },
      cluck:   () => { tone(500, 0.05, "square", 0.16); tone(600, 0.08, "square", 0.16, 0.06); },
      baa:     () => tone(330, 0.4, "sawtooth", 0.16, 0, 250),
      oink:    () => { tone(300, 0.1, "square", 0.18); tone(220, 0.1, "square", 0.18, 0.1); },
      moo:     () => tone(180, 0.5, "sine", 0.18, 0, 130),
      trumpet: () => tone(330, 0.4, "square", 0.18, 0, 220),
      boing:   () => tone(220, 0.3, "sine", 0.16, 0, 880),
      chitter: () => { for (let i = 0; i < 5; i++) tone(1400 + i*100, 0.05, "square", 0.1, i*0.05); },
      gobble:  () => { for (let i = 0; i < 4; i++) tone(280, 0.08, "square", 0.14, i*0.08, 220); },
      yawn:    () => tone(220, 0.7, "sine", 0.12, 0, 140),
      chime:   () => { [1318, 1568, 1976].forEach((f, i) => tone(f, 0.18, "triangle", 0.14, i*0.08)); },
      vroom:   () => { tone(150, 0.3, "sawtooth", 0.18, 0, 250); tone(180, 0.3, "sawtooth", 0.12, 0.05, 280); },
      whistle: () => { tone(1200, 0.15, "sine", 0.16); tone(1500, 0.18, "sine", 0.16, 0.1); },
      sparkle: () => { [1800, 2200, 2600, 3000].forEach((f, i) => tone(f, 0.07, "sine", 0.1, i*0.04)); },
      whoosh:  () => tone(300, 0.4, "sawtooth", 0.12, 0, 80)
    };
    function sparkle() {
      [1318, 1568, 1976, 2349].forEach((f, i) => tone(f, 0.18, "sine", 0.12, i*0.06));
    }

    // ============ DOM ============
    const binder = document.getElementById("binder");
    const summary = document.getElementById("summary");
    const progressFill = document.getElementById("progressFill");
    const filtersEl = document.getElementById("filters");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalContent = document.getElementById("modalContent");

    let currentFilter = "all";
    let modalQueue = [];

    // ============ RENDER ============
    function stars(n) {
      let h = '<span class="stars">';
      for (let i = 0; i < 5; i++) {
        h += i < n ? '<span class="star-on">★</span>' : '<span class="star-off">★</span>';
      }
      return h + '</span>';
    }

    function renderBinder(newlyUnlockedIds) {
      binder.innerHTML = "";
      const seen = loadSeen();
      const filtered = PETS.filter(p => {
        if (currentFilter === "all") return true;
        if (currentFilter === "locked") return !isUnlocked(p);
        return p.rarity.toLowerCase() === currentFilter;
      });
      if (!filtered.length) {
        binder.innerHTML = '<p style="grid-column: 1/-1; text-align:center; opacity:0.7; padding:20px;">No pets to show here yet.</p>';
        return;
      }
      filtered.forEach(pet => {
        const unlocked = isUnlocked(pet);
        const mini = document.createElement("div");
        mini.className = "mini " + (unlocked ? pet.rarity.toLowerCase() : "locked");
        const isNew = unlocked && newlyUnlockedIds.includes(pet.id);
        if (isNew) mini.classList.add("new-pop");
        mini.innerHTML = `
          <span class="num">#${pet.id}</span>
          <span class="face">${pet.emoji}</span>
          <span class="name">${unlocked ? pet.name.split(" ")[0] : "???"}</span>
          <span class="rar">${unlocked ? pet.rarity : "Locked"}</span>
        `;
        mini.addEventListener("click", () => openDetail(pet));
        binder.appendChild(mini);
      });
    }

    function openDetail(pet) {
      const unlocked = isUnlocked(pet);
      modalContent.innerHTML = "";
      const card = document.createElement("div");
      card.className = "detail-card " + (unlocked ? pet.rarity.toLowerCase() : "locked");
      if (unlocked) {
        const personalityHtml = Object.entries(pet.personality).map(([k, v]) =>
          `<div class="stat-row"><span class="stat-label">${k}</span> ${stars(v)}</div>`
        ).join("");
        card.innerHTML = `
          <button class="close-btn" type="button" aria-label="Close">✕</button>
          <span class="rarity-tag">${pet.rarity}</span>
          <div class="pet-id-row">PET #${pet.id}</div>
          <h2 class="pet-name">${pet.name}</h2>
          <p class="desc">${pet.description}</p>
          <div class="pet-stage">
            <span class="pet-emoji" role="button" aria-label="Tap ${pet.name}">${pet.emoji}</span>
            <span class="callout-bubble">${pet.callout || "✨"}</span>
          </div>
          <p style="text-align:center; font-size:0.82rem; opacity:0.7; margin: -6px 0 10px;">Tap ${pet.name.split(" ")[0]} to animate!</p>
          <div class="ability">
            <div class="ability-name">✨ ${pet.ability.name}</div>
            <div>${pet.ability.text}</div>
          </div>
          <div class="info-row"><span class="label">Favourite Food</span><span>${pet.food}</span></div>
          <div class="info-row"><span class="label">Personality</span></div>
          ${personalityHtml}
        `;
        const emojiEl = card.querySelector(".pet-emoji");
        const bubble = card.querySelector(".callout-bubble");
        emojiEl.addEventListener("click", () => {
          const cls = "anim-" + pet.anim;
          emojiEl.classList.remove(cls);
          void emojiEl.offsetWidth;
          emojiEl.classList.add(cls);
          bubble.classList.add("show");
          const s = SOUNDS[pet.sound];
          if (s) s();
          setTimeout(() => bubble.classList.remove("show"), 1000);
        });
      } else {
        card.innerHTML = `
          <button class="close-btn" type="button" aria-label="Close">✕</button>
          <span class="rarity-tag">Locked</span>
          <div class="pet-id-row">PET #${pet.id}</div>
          <h2 class="pet-name">???</h2>
          <p class="desc">A mysterious friend waiting to be discovered...</p>
          <div class="pet-stage"><span class="silhouette">${pet.emoji}</span></div>
          <div class="unlock-clue">🔒 ${pet.unlockHint}</div>
        `;
      }
      modalContent.appendChild(card);
      card.querySelector(".close-btn").addEventListener("click", closeModal);
      modalBackdrop.classList.add("show");
    }

    function closeModal() {
      modalBackdrop.classList.remove("show");
      setTimeout(() => {
        if (modalQueue.length) {
          showCelebration(modalQueue.shift());
        }
      }, 250);
    }
    modalBackdrop.addEventListener("click", e => {
      if (e.target === modalBackdrop) closeModal();
    });

    function showCelebration(pet) {
      modalContent.innerHTML = "";
      const card = document.createElement("div");
      card.className = "celeb-card " + pet.rarity.toLowerCase();
      card.innerHTML = `
        <h2>✨ New Pet Discovered! ✨</h2>
        <div class="big-emoji">${pet.emoji}</div>
        <div class="pet-tag">${pet.name}</div>
        <div style="font-size:0.9rem; opacity:0.85; margin-bottom:6px;">${pet.rarity} · #${pet.id}</div>
        <p style="font-style:italic; margin:10px 0; font-size:0.95rem;">${pet.description}</p>
        <button type="button">Awesome!</button>
      `;
      modalContent.appendChild(card);
      modalBackdrop.classList.add("show");
      sparkle();
      const s = SOUNDS[pet.sound];
      if (s) setTimeout(s, 400);
      spawnConfetti(card);
      card.querySelector("button").addEventListener("click", closeModal);
    }

    function spawnConfetti(host) {
      const colors = ["#f5b400", "#e44a4a", "#4dc1f0", "#a66cff", "#45c265"];
      for (let i = 0; i < 36; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.background = colors[i % colors.length];
        c.style.left = (Math.random() * 100) + "%";
        c.style.top = "-10px";
        c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        host.appendChild(c);
        const dx = (Math.random() - 0.5) * 220;
        const dy = 280 + Math.random() * 200;
        const dur = 1400 + Math.random() * 800;
        c.animate(
          [{ transform: "rotate(0deg)", opacity: 1 },
           { transform: `translate(${dx}px, ${dy}px) rotate(${Math.random()*720}deg)`, opacity: 0 }],
          { duration: dur, easing: "cubic-bezier(0.2, 0.6, 0.4, 1)", fill: "forwards" }
        );
        setTimeout(() => c.remove(), dur);
      }
    }

    // ============ FILTERS ============
    filtersEl.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      filtersEl.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderBinder([]);
    });

    // ============ INIT ============
    function init() {
      // First: process any pending rolls so newly-granted drops are visible
      const grantedFromRolls = consumePendingRolls();

      // Compute current state
      const seen = loadSeen();
      const allUnlocked = PETS.filter(isUnlocked);

      // Newly unlocked = any unlocked pet not yet acknowledged (and not the starter)
      const newlyUnlocked = allUnlocked.filter(p => !seen[p.id] && p.unlock.type !== "always");
      // Auto-mark the starter as seen
      allUnlocked.forEach(p => { if (p.unlock.type === "always") seen[p.id] = true; });
      saveSeen(seen);

      summary.textContent = `🏆 ${allUnlocked.length} of ${PETS.length} pets collected`;
      progressFill.style.width = (allUnlocked.length / PETS.length * 100) + "%";

      renderBinder(newlyUnlocked.map(p => p.id));

      // Queue celebrations
      if (newlyUnlocked.length) {
        modalQueue = newlyUnlocked.slice(1);
        setTimeout(() => {
          // mark all unlocked as seen before showing
          const s2 = loadSeen();
          newlyUnlocked.forEach(p => { s2[p.id] = true; });
          saveSeen(s2);
          showCelebration(newlyUnlocked[0]);
        }, 500);
      }
    }

    init();
  </script>
</body>
</html>
