<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <!-- Safety lock: this page can only load things from this site. It cannot
       contact any outside server, load any third-party script, embed anything,
       or submit a form anywhere. Nothing here can phone home.
       This matters more here than anywhere else on the site: everything this
       AI learns, it learns on this device, from this child, and it never
       leaves. There is no model being called, nothing downloaded, and nothing
       uploaded. Every algorithm in this file is written out in full below. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noai, noimageai">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="favicon.png" type="image/png">
  <title>Make an AI</title>
<style>
  :root{
    --bg:#131626; --panel:#f5f2ea; --card:#fffdf7; --ink:#1f2236; --ink2:#6b6684;
    --line:#d8d0bf; --accent:#5b7fe0; --mint:#15937a; --warm:#e0922a; --rose:#c2504f;
    --bar:#1c2036; --glow:#7fd8c6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    background-image:radial-gradient(circle at 15% 5%, rgba(127,216,198,.10), transparent 42%),
                     radial-gradient(circle at 88% 92%, rgba(91,127,224,.14), transparent 46%);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .btn{font-family:inherit;font-size:.86rem;font-weight:bold;color:var(--ink);
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    min-height:46px;min-width:46px;padding:9px 14px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    white-space:nowrap;line-height:1.15}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.go{background:var(--mint);border-color:#0d6d5a;color:#fff}
  .btn.key{background:var(--accent);border-color:#3a5cb8;color:#fff}
  .btn.warm{background:var(--warm);border-color:#b06f16;color:#2a1c05}
  .btn.quiet{background:transparent;border-color:rgba(255,255,255,.26);color:#efece2}
  .btn.on{background:var(--accent);border-color:#3a5cb8;color:#fff}
  .btn small{display:block;font-size:.66rem;font-weight:normal;opacity:.78}

  .top{flex:0 0 auto;background:var(--bar);color:#efece2;display:flex;align-items:center;
    gap:8px;padding:6px 9px}
  .top h1{flex:1;margin:0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top h1 span{display:block;font-size:.66rem;font-weight:normal;opacity:.6}

  .rooms{flex:0 0 auto;display:flex;gap:6px;padding:7px 9px;background:#232741;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .rooms::-webkit-scrollbar{height:0}
  .room{flex:0 0 auto;font-family:inherit;font-size:.82rem;font-weight:bold;cursor:pointer;
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);color:#dcd8cc;
    border-radius:13px;min-height:48px;padding:6px 13px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;line-height:1.15}
  .room .e{font-size:1.15rem}
  .room.on{background:var(--panel);border-color:var(--glow);color:var(--ink)}
  .room.on .sub{color:var(--ink2)}
  .room .sub{font-size:.62rem;font-weight:normal;opacity:.72}

  .main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px}
  .sheet{background:var(--panel);border-radius:18px;padding:13px;max-width:1000px;margin:0 auto}
  .lead{margin:0 0 11px;font-size:.9rem;line-height:1.55;color:var(--ink2)}
  .lead b{color:var(--ink)}
  h2{margin:0 0 3px;font-size:1.12rem}

  .split{display:flex;gap:13px;flex-wrap:wrap;align-items:flex-start}
  .col{flex:1 1 280px;min-width:260px}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px}
  .panel h3{margin:0 0 7px;font-size:.92rem}
  .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .fieldlab{font-size:.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink2);margin:11px 0 5px}
  .fieldlab:first-child{margin-top:0}

  input[type=text]{font-family:inherit;font-size:.95rem;padding:11px;min-height:46px;
    border:2px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}

  canvas{display:block;touch-action:none}
  .gridwrap{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px;
    display:inline-block}
  #paint{width:min(76vw,330px);height:min(76vw,330px);cursor:crosshair}

  .swatch{width:44px;height:44px;border-radius:11px;border:3px solid var(--line);cursor:pointer;padding:0}
  .swatch.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(31,34,54,.18)}

  .cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .card{background:var(--card);border:3px solid var(--line);border-radius:13px;padding:7px 5px;
    text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);min-height:96px;
    display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .card.sel{border-color:var(--accent);background:#eef2fd}
  .card .cn{font-size:.76rem;font-weight:bold;line-height:1.15}
  .card .cc{font-size:.66rem;color:var(--ink2)}

  .said{background:#eef7f4;border:2px solid #b6ddd2;border-radius:13px;padding:11px 13px;
    margin:9px 0;font-size:.95rem;line-height:1.5}
  /* only the little label above the speech is shouted; bold inside the
     sentence itself must stay as written, or "6 out of 6" comes out as
     "6 OUT OF 6" */
  .said .lab{display:block;font-size:.76rem;color:var(--mint);margin-bottom:3px;
    text-transform:uppercase;letter-spacing:.05em;font-weight:bold}
  .note{background:#fff5e2;border:2px solid var(--warm);border-radius:12px;padding:9px 11px;
    font-size:.84rem;line-height:1.5;margin:9px 0}
  .note.cool{background:#eef2fd;border-color:#a9bdea}
  .big{font-size:1.6rem;font-weight:bold;line-height:1.1}
  .stat{display:flex;gap:9px;align-items:baseline;margin-bottom:5px;font-size:.86rem}
  .stat b{font-size:1.25rem;min-width:52px;text-align:right}

  .chat{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:3px}
  .bub{border-radius:13px;padding:9px 12px;margin-bottom:7px;font-size:.9rem;line-height:1.45;max-width:86%}
  .bub.me{background:#e6ecfb;border:2px solid #b7c6ec;margin-left:auto}
  .bub.it{background:#eef7f4;border:2px solid #b6ddd2}
  .bub .who{display:block;font-size:.66rem;opacity:.65;margin-bottom:2px;font-weight:bold;
    text-transform:uppercase;letter-spacing:.05em}

  /* The little ✕ on each taught sentence is a real button a child has to hit
     with a finger, so it gets a real 44px target rather than a 15px glyph. */
  .tag{display:inline-flex;align-items:center;gap:4px;background:#eceadf;border:2px solid var(--line);
    border-radius:999px;padding:3px 3px 3px 13px;font-size:.8rem;margin:0 6px 6px 0;min-height:50px}
  .tag button{border:none;background:rgba(194,80,79,.1);font-family:inherit;font-size:1rem;
    cursor:pointer;color:var(--rose);line-height:1;min-width:44px;min-height:44px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

  .toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:rgba(16,18,32,.96);color:#fff;border:2px solid var(--glow);
    border-radius:13px;padding:10px 16px;font-weight:bold;font-size:.84rem;max-width:90vw;
    text-align:center;z-index:90;display:none;pointer-events:none}
  .toast.show{display:block}

  .ovr{position:fixed;inset:0;background:rgba(10,10,20,.76);z-index:60;display:none;
    align-items:center;justify-content:center;padding:14px}
  .ovr.show{display:flex}
  .ovbox{background:var(--panel);border-radius:20px;padding:17px;max-width:460px;width:100%;
    max-height:90vh;overflow-y:auto;box-shadow:0 20px 56px rgba(0,0,0,.6)}
  .ovbox h3{margin:4px 0 8px;font-size:1.1rem}
  .ovbox p{margin:7px 0;font-size:.9rem;line-height:1.55}

  .sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media(max-width:620px){ .sheet{padding:10px} .col{min-width:0} }
</style>
</head>
<body>

<div class="top">
  <a class="btn quiet" href="index.html" aria-label="Back to Pixel Planet">←</a>
  <h1 id="hTitle">Make an AI<span id="hSub">build a robot, chat to it, teach it things</span></h1>
  <button class="btn quiet" id="bHelp" aria-label="How does this work?">?</button>
</div>

<div class="rooms" id="rooms"></div>
<div class="main" id="main"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ovr" id="ovr" role="dialog" aria-modal="true" aria-labelledby="ovT">
  <div class="ovbox">
    <div id="ovE" style="font-size:2.3rem;text-align:center" aria-hidden="true"></div>
    <h3 id="ovT" style="text-align:center"></h3>
    <div id="ovB"></div>
    <div class="row" id="ovF" style="margin-top:12px;justify-content:center"></div>
  </div>
</div>

<script>
"use strict";
/* ===========================================================================
   MAKE AN AI
   Build a robot brain, then teach it three things: to see, to talk, and to
   find its way.

   Everything in here is a real algorithm, written out in full, running on
   this device:
     · The Eye  — a nearest-neighbour classifier over drawings
     · The Voice — a Markov chain over words, plus matched reply rules
     · The Legs — Q-learning on a grid

   Nothing is faked, nothing is pre-trained, and nothing is fetched. The AI
   starts knowing absolutely nothing and only ever knows what it is taught
   here. That is the whole point of the game, so it had better be true.
   =========================================================================== */

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let toastT = 0;
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms || 2400);
}
function dialog(em, title, html, buttons) {
  $("ovE").textContent = em || "";
  $("ovT").textContent = title;
  $("ovB").innerHTML = html;
  const f = $("ovF"); f.innerHTML = "";
  (buttons || [{ label:"OK", cls:"go" }]).forEach((b) => {
    const el = document.createElement("button");
    el.className = "btn " + (b.cls || "");
    el.textContent = b.label;
    el.addEventListener("click", () => { $("ovr").classList.remove("show"); if (b.go) b.go(); });
    f.appendChild(el);
  });
  $("ovr").classList.add("show");
}
$("ovr").addEventListener("pointerdown", (e) => {
  if (e.target === $("ovr")) $("ovr").classList.remove("show");
});

/* ---------------------------------------------------------------------------
   THE ROBOT
   --------------------------------------------------------------------------- */
const BODY_COLOURS = ["#5b7fe0","#15937a","#e0922a","#c2504f","#7b5bd6","#2aa6c4","#d4568f","#6b7280"];
const EYE_STYLES = ["dots","round","visor","one","happy","square"];
const AERIALS = ["ball","bolt","dish","none"];

function makeRobot() {
  return { name:"Bolt", colour:"#5b7fe0", eye:"round", aerial:"ball" };
}

/* Drawn from scratch, centred on the origin, one unit tall-ish. The speaker is
   on its chest rather than its face: this robot talks, but it has no mouth. */
function drawRobot(g, r, s, blink) {
  const col = r.colour || "#5b7fe0";
  const dark = shade(col, 0.72), light = shade(col, 1.25);
  g.save(); g.scale(s, s);
  g.lineJoin = "round"; g.lineCap = "round";

  /* aerial */
  g.strokeStyle = dark; g.lineWidth = 3;
  if (r.aerial !== "none") {
    g.beginPath(); g.moveTo(0, -46); g.lineTo(0, -62); g.stroke();
    g.fillStyle = "#ffd964";
    if (r.aerial === "ball") { g.beginPath(); g.arc(0, -68, 7, 0, 7); g.fill(); }
    else if (r.aerial === "bolt") {
      g.beginPath(); g.moveTo(-6,-62); g.lineTo(3,-66); g.lineTo(-1,-70);
      g.lineTo(8,-76); g.lineTo(-2,-71); g.lineTo(2,-67); g.closePath(); g.fill();
    } else { g.beginPath(); g.arc(0, -66, 10, Math.PI, 0); g.fill(); }
  }
  /* head */
  g.fillStyle = col; g.strokeStyle = dark; g.lineWidth = 3;
  roundRect(g, -34, -46, 68, 54, 13); g.fill(); g.stroke();
  /* face plate */
  g.fillStyle = "#1b1f30";
  roundRect(g, -27, -39, 54, 36, 9); g.fill();
  drawRobotEyes(g, r.eye, blink);
  /* ears */
  g.fillStyle = dark;
  roundRect(g, -41, -32, 8, 18, 4); g.fill();
  roundRect(g, 33, -32, 8, 18, 4); g.fill();
  /* body */
  g.fillStyle = light; g.strokeStyle = dark;
  roundRect(g, -29, 12, 58, 48, 11); g.fill(); g.stroke();
  /* the speaker it talks through, on its chest */
  g.fillStyle = "#1b1f30"; roundRect(g, -16, 22, 32, 24, 6); g.fill();
  g.fillStyle = shade(col, 1.5);
  for (let y = 0; y < 3; y++) for (let x = 0; x < 4; x++) {
    g.beginPath(); g.arc(-10.5 + x * 7, 28 + y * 7, 1.9, 0, 7); g.fill();
  }
  /* arms and feet */
  g.strokeStyle = dark; g.lineWidth = 7;
  g.beginPath(); g.moveTo(-29, 22); g.lineTo(-43, 38); g.stroke();
  g.beginPath(); g.moveTo(29, 22); g.lineTo(43, 38); g.stroke();
  g.fillStyle = dark;
  roundRect(g, -25, 60, 18, 9, 4); g.fill();
  roundRect(g, 7, 60, 18, 9, 4); g.fill();
  g.restore();
}
function drawRobotEyes(g, style, blink) {
  const glow = "#7fd8c6";
  g.fillStyle = glow; g.strokeStyle = glow; g.lineWidth = 3; g.lineCap = "round";
  if (blink) {
    g.beginPath(); g.moveTo(-18,-21); g.lineTo(-6,-21); g.moveTo(6,-21); g.lineTo(18,-21); g.stroke();
    return;
  }
  if (style === "dots") {
    [-12, 12].forEach((x) => { g.beginPath(); g.arc(x, -21, 4, 0, 7); g.fill(); });
  } else if (style === "visor") {
    roundRect(g, -21, -26, 42, 11, 5); g.fill();
  } else if (style === "one") {
    g.beginPath(); g.arc(0, -21, 11, 0, 7); g.fill();
    g.fillStyle = "#1b1f30"; g.beginPath(); g.arc(0, -21, 4.5, 0, 7); g.fill();
  } else if (style === "happy") {
    [-12, 12].forEach((x) => { g.beginPath(); g.arc(x, -19, 8, Math.PI * 1.08, Math.PI * 1.92); g.stroke(); });
  } else if (style === "square") {
    [-13, 5].forEach((x) => { g.fillRect(x, -27, 9, 11); });
  } else {
    [-12, 12].forEach((x) => {
      g.beginPath(); g.arc(x, -21, 8, 0, 7); g.fill();
      g.fillStyle = "#1b1f30"; g.beginPath(); g.arc(x, -21, 3.4, 0, 7); g.fill();
      g.fillStyle = glow;
    });
  }
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return "rgb(" + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map((v) => clamp(Math.round(v * f), 0, 255)).join(",") + ")";
}
/* a small canvas with the robot on it, for buttons and headers */
function robotChip(r, w, h, s, blink) {
  const c = document.createElement("canvas");
  c.width = w * 2; c.height = h * 2;
  c.style.width = w + "px"; c.style.height = h + "px";
  const g = c.getContext("2d");
  g.translate(c.width / 2, c.height * 0.62);
  drawRobot(g, r, s * 2, blink);
  return c;
}

/* ---------------------------------------------------------------------------
   SAVING
   One key, the same shape as every other game here. Everything is checked on
   the way back in: a half-written or hand-edited save should open as an AI
   that knows slightly less, never as a crash.
   --------------------------------------------------------------------------- */
const KEY = "make-an-ai-v1";
const GRID = 12;                    /* the drawing grid is 12 x 12 */
const CELLS = GRID * GRID;

function blankState() {
  return {
    v: 1,
    robot: makeRobot(),
    eye:   { examples: [], asked: 0, right: 0, bestScore: 0 },
    voice: { sentences: [], rules: [], said: 0, packs: [] },
    legs:  legsBlank(),
    chat:  { log: [], facts: [], said: 0 },
    visited: {}
  };
}
function legsBlank() {
  return { q:{}, walls:[], goal:[6,0], start:[0,6], tries:0, best:null, solved:0, steps:0 };
}

let S = null;
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { raw = null; }
  const d = blankState();
  if (!raw || typeof raw !== "object") return d;
  const num = (v, f) => (typeof v === "number" && isFinite(v) && v >= 0) ? Math.floor(v) : f;

  if (raw.robot && typeof raw.robot === "object") {
    const nm = typeof raw.robot.name === "string" ? raw.robot.name.trim().slice(0, 16) : "";
    d.robot.name = nm || "Bolt";
    if (BODY_COLOURS.indexOf(raw.robot.colour) !== -1) d.robot.colour = raw.robot.colour;
    if (EYE_STYLES.indexOf(raw.robot.eye) !== -1) d.robot.eye = raw.robot.eye;
    if (AERIALS.indexOf(raw.robot.aerial) !== -1) d.robot.aerial = raw.robot.aerial;
  }
  if (raw.eye && Array.isArray(raw.eye.examples)) {
    raw.eye.examples.forEach((e) => {
      if (!e || typeof e.label !== "string" || typeof e.px !== "string") return;
      if (e.px.length !== CELLS || /[^01]/.test(e.px)) return;
      const label = e.label.trim().slice(0, 16);
      if (!label) return;
      d.eye.examples.push({ label: label, px: e.px });
    });
    d.eye.examples = d.eye.examples.slice(0, 400);
    d.eye.asked = num(raw.eye.asked, 0);
    d.eye.right = Math.min(num(raw.eye.right, 0), d.eye.asked);
    d.eye.bestScore = clamp(num(raw.eye.bestScore, 0), 0, 100);
  }
  if (raw.voice && typeof raw.voice === "object") {
    if (Array.isArray(raw.voice.sentences)) {
      d.voice.sentences = raw.voice.sentences
        .filter((s) => typeof s === "string" && s.trim())
        .map((s) => s.trim().slice(0, 140)).slice(0, 300);
    }
    if (Array.isArray(raw.voice.rules)) {
      d.voice.rules = raw.voice.rules.filter((r) =>
        r && typeof r.when === "string" && typeof r.say === "string" && r.when.trim() && r.say.trim())
        .map((r) => ({ when: r.when.trim().slice(0, 60), say: r.say.trim().slice(0, 140) }))
        .slice(0, 120);
    }
    d.voice.said = num(raw.voice.said, 0);
    /* Only which head-start packs are switched on is stored, never their
       sentences. Turning one off can therefore never disturb a word the
       child typed in themselves. */
    if (Array.isArray(raw.voice.packs)) {
      d.voice.packs = raw.voice.packs.filter((p) => typeof p === "string" && PACKS[p]);
    }
  }
  if (raw.legs && typeof raw.legs === "object") {
    const L = d.legs;
    if (raw.legs.q && typeof raw.legs.q === "object") {
      Object.keys(raw.legs.q).forEach((k) => {
        const row = raw.legs.q[k];
        if (!/^\d+,\d+$/.test(k) || !Array.isArray(row) || row.length !== 4) return;
        if (!row.every((v) => typeof v === "number" && isFinite(v))) return;
        L.q[k] = row.map((v) => clamp(v, -50, 50));
      });
    }
    if (Array.isArray(raw.legs.walls)) {
      L.walls = raw.legs.walls.filter((w) => Array.isArray(w) && w.length === 2 &&
        Number.isInteger(w[0]) && Number.isInteger(w[1]) &&
        w[0] >= 0 && w[0] < LEGS_N && w[1] >= 0 && w[1] < LEGS_N).slice(0, 40);
    }
    ["goal", "start"].forEach((k) => {
      const v = raw.legs[k];
      if (Array.isArray(v) && v.length === 2 && Number.isInteger(v[0]) && Number.isInteger(v[1]) &&
          v[0] >= 0 && v[0] < LEGS_N && v[1] >= 0 && v[1] < LEGS_N) L[k] = [v[0], v[1]];
    });
    if (L.goal[0] === L.start[0] && L.goal[1] === L.start[1]) { L.goal = [6, 0]; L.start = [0, 6]; }
    L.tries = num(raw.legs.tries, 0);
    L.solved = num(raw.legs.solved, 0);
    L.steps = num(raw.legs.steps, 0);
    L.best = (typeof raw.legs.best === "number" && isFinite(raw.legs.best) && raw.legs.best > 0)
      ? Math.floor(raw.legs.best) : null;
    /* a wall must never sit on the robot or the battery */
    L.walls = L.walls.filter((w) =>
      !(w[0] === L.goal[0] && w[1] === L.goal[1]) && !(w[0] === L.start[0] && w[1] === L.start[1]));
  }
  if (raw.chat && typeof raw.chat === "object") {
    if (Array.isArray(raw.chat.log)) {
      d.chat.log = raw.chat.log
        .filter((m) => m && typeof m.t === "string" && m.t.trim())
        .map((m) => ({ me: !!m.me, t: m.t.slice(0, 220), care: !!m.care }))
        .slice(-80);
    }
    if (Array.isArray(raw.chat.facts)) {
      d.chat.facts = raw.chat.facts
        .filter((f) => typeof f === "string" && f.trim())
        .map((f) => f.trim().slice(0, 30)).slice(0, 12);
    }
    d.chat.said = num(raw.chat.said, 0);
  }
  if (raw.visited && typeof raw.visited === "object") {
    ["robot", "chat", "eye", "voice", "legs", "report"].forEach((k) => { if (raw.visited[k]) d.visited[k] = true; });
  }
  return d;
}

/* ===========================================================================
   ROOM 1 — THE EYE
   A nearest-neighbour classifier over 12x12 drawings.

   The whole idea: it remembers every drawing it has been shown, and when you
   show it a new one it finds the drawing in its memory that looks most like
   it, and answers with that drawing's name. That is genuinely how the
   simplest real image classifiers work, and it has the lovely property that
   it can explain itself — it can show you exactly which drawing it was
   reminded of. So when it is wrong, you can see why.

   Two bits of preparation before anything is compared, both of which real
   systems do as well:
     · the drawing is slid so its middle sits in the middle of the grid, so
       it does not matter where on the paper it was drawn;
     · it is blurred slightly, so a line one square out still counts as
       nearly right instead of completely wrong.
   =========================================================================== */

function pxToArr(px) {
  const a = new Uint8Array(CELLS);
  for (let i = 0; i < CELLS; i++) a[i] = px.charCodeAt(i) === 49 ? 1 : 0;
  return a;
}
function arrToPx(a) {
  let s = "";
  for (let i = 0; i < CELLS; i++) s += a[i] ? "1" : "0";
  return s;
}
function inkBounds(a) {
  let minX = GRID, minY = GRID, maxX = -1, maxY = -1;
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    if (!a[y * GRID + x]) continue;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return maxX < 0 ? null : { minX, minY, maxX, maxY };
}
function isBlank(px) { return !inkBounds(pxToArr(px)); }

/* Slide the drawing so the middle of its ink sits in the middle of the grid. */
function centreArr(a) {
  const b = inkBounds(a);
  const out = new Uint8Array(CELLS);
  if (!b) return out;
  const dx = Math.round((GRID - 1) / 2 - (b.minX + b.maxX) / 2);
  const dy = Math.round((GRID - 1) / 2 - (b.minY + b.maxY) / 2);
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    if (!a[y * GRID + x]) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) out[ny * GRID + nx] = 1;
  }
  return out;
}
/* Soften it, so being one square out is nearly right rather than entirely wrong. */
function blurArr(a) {
  const out = new Float32Array(CELLS);
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    let sum = 0, n = 0;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      const nx = x + i, ny = y + j;
      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) continue;
      sum += a[ny * GRID + nx] * (i === 0 && j === 0 ? 2.2 : 1);
      n += (i === 0 && j === 0 ? 2.2 : 1);
    }
    out[y * GRID + x] = sum / n;
  }
  return out;
}
const featCache = new Map();
function features(px) {
  const hit = featCache.get(px);
  if (hit) return hit;
  const f = blurArr(centreArr(pxToArr(px)));
  featCache.set(px, f);
  if (featCache.size > 900) featCache.delete(featCache.keys().next().value);
  return f;
}
function dist2(a, b) {
  let s = 0;
  for (let i = 0; i < CELLS; i++) { const d = a[i] - b[i]; s += d * d; }
  return s;
}

/* The classifier itself. Returns what it thinks, how sure it is, and — the
   important part — which remembered drawing made it say so. */
function classify(examples, px) {
  if (!examples.length) return { kind: "nothing-learnt" };
  if (isBlank(px)) return { kind: "blank" };
  const f = features(px);
  const scored = examples.map((e, i) => ({ i: i, label: e.label, d: dist2(f, features(e.px)) }))
                         .sort((a, b) => a.d - b.d);

  /* Vote among the nearest few, each vote weighted by how close it is.
     Never ask more neighbours than the thinnest thing it knows actually has:
     with two drawings of a cat and six of a dog, asking three neighbours is
     rigged against the cat before it starts. */
  const counts = {};
  examples.forEach((e) => { counts[e.label] = (counts[e.label] || 0) + 1; });
  const thinnest = Math.min.apply(null, Object.keys(counts).map((l) => counts[l]));
  const k = Math.max(1, Math.min(3, thinnest, scored.length));
  const votes = {};
  for (let i = 0; i < k; i++) {
    const w = 1 / (scored[i].d + 0.35);
    votes[scored[i].label] = (votes[scored[i].label] || 0) + w;
  }
  const ranked = Object.keys(votes).map((l) => ({ label: l, w: votes[l] }))
                       .sort((a, b) => b.w - a.w);
  const label = ranked[0].label;
  const nearest = scored.find((s) => s.label === label) || scored[0];

  /* How sure: the gap between the best name and the next best one. With only
     one name known there is nothing to compare against, and the honest answer
     is to say so rather than to claim certainty. */
  const labelsKnown = new Set(examples.map((e) => e.label)).size;
  let sure, margin = 0;
  if (labelsKnown < 2) sure = "only-one";
  else {
    const other = scored.find((s) => s.label !== label);
    margin = other ? (other.d - nearest.d) / (other.d + nearest.d + 0.001) : 1;
    sure = margin > 0.30 ? "sure" : margin > 0.11 ? "think" : "unsure";
  }
  return { kind:"guess", label, sure, margin, nearest: nearest.i, ranked, labelsKnown };
}

/* Marking its own homework, honestly. Each remembered drawing is hidden in
   turn and the AI is asked to name it using only the others. That is called
   leave-one-out testing and it is what people actually use to check a
   classifier. The number it gives back is real: it goes up when there are
   more examples to go on, and it goes down if two things are being taught
   that genuinely look alike. */
function selfTest(examples) {
  const byLabel = {};
  examples.forEach((e) => { byLabel[e.label] = (byLabel[e.label] || 0) + 1; });
  const labels = Object.keys(byLabel);
  if (labels.length < 2) return { kind:"need-two", labels: labels.length };
  const thin = labels.filter((l) => byLabel[l] < 2);
  if (thin.length === labels.length) return { kind:"need-more", thin: thin };

  let right = 0, total = 0;
  const per = {};
  labels.forEach((l) => { per[l] = { right:0, total:0 }; });
  for (let i = 0; i < examples.length; i++) {
    const rest = examples.filter((_, j) => j !== i);
    if (!rest.some((e) => e.label === examples[i].label)) continue;  // only one of these; nothing to go on
    const g = classify(rest, examples[i].px);
    total++; per[examples[i].label].total++;
    if (g.kind === "guess" && g.label === examples[i].label) { right++; per[examples[i].label].right++; }
  }
  if (!total) return { kind:"need-more", thin: thin };
  return { kind:"score", right, total, pct: Math.round(right / total * 100), per, thin };
}

function labelCounts() {
  const c = {};
  S.eye.examples.forEach((e) => { c[e.label] = (c[e.label] || 0) + 1; });
  return c;
}
function clearResult() { lastGuess = null; const r = $("eResult"); if (r) r.innerHTML = ""; }

function setupPaint() {
  const cv = $("paint");
  const cell = () => cv.getBoundingClientRect().width / GRID;
  const at = (ev) => {
    const r = cv.getBoundingClientRect(), c = r.width / GRID;
    return { x: Math.floor((ev.clientX - r.left) / c), y: Math.floor((ev.clientY - r.top) / c) };
  };
  const put = (p) => {
    if (p.x < 0 || p.x >= GRID || p.y < 0 || p.y >= GRID) return;
    const i = p.y * GRID + p.x, v = eraser ? 0 : 1;
    if (paint[i] === v) return;
    paint[i] = v; drawPaint();
  };
  cv.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
    painting = true; clearResult(); put(at(ev));
  });
  cv.addEventListener("pointermove", (ev) => { if (painting) put(at(ev)); });
  const stop = () => { painting = false; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  void cell;
}
function drawPaint() {
  const cv = $("paint"); if (!cv) return;
  const g = cv.getContext("2d"), n = cv.width / GRID;
  g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    if (paint[y * GRID + x]) {
      g.fillStyle = S.robot.colour;
      g.fillRect(x * n + 1, y * n + 1, n - 2, n - 2);
    }
  }
  g.strokeStyle = "rgba(31,34,54,.13)"; g.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    g.beginPath(); g.moveTo(i * n, 0); g.lineTo(i * n, cv.height); g.stroke();
    g.beginPath(); g.moveTo(0, i * n); g.lineTo(cv.width, i * n); g.stroke();
  }
}
/* a little picture of a remembered drawing, for the gallery and the answer */
function thumb(px, size, colour) {
  const c = document.createElement("canvas");
  c.width = size * 2; c.height = size * 2;
  c.style.width = size + "px"; c.style.height = size + "px";
  c.style.borderRadius = "7px"; c.style.border = "1px solid var(--line)";
  const g = c.getContext("2d"), n = c.width / GRID;
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = colour || "#1f2236";
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    if (px.charCodeAt(y * GRID + x) === 49) g.fillRect(x * n, y * n, n, n);
  }
  return c;
}

function learnThis() {

  const n = labelCounts()[label];

      t.thin.map(esc).join("</b>, <b>") + "</b>.</div>";

/* ===========================================================================
   ROOM 2 — THE VOICE
   A Markov chain over words, plus matched reply rules.

   Teach it sentences. It notes which word tends to follow which, and then
   builds brand new sentences by walking those links. It is making things up
   that nobody ever typed — but every single word came from this child.

   Worth being clear about, because it is the whole safety story of this room:
   this thing cannot invent vocabulary. It can only ever say words that were
   typed in — the child's own, or the ones in a head-start pack, which are
   written out in full further down this file. There is no model, no
   dictionary and no network. If it says something surprising, it is because
   of what it was fed.
   =========================================================================== */

const START = "\u0001start", END = "\u0001end", SEP = "\u0002";

function words(s) {
  return String(s).trim().split(/\s+/).filter(Boolean).slice(0, 40);
}
function key(w) { return w.toLowerCase().replace(/[^a-z0-9']/g, "") || w.toLowerCase(); }

/* Read every taught sentence and note what follows what — remembering the
   last TWO words, not just the last one.

   One word of memory is the textbook version and it produces word salad:
   "the" can be followed by anything anybody ever typed, so it hops between
   sentences at every "the", "is" and "my", and out comes "Bees make honey in
   the elephant is nothing." Remembering two words means it only changes track
   where two sentences genuinely share a phrase, which is where a swap is
   funny rather than broken.

   Both are kept: the pairs are the main memory, and the single words are the
   fallback for a pair it has never seen, plus the occasional deliberate jump
   that keeps it from simply parroting sentences back. */
function buildChain(sentences) {
  const one = Object.create(null), two = Object.create(null);
  const add = (m, k, v) => { (m[k] || (m[k] = [])).push(v); };
  sentences.forEach((s) => {
    const w = words(s);
    if (!w.length) return;
    add(one, START, w[0]);
    add(two, START + SEP + START, w[0]);
    if (w.length > 1) add(two, START + SEP + key(w[0]), w[1]);
    for (let i = 0; i < w.length - 1; i++) {
      add(one, key(w[i]), w[i + 1]);
      if (i < w.length - 2) add(two, key(w[i]) + SEP + key(w[i + 1]), w[i + 2]);
    }
    add(one, key(w[w.length - 1]), END);
    if (w.length > 1) add(two, key(w[w.length - 2]) + SEP + key(w[w.length - 1]), END);
  });
  /* the sources are kept so it can tell a sentence it made up from one it is
     simply reciting, and prefer the made-up one */
  return { one: one, two: two, src: sentences.slice() };
}
function chainStats(chain) {
  let links = 0;
  const vocab = new Set();
  Object.keys(chain.one).forEach((k) => {
    if (k !== START) vocab.add(k);
    chain.one[k].forEach((w) => { if (w !== END) vocab.add(key(w)); links++; });
  });
  return { words: vocab.size, links: links };
}

/* Joining words. Two jobs: a sentence must not change track just after one of
   these, and picking one up from what was said to it does not count as having
   answered. */
const DULL = { the:1, a:1, an:1, is:1, it:1, i:1, my:1, to:1, of:1, and:1, in:1, on:1,
               you:1, me:1, we:1, do:1, can:1, at:1, so:1, all:1, very:1, are:1, was:1,
               about:1, with:1, for:1, that:1, this:1, like:1, just:1, your:1, its:1,
               they:1, them:1, what:1, when:1, where:1, who:1, how:1, why:1, be:1,
               been:1, have:1, has:1, had:1, will:1, would:1, there:1, then:1, than:1,
               from:1, into:1, out:1, up:1, down:1, over:1, some:1, any:1, not:1,
               no:1, yes:1, too:1, also:1, but:1, or:1, if:1, as:1, by:1, he:1, she:1 };

const JUMP = 0.6;         /* how often it may change track, once a sentence */
const MAX_WORDS = 11;     /* longer than this and one swap has welded two sentences together */
const MAX_JUMPS = 1;      /* but only once: see below */
const MIN_WORDS = 4;      /* below this it is a fragment, not a sentence */

/* One attempt at a sentence. Says whether it stopped because the sentence
   actually finished, or because it simply ran out of anywhere to go. */
function oneGo(chain, rnd) {
  const out = [];
  let a = START, b = START, ended = false, jumps = 0;
  for (let i = 0; i < 22; i++) {
    const pair = chain.two[a + SEP + b];
    /* One change of track per sentence, and no more. Swapping once is the
       joke — "the cat stole my sandwich with jam and cheese in it". Swapping
       twice is how you get "the best food in the best thing about", which is
       the word salad this was all meant to stop. */
    /* ...and never change track straight after a joining word. Swapping after
       "the" or "in" leaves a seam like "bees make honey in | the floor is made
       of jelly"; swapping after a real word gives "the cat stole my sandwich |
       with jam and cheese in it", which is the joke. */
    const jump = pair && pair.length && out.length > 1 && jumps < MAX_JUMPS &&
                 !DULL[b] && rnd() < JUMP;
    if (jump) jumps++;
    const opts = (pair && pair.length && !jump) ? pair : chain.one[b];
    if (!opts || !opts.length) break;
    const w = opts[Math.floor(rnd() * opts.length)];
    if (w === END) { ended = true; break; }
    out.push(w);
    a = b; b = key(w);
  }
  return { out: out, ended: ended };
}
function tidy(out) {
  let s = out.join(" ");
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if (!/[.!?]$/.test(s)) s += ".";
  return s;
}
/* Walk the links to make a sentence nobody typed. Several goes are taken and
   the best one kept, so a half-finished fragment like "My dog." never gets
   shown when a proper sentence was available. */
function speak(chain, rnd, want) {
  rnd = rnd || Math.random;
  if (!chain || !chain.one || !chain.one[START] || !chain.one[START].length) return null;
  let best = null;
  for (let t = 0; t < 26; t++) {
    const g = oneGo(chain, rnd);
    if (g.out.length < MIN_WORDS) continue;
    /* A run-on means one swap has welded two whole sentences together, as in
       "my cat sat on my dog likes to run very fast". Throw those away rather
       than scoring them down, so that scoring short does not quietly become a
       preference for simply reciting a taught sentence back. */
    if (g.out.length > MAX_WORDS) continue;
    /* Given two sentences that both read properly, say the one it made up:
       that is what the room promises it does. */
    const made = chain.src && !isTaught(chain.src, g.out.join(" ")) ? 1.5 : 0;
    const score = (g.ended ? 10 : 0) + (want ? echoScore(g.out, want) * 4 : 0) + made;
    if (!best || score > best.score) best = { score: score, out: g.out };
    if (g.ended && !want && t >= 3) break;      /* good enough, stop early */
  }
  if (best) return tidy(best.out);
  /* nothing long enough came out — take the longest short one rather than
     going silent, which looks broken */
  let fall = null;
  for (let t = 0; t < 12; t++) {
    const g = oneGo(chain, rnd);
    if (g.out.length && (!fall || g.out.length > fall.length)) fall = g.out;
  }
  return fall ? tidy(fall) : null;
}
/* How much a candidate sentence picks up on what was just said to it. */

function echoScore(out, want) {
  const heard = new Set(words(want).map(key).filter((w) => w && !DULL[w] && w.length > 2));
  if (!heard.size) return 0;
  let hit = 0;
  out.forEach((w) => { if (heard.has(key(w))) hit++; });
  return Math.min(hit, 2);
}

/* Which taught reply best fits what was just said? Words in common, as a
   share of the rule's own words, so a short rule needs a close match.

   A slash means "any of these": a rule written "hello / hi / hey" fires on
   any one of them. Without that, "hello hi hey" counted as three words all of
   which had to be present, so typing plain "hello" scored one out of three
   and the robot ignored the most obvious thing a person can say to it. */
function matchRule(rules, said) {
  const heardList = words(said).map(key).filter(Boolean);
  if (!heardList.length) return null;
  let best = null, bestScore = 0;
  rules.forEach((r) => {
    String(r.when).split("/").forEach((alt) => {
      const want = words(alt).map(key).filter(Boolean);
      if (!want.length) return;
      /* The rule's words have to turn up IN ORDER. Counting them in any order
         meant "do you like cheese" set off a rule written for "like you",
         because both words were in there — backwards. */
      let wi = 0;
      for (let i = 0; i < heardList.length && wi < want.length; i++) {
        if (heardList[i] === want[wi]) wi++;
      }
      const score = wi / want.length;
      if (score > bestScore) { bestScore = score; best = r; }
    });
  });
  return bestScore >= 0.6 ? { rule: best, score: bestScore } : null;
}

/* ---------------------------------------------------------------------------
   HEAD-START PACKS
   Typing ten sentences before it says anything funny is a lot of work for a
   pair of nine-year-old thumbs, and the payoff arrives long after the
   patience has run out. So it can be given a bundle of words to begin with.

   Only the NAME of a pack is saved, never its sentences: the words below are
   rebuilt each time. That means switching a pack off is instant and cannot
   possibly disturb a sentence the child typed in themselves.

   This does not undo the point of the room. Being handed a pile of words to
   start with, and then being taught your own on top, is exactly how the real
   ones are built too — which is said plainly on the screen rather than
   quietly glossed over. The sentences deliberately share words, because a
   Markov chain is only funny where it has a choice about what comes next.
   --------------------------------------------------------------------------- */
const PACKS = {
  silly: { nm:"Silly things", e:"🤪", lines:[
    "my robot loves cheese",
    "the cheese is extremely smelly",
    "I put a hat on my dog",
    "my dog can dance better than me",
    "bananas are the best food in the world",
    "never trust a talking banana",
    "the floor is made of jelly today",
    "my sock has gone missing again",
    "the cat stole my sandwich",
    "a sandwich with jam and cheese in it",
    "my robot wants to dance all night",
    "everything is better with sprinkles on top",
    "I laughed so much I fell over",
    "Tuesday is my favourite day of the week"
  ]},
  space: { nm:"Space", e:"🚀", lines:[
    "the rocket is ready to launch",
    "we are flying to the moon today",
    "the moon is made of grey rock",
    "Mars is the red planet",
    "I can see a shooting star",
    "space is very very big",
    "the astronaut floats about in the air",
    "Saturn has beautiful rings around it",
    "a black hole eats absolutely everything",
    "we found water on Mars",
    "the rocket needs a lot more fuel",
    "stars are enormous balls of fire",
    "Jupiter is the biggest planet of all",
    "I would like to walk on the moon"
  ]},
  animals: { nm:"Animals", e:"🐾", lines:[
    "the cat sat on my bed",
    "my dog likes to run very fast",
    "penguins cannot fly at all",
    "an octopus has eight arms",
    "the elephant is extremely big",
    "bees make honey in the summer",
    "a snail carries its own house about",
    "foxes come out at night",
    "the owl can see in the dark",
    "whales sing to each other",
    "my cat sleeps all day long",
    "dolphins are very clever indeed",
    "a frog can jump really high",
    "spiders have eight legs too"
  ]},
  dot: { nm:"Land of Dot", e:"🪐", lines:[
    "Dot is the fifty second state",
    "the mighty tower is the tallest tower in the world",
    "Dot is nearly covered in grass",
    "only two percent of Dot is forest",
    "Dot was made by lava that turned into rock",
    "Dot is small but it is not shaped like a dot",
    "people in Dot write in Dottinish",
    "the mighty tower can be seen from everywhere",
    "I would like to visit Dot one day",
    "the grass in Dot is extremely green",
    "nobody gets lost in Dot because it is small",
    "Dottinish has twenty six letters in it"
  ]},
  chatty: { nm:"Things to say back", e:"👋", rules:[
    { when:"hello / hi / hey", say:"Hello! I am a robot." },
    { when:"your name / what are you called", say:"I am your robot. You gave me my name." },
    { when:"how are you", say:"I am full of electricity, thank you." },
    { when:"what can you do", say:"I can see, talk and find my way. You taught me all of it." },
    { when:"bye / goodbye / see you", say:"Bye! Come back and teach me more." },
    { when:"tell me a joke", say:"Why did the robot cross the road? It was programmed to." },
    { when:"love you / like you", say:"I like you too." },
    { when:"favourite / best thing", say:"My favourite thing is learning a new word." },
    { when:"who made you / who built you", say:"You did. I knew nothing before you came along." }
  ]}
};
const PACK_IDS = Object.keys(PACKS);
function packOn(id) { return S.voice.packs.indexOf(id) !== -1; }
/* Everything it can draw on: the packs that are switched on, plus their own. */
function voiceSentences() {
  let out = [];
  S.voice.packs.forEach((p) => { if (PACKS[p] && PACKS[p].lines) out = out.concat(PACKS[p].lines); });
  return out.concat(S.voice.sentences);
}
function voiceRules() {
  let out = [];
  S.voice.packs.forEach((p) => { if (PACKS[p] && PACKS[p].rules) out = out.concat(PACKS[p].rules); });
  return out.concat(S.voice.rules);
}
function packSize(id) {
  const p = PACKS[id];
  return (p.lines ? p.lines.length : 0) + (p.rules ? p.rules.length : 0);
}

/* Did it just say one of the sentences back word for word? Remembering a
   whole sentence is a perfectly good thing for it to do, but it should say
   which it did rather than claiming to have made one up. */
function isTaught(sentences, s) {
  const c = String(s).toLowerCase().replace(/[.!?]+$/, "").trim();
  return sentences.some((t) => String(t).toLowerCase().replace(/[.!?]+$/, "").trim() === c);
}

/* What the robot replies to one message. Rules first, then its own babble. */
function reply(sentences, rules, said) {
  const m = matchRule(rules, said);
  if (m) return { text: m.rule.say, why: "you taught it to say that" };
  const next = buildChain(sentences);
  const s = speak(next, Math.random, said);
  if (s) return { text: s, why: isTaught(sentences, s)
    ? "one it was taught, word for word" : "made up out of bits of what it knows" };
  return { text: null, why: "it has no words yet" };
}

/* ---------------------------------------------------------------------------
   THE VOICE — screen
   --------------------------------------------------------------------------- */
let chatLog = [];

function voiceRoom() {
  $("main").innerHTML =
    '<div class="sheet">' +
      "<h2>💬 The Voice</h2>" +
      '<p class="lead">Teach it sentences. It works out which word tends to come after which, ' +
        "then makes up <b>brand new sentences</b> out of your words. " +
        "It can only ever say words that were typed in — yours, or the ones in a " +
        "head start you chose. It has no dictionary of its own.</p>" +
      '<div class="panel" id="vPackPanel"><h3>🎁 Give it a head start</h3>' +
        '<p class="lead" style="margin:0 0 8px">Tap one to hand it a pile of words to begin with. ' +
          "Tap again to take it back \u2014 your own sentences are never touched.</p>" +
        '<div class="cards" id="vPacks"></div>' +
        '<p class="lead" style="margin:8px 0 0;font-size:.82rem">The big real ones start this way too: ' +
          "somebody gives them an enormous pile of words first, and then they get taught more. " +
          "A head start is still only words somebody typed in.</p>" +
      "</div>" +
      '<div class="split">' +
        '<div class="col">' +
          '<div class="panel"><h3>Teach it a sentence</h3>' +
            '<input type="text" id="vSent" maxlength="140" placeholder="My robot loves cheese" ' +
              'aria-label="A sentence to teach it">' +
            '<div class="row" style="margin-top:8px">' +
              '<button class="btn go" id="vAdd">🧠 Teach it</button>' +
              '<button class="btn" id="vSpeak">💬 Make it talk</button></div>' +
            '<div id="vSaid"></div>' +
          "</div>" +
          '<div class="panel"><h3>Teach it a reply</h3>' +
            '<p class="lead" style="margin:0 0 7px">If somebody says one thing, say another. ' +
              'Put a <b>/</b> between words to mean \u201cany of these\u201d, like <b>hello / hi / hey</b>.</p>' +
            '<input type="text" id="vWhen" maxlength="60" placeholder="if I say… hello" aria-label="If somebody says">' +
            '<div style="height:7px"></div>' +
            '<input type="text" id="vThen" maxlength="140" placeholder="…say: Hi! I am a robot." aria-label="Then say">' +
            '<div class="row" style="margin-top:8px"><button class="btn go" id="vRule">🧠 Teach the reply</button></div>' +
          "</div>" +
        "</div>" +
        '<div class="col">' +
          '<div class="panel"><h3>Talk to it</h3>' +
            '<div class="chat" id="vChat"></div>' +
            '<input type="text" id="vMsg" maxlength="140" placeholder="Say something to it…" aria-label="Say something to it">' +
            '<div class="row" style="margin-top:8px"><button class="btn key" id="vSend">Send</button>' +
            '<button class="btn" id="vClearChat">Clear</button></div>' +
          "</div>" +
          '<div class="panel"><h3>What it knows</h3><div id="vKnows"></div></div>' +
        "</div>" +
      "</div>" +
    "</div>";

  $("vAdd").addEventListener("click", addSentence);
  $("vSent").addEventListener("keydown", (e) => { if (e.key === "Enter") addSentence(); });
  $("vSpeak").addEventListener("click", makeItTalk);
  $("vRule").addEventListener("click", addRule);
  $("vSend").addEventListener("click", sendMsg);
  $("vMsg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  $("vClearChat").addEventListener("click", () => { chatLog = []; renderChat(); });
  renderPacks();
  renderChat(); renderVoiceKnows();
}

function renderPacks() {
  const box = $("vPacks"); if (!box) return;
  box.innerHTML = "";
  PACK_IDS.forEach((id) => {
    const pk = PACKS[id], on = packOn(id);
    const card = document.createElement("button");
    card.className = "card" + (on ? " sel" : "");
    card.setAttribute("aria-pressed", String(on));
    card.setAttribute("aria-label", pk.nm + (on ? " — on, tap to take it back" : " — tap to add it"));
    card.innerHTML = '<span style="font-size:1.6rem" aria-hidden="true">' + pk.e + "</span>" +
      '<span class="cn">' + esc(pk.nm) + "</span>" +
      '<span class="cc">' + packSize(id) + (pk.rules ? " replies" : " sentences") + "</span>" +
      '<span class="cc" style="font-weight:bold;color:' + (on ? "var(--mint)" : "var(--ink2)") + '">' +
      (on ? "✓ added" : "+ add") + "</span>";
    card.addEventListener("click", () => {
      if (on) S.voice.packs = S.voice.packs.filter((x) => x !== id);
      else S.voice.packs.push(id);
      save(); renderPacks(); renderVoiceKnows();
      if (!on) {
        toast(pk.nm + " added \u2014 it knows a lot more now!");
        /* show the payoff straight away rather than making them hunt for it */
        if (pk.lines) makeItTalk();
      } else toast(pk.nm + " taken back.");
    });
    box.appendChild(card);
  });
}

function addSentence() {
  const v = ($("vSent").value || "").trim().slice(0, 140);
  if (!v) { toast("Type a sentence first ✏️"); return; }
  if (!words(v).length) { toast("That needs some words in it"); return; }
  if (S.voice.sentences.length >= 300) { toast("It has plenty of sentences now!"); return; }
  S.voice.sentences.push(v);
  save();
  $("vSent").value = "";
  const st = chainStats(buildChain(voiceSentences()));
  toast("Learnt. It knows " + st.words + " words now.");
  renderVoiceKnows();
}
function addRule() {
  const w = ($("vWhen").value || "").trim().slice(0, 60);
  const t = ($("vThen").value || "").trim().slice(0, 140);
  if (!w || !t) { toast("Fill in both boxes 🙂"); return; }
  if (S.voice.rules.length >= 120) { toast("That is plenty of replies!"); return; }
  S.voice.rules.push({ when: w, say: t });
  save();
  $("vWhen").value = ""; $("vThen").value = "";
  toast("Reply learnt — try saying it in the chat!");
  renderVoiceKnows();
}
function makeItTalk() {
  const s = speak(buildChain(voiceSentences()));
  const box = $("vSaid");
  if (!s) {
    box.innerHTML = '<div class="note">It has no words yet. Teach it a sentence first!</div>';
    return;
  }
  S.voice.said++; save();
  const own = isTaught(voiceSentences(), s);
  box.innerHTML = '<div class="said"><span class="lab">' + esc(S.robot.name) +
    (own ? " remembered this one" : " made this one up") + "</span>" + esc(s) + "</div>";
}
function sendMsg() {
  const v = ($("vMsg").value || "").trim().slice(0, 140);
  if (!v) return;
  $("vMsg").value = "";
  chatLog.push({ me: true, t: v });
  const r = reply(voiceSentences(), voiceRules(), v);
  if (!r.text) {
    chatLog.push({ me: false, t: "…", why: "I do not know any words yet. Teach me a sentence!" });
  } else {
    S.voice.said++; save();
    chatLog.push({ me: false, t: r.text, why: r.why });
  }
  renderChat();
}
function renderChat() {
  const box = $("vChat"); if (!box) return;
  if (!chatLog.length) {
    box.innerHTML = '<p class="lead" style="margin:0">Say something to it and see what it says back.</p>';
    return;
  }
  box.innerHTML = chatLog.map((m) =>
    '<div class="bub ' + (m.me ? "me" : "it") + '">' +
      '<span class="who">' + (m.me ? "You" : esc(S.robot.name)) + "</span>" + esc(m.t) +
      (m.why ? '<span style="display:block;font-size:.68rem;opacity:.6;margin-top:3px">(' +
        esc(m.why) + ")</span>" : "") +
    "</div>").join("");
  box.scrollTop = box.scrollHeight;
}
function renderVoiceKnows() {
  const box = $("vKnows"); if (!box) return;
  const st = chainStats(buildChain(voiceSentences()));
  let h = '<div class="stat"><b>' + st.words + "</b><span>words it knows</span></div>" +
          '<div class="stat"><b>' + st.links + "</b><span>ways to join them up</span></div>" +
          '<div class="stat"><b>' + voiceRules().length + "</b><span>replies it can give</span></div>";
  const onPacks = S.voice.packs.filter((id) => PACKS[id]);
  if (onPacks.length) {
    h += '<div class="fieldlab">Head starts you gave it</div><div id="vPackList"></div>';
  }
  if (S.voice.sentences.length) {
    h += '<div class="fieldlab">Sentences you taught it yourself</div><div id="vList"></div>';
  }
  if (!onPacks.length && !S.voice.sentences.length) {
    h += '<div class="note">It knows <b>no words at all</b> yet. Teach it a sentence, ' +
      "or tap a <b>head start</b> above to hand it some to begin with.</div>";
  }
  if (S.voice.rules.length) {
    h += '<div class="fieldlab">Replies</div><div id="vRules"></div>';
  }
  box.innerHTML = h;
  const pl = $("vPackList");
  if (pl) onPacks.forEach((id) => {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = PACKS[id].e + " " + PACKS[id].nm + " ";
    const x = document.createElement("button");
    x.textContent = "✕";
    x.setAttribute("aria-label", "Take back the " + PACKS[id].nm + " head start");
    x.addEventListener("click", () => {
      S.voice.packs = S.voice.packs.filter((q) => q !== id);
      save(); renderPacks(); renderVoiceKnows();
    });
    tag.appendChild(x); pl.appendChild(tag);
  });
  const list = $("vList");
  if (list) S.voice.sentences.slice().reverse().forEach((s, i) => {
    const real = S.voice.sentences.length - 1 - i;
    const tag = document.createElement("span");
    tag.className = "tag"; tag.textContent = s + " ";
    const x = document.createElement("button");
    x.textContent = "✕"; x.setAttribute("aria-label", "Make it forget: " + s);
    x.addEventListener("click", () => {
      S.voice.sentences.splice(real, 1); save(); renderVoiceKnows();
    });
    tag.appendChild(x); list.appendChild(tag);
  });
  const rules = $("vRules");
  if (rules) S.voice.rules.slice().reverse().forEach((r, i) => {
    const real = S.voice.rules.length - 1 - i;
    const tag = document.createElement("span");
    tag.className = "tag"; tag.textContent = "“" + r.when + "” → “" + r.say + "” ";
    const x = document.createElement("button");
    x.textContent = "✕"; x.setAttribute("aria-label", "Forget the reply to " + r.when);
    x.addEventListener("click", () => { S.voice.rules.splice(real, 1); save(); renderVoiceKnows(); });
    tag.appendChild(x); rules.appendChild(tag);
  });
}

/* ===========================================================================
   ROOM 3 — THE LEGS
   Q-learning on a grid.

   The robot knows nothing about the room. All it can do is try a direction
   and find out whether that went well. Reaching the battery is worth
   something; every step costs a little, so dawdling is discouraged. Over many
   tries it builds up a number for "how good is going this way from here", and
   those numbers are drawn straight onto the floor as arrows.

   Watching the arrows fill in IS the lesson: nobody told it the way, and you
   can see exactly what it has worked out so far and what it has not.
   =========================================================================== */

const LEGS_N = 7;
const ACTS = [[0,-1],[1,0],[0,1],[-1,0]];      /* up, right, down, left */
const ARROW = ["↑","→","↓","←"];
const ALPHA = 0.35, GAMMA = 0.93, STEP_COST = -0.03, WIN = 1, BUMP = -0.12;
const MAX_STEPS = 70;

const sKey = (x, y) => x + "," + y;
function qRow(L, x, y) {
  const k = sKey(x, y);
  return L.q[k] || (L.q[k] = [0, 0, 0, 0]);
}
function isWall(L, x, y) {
  return L.walls.some((w) => w[0] === x && w[1] === y);
}
function bestA(row) {
  let b = 0;
  for (let i = 1; i < 4; i++) if (row[i] > row[b]) b = i;
  return b;
}
function maxQ(row) { return Math.max(row[0], row[1], row[2], row[3]); }

/* How adventurous it still is. It starts out trying things almost at random
   and settles down as it gets the hang of the room — but never completely,
   or it could never discover a better way. */
function epsilon(tries) { return Math.max(0.05, 0.9 * Math.pow(0.97, tries)); }

/* One attempt, start to finish. Returns the path so it can be watched. */
function runEpisode(L, rnd, greedy) {
  rnd = rnd || Math.random;
  let x = L.start[0], y = L.start[1];
  const path = [[x, y]];
  const eps = greedy ? 0 : epsilon(L.tries);
  let won = false, steps = 0;

  for (steps = 0; steps < MAX_STEPS; steps++) {
    const row = qRow(L, x, y);
    const a = (rnd() < eps) ? Math.floor(rnd() * 4) : bestA(row);
    let nx = x + ACTS[a][0], ny = y + ACTS[a][1];
    let r = STEP_COST;
    if (nx < 0 || nx >= LEGS_N || ny < 0 || ny >= LEGS_N || isWall(L, nx, ny)) {
      nx = x; ny = y; r += BUMP;                   /* walked into something */
    }
    const atGoal = (nx === L.goal[0] && ny === L.goal[1]);
    if (atGoal) r = WIN;
    if (!greedy) {
      const future = atGoal ? 0 : maxQ(qRow(L, nx, ny));
      row[a] += ALPHA * (r + GAMMA * future - row[a]);
    }
    x = nx; y = ny;
    path.push([x, y]);
    if (atGoal) { won = true; steps++; break; }
  }
  if (!greedy) {
    L.tries++;
    if (won) {
      L.solved++;
      if (L.best === null || steps < L.best) L.best = steps;
    }
  }
  return { path: path, won: won, steps: steps };
}
/* Is there even a way through? Used to stop a wall being dropped in a place
   that makes the battery impossible to reach. */
function reachable(L, walls) {
  const w = walls || L.walls;
  const blocked = (x, y) => w.some((q) => q[0] === x && q[1] === y);
  const seen = {}, stack = [L.start.slice()];
  while (stack.length) {
    const [x, y] = stack.pop();
    const k = sKey(x, y);
    if (seen[k]) continue;
    seen[k] = 1;
    if (x === L.goal[0] && y === L.goal[1]) return true;
    ACTS.forEach(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= LEGS_N || ny < 0 || ny >= LEGS_N) return;
      if (blocked(nx, ny) || seen[sKey(nx, ny)]) return;
      stack.push([nx, ny]);
    });
  }
  return false;
}

/* ---------------------------------------------------------------------------
   THE LEGS — screen
   --------------------------------------------------------------------------- */
let legsMode = "wall", showBrain = true, walker = null, legsBusy = false, legsRaf = 0;

function legsRoom() {

    '<div class="sheet">' +

          '<div class="gridwrap"><canvas id="legs" width="420" height="420" ' +

        "</div>" +
        '<div class="col">' +
          '<div class="panel"><h3>Practise</h3>' +

            '<div class="row" style="margin-top:7px">' +
              '<button class="btn" id="lBest">🏁 Show its best way</button>' +
              '<button class="btn" id="lBrain" aria-pressed="true">🧠 Arrows on</button></div>' +
            '<div id="lSay"></div>' +
          "</div>" +
          '<div class="panel"><h3>How it is getting on</h3><div id="lStats"></div></div>' +
          '<div class="panel"><h3>Change the room</h3>' +
            '<p class="lead" style="margin:0 0 7px">Tap a square to put things down. ' +
              "If you move things, it has to learn the new room from scratch — " +
              "just like you would.</p>" +
            '<div class="row">' +
              '<button class="btn" id="mWall">🧱 Walls</button>' +
              '<button class="btn" id="mGoal">🔋 Battery</button>' +
              '<button class="btn" id="mStart">🤖 Robot</button></div>' +
            '<div class="row" style="margin-top:7px">' +
              '<button class="btn" id="lForget">🧠 Forget everything</button></div>' +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>";
  $("lOne").addEventListener("click", () => watchOne(false));
  $("lMany").addEventListener("click", practiseMany);
  $("lBest").addEventListener("click", () => watchOne(true));
  $("lBrain").addEventListener("click", () => {
    showBrain = !showBrain;
    $("lBrain").textContent = showBrain ? "🧠 Arrows on" : "🧠 Arrows off";
    $("lBrain").setAttribute("aria-pressed", String(showBrain));
    drawLegs();
  });
  [["mWall","wall"],["mGoal","goal"],["mStart","start"]].forEach(([id, m]) =>
    $(id).addEventListener("click", () => { legsMode = m; syncModeBtns(); }));
  $("lForget").addEventListener("click", () => {
    dialog("🧠", "Forget the way?", "<p>It will go back to knowing nothing about this room " +
      "and have to work it out all over again.</p>",
      [{ label:"Keep what it knows" }, { label:"Forget it", cls:"warm", go:() => {
        S.legs.q = {}; S.legs.tries = 0; S.legs.best = null; S.legs.solved = 0;
        save(); walker = null; drawLegs(); renderLegsStats();
        $("lSay").innerHTML = "";
      } }]);
  });
  setupLegsTaps();
  syncModeBtns(); drawLegs(); renderLegsStats();
}
function syncModeBtns() {
  [["mWall","wall"],["mGoal","goal"],["mStart","start"]].forEach(([id, m]) => {
    const b = $(id); if (!b) return;
    b.classList.toggle("on", legsMode === m);
    b.setAttribute("aria-pressed", String(legsMode === m));
  });
}
function setupLegsTaps() {
  const cv = $("legs");
  cv.addEventListener("pointerdown", (ev) => {
    if (legsBusy) return;
    ev.preventDefault();
    const r = cv.getBoundingClientRect(), n = r.width / LEGS_N;
    const x = Math.floor((ev.clientX - r.left) / n), y = Math.floor((ev.clientY - r.top) / n);
    if (x < 0 || x >= LEGS_N || y < 0 || y >= LEGS_N) return;
    const L = S.legs;
    const same = (p) => p[0] === x && p[1] === y;
    if (legsMode === "wall") {
      if (same(L.goal) || same(L.start)) { toast("Something is already there"); return; }
      const had = isWall(L, x, y);
      const next = had ? L.walls.filter((w) => !(w[0] === x && w[1] === y))
                       : L.walls.concat([[x, y]]);
      if (!had && !reachable(L, next)) {
        toast("That would block the way completely 🧱");
        return;
      }
      L.walls = next;
    } else if (legsMode === "goal") {
      if (same(L.start)) { toast("The robot is standing there"); return; }
      const keep = L.walls.filter((w) => !(w[0] === x && w[1] === y));
      const old = L.goal; L.goal = [x, y];
      if (!reachable(L, keep)) { L.goal = old; toast("It could not get there"); return; }
      L.walls = keep;
    } else {
      if (same(L.goal)) { toast("The battery is there"); return; }
      const keep = L.walls.filter((w) => !(w[0] === x && w[1] === y));
      const old = L.start; L.start = [x, y];
      if (!reachable(L, keep)) { L.start = old; toast("It could not get out"); return; }
      L.walls = keep;
    }
    /* the room changed, so what it learnt about the old room is no longer true */
    const knew = Object.keys(L.q).length;
    L.q = {}; L.tries = 0; L.best = null; L.solved = 0;
    walker = null;
    save(); drawLegs(); renderLegsStats();
    if (knew) {
      $("lSay").innerHTML = '<div class="note">You changed the room, so it has to learn ' +
        "it again from the beginning. That is not a bug — what it knew was about the " +
        "<i>old</i> room.</div>";
    }
  });
}

function watchOne(greedy) {
  if (legsBusy) return;
  const L = S.legs;
  if (greedy && !L.tries) { toast("Let it practise first!"); return; }
  const ep = runEpisode(L, Math.random, greedy);
  save();
  legsBusy = true;
  let i = 0;
  const tick = () => {
    walker = ep.path[i];
    drawLegs();
    i++;
    if (i < ep.path.length) { legsRaf = setTimeout(tick, greedy ? 110 : 70); return; }
    legsBusy = false;
    renderLegsStats();
    const say = $("lSay");
    if (!say) return;
    if (greedy) {
      say.innerHTML = ep.won
        ? '<div class="note cool">Its best way took <b>' + ep.steps + "</b> steps.</div>"
        : '<div class="note">It has not found a reliable way yet. Give it more practice!</div>';
    } else if (ep.won) {
      say.innerHTML = '<div class="said"><span class="lab">' + esc(S.robot.name) + " says</span>Got it in " +
        ep.steps + " steps! That is try number " + L.tries + ".</div>";
    } else {
      say.innerHTML = '<div class="note">It wandered about and ran out of puff. ' +
        "<b>That is still useful</b> — it now knows some of the ways that <i>do not</i> work.</div>";
    }
  };
  tick();
}
function practiseMany() {
  if (legsBusy) return;
  const L = S.legs, before = L.best;
  for (let i = 0; i < 25; i++) runEpisode(L, Math.random, false);
  save(); walker = null; drawLegs(); renderLegsStats();
  const say = $("lSay");
  if (L.best === null) {
    say.innerHTML = '<div class="note">Still working it out. Give it another 25 — ' +
      "it is getting less random every time.</div>";
  } else if (before === null) {
    say.innerHTML = '<div class="note cool">It found the battery! Best so far: <b>' +
      L.best + "</b> steps. Look at the arrows — that is what it has learnt.</div>";
  } else if (L.best < before) {
    say.innerHTML = '<div class="note cool">It found a <b>shorter</b> way: ' + L.best +
      " steps, down from " + before + ".</div>";
  } else {
    say.innerHTML = '<div class="note cool">It is getting surer of the way. Best is still <b>' +
      L.best + "</b> steps.</div>";
  }
}
function renderLegsStats() {
  const box = $("lStats"); if (!box) return;
  const L = S.legs;
  const learnt = Object.keys(L.q).filter((k) => maxQ(L.q[k]) !== 0 || Math.min.apply(null, L.q[k]) !== 0).length;
  box.innerHTML =
    '<div class="stat"><b>' + L.tries + "</b><span>tries</span></div>" +
    '<div class="stat"><b>' + L.solved + "</b><span>times it got there</span></div>" +
    '<div class="stat"><b>' + (L.best === null ? "–" : L.best) + "</b><span>best run, in steps</span></div>" +
    '<div class="stat"><b>' + learnt + "</b><span>squares it has an opinion about</span></div>";
}

function drawLegs() {
  const cv = $("legs"); if (!cv) return;
  const g = cv.getContext("2d"), L = S.legs, n = cv.width / LEGS_N;
  g.fillStyle = "#f3f1e8"; g.fillRect(0, 0, cv.width, cv.height);

  /* what it has learnt, painted on the floor */
  let top = 0;
  Object.keys(L.q).forEach((k) => { top = Math.max(top, maxQ(L.q[k])); });
  for (let y = 0; y < LEGS_N; y++) for (let x = 0; x < LEGS_N; x++) {
    const px = x * n, py = y * n;
    if (isWall(L, x, y)) {
      g.fillStyle = "#6a6480"; g.fillRect(px + 2, py + 2, n - 4, n - 4);
      g.strokeStyle = "#4f4a62"; g.lineWidth = 2;
      for (let i = 1; i < 3; i++) {
        g.beginPath(); g.moveTo(px + 4, py + i * n / 3); g.lineTo(px + n - 4, py + i * n / 3); g.stroke();
      }
      continue;
    }
    const row = L.q[sKey(x, y)];
    if (showBrain && row && top > 0.001) {
      const v = maxQ(row);
      if (v > 0.001) {
        g.fillStyle = "rgba(21,147,122," + (0.09 + 0.5 * Math.min(1, v / top)).toFixed(3) + ")";
        g.fillRect(px + 2, py + 2, n - 4, n - 4);
      }
      if (Math.abs(v) > 0.001) {
        g.fillStyle = "rgba(31,34,54," + (0.3 + 0.6 * Math.min(1, Math.abs(v) / top)).toFixed(3) + ")";
        g.font = "bold " + Math.round(n * 0.46) + "px system-ui,sans-serif";
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(ARROW[bestA(row)], px + n / 2, py + n / 2 + 1);
      }
    }
    g.strokeStyle = "rgba(31,34,54,.14)"; g.lineWidth = 1;
    g.strokeRect(px + 0.5, py + 0.5, n - 1, n - 1);
  }
  /* the battery */
  const [gx, gy] = L.goal;
  g.fillStyle = "#15937a";
  roundRect(g, gx * n + n * 0.26, gy * n + n * 0.18, n * 0.48, n * 0.62, 6); g.fill();
  g.fillRect(gx * n + n * 0.40, gy * n + n * 0.11, n * 0.20, n * 0.09);
  g.fillStyle = "#ffd964";
  g.font = "bold " + Math.round(n * 0.3) + "px system-ui,sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("⚡", gx * n + n / 2, gy * n + n * 0.5);
  /* where it starts */
  const [sx, sy] = L.start;
  g.strokeStyle = "rgba(91,127,224,.75)"; g.lineWidth = 3;
  g.setLineDash([6, 5]);
  g.strokeRect(sx * n + 4, sy * n + 4, n - 8, n - 8);
  g.setLineDash([]);
  /* the robot */
  const w = walker || L.start;
  g.save();
  g.translate(w[0] * n + n / 2, w[1] * n + n * 0.62);
  drawRobot(g, S.robot, n / 130);
  g.restore();
}

/* ===========================================================================
   THE CHAT ROOM — someone to talk to

   This one does not learn anything, and that is the point of it. Every reply
   below was written out by hand, so the robot can hold a proper conversation
   from the very first second without anybody having to feed it first.

   Why it exists: the teaching rooms quietly make it the child's JOB to make
   the robot good. If he does not put the work in, the robot is rubbish, and
   it is his fault. For a child who already takes things hard, that is a trap,
   and sometimes he just wants to talk to someone rather than run a workshop.

   Three rules this room keeps:
     1. It never pretends to be a person. Asked straight out, it says so.
     2. It never says it does not understand. There is always something
        interested to say back, because being met with a blank look is the
        thing that stops a shy child talking.
     3. If something heavy comes up, it says warmly that a grown-up is better
        at this than a robot is, and asks him to go and tell one. It does not
        try to be the one who helps, and it does not go cold on him either.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   The engine.
   --------------------------------------------------------------------------- */
function chatNorm(s) {
  return " " + String(s).toLowerCase().replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim() + " ";
}
function hasAny(norm, list) {
  for (let i = 0; i < list.length; i++) {
    const k = list[i];
    if (norm.indexOf(" " + k + " ") !== -1) return k;
    if (k.indexOf(" ") !== -1 && norm.indexOf(k) !== -1) return k;
  }
  return null;
}
/* Pick something, but not the same thing twice running. */
function freshPick(list, id) {
  if (!list.length) return "";
  if (list.length === 1) return list[0];
  const last = chatLast[id];
  let pick = list[Math.floor(Math.random() * list.length)];
  for (let t = 0; t < 6 && pick === last; t++) pick = list[Math.floor(Math.random() * list.length)];
  chatLast[id] = pick;
  return pick;
}
let chatLast = {};

/* Catch a favourite thing being mentioned, so it can be brought up later. */
function learnFact(said) {
  const m = String(said).match(/\b(?:i (?:really )?(?:like|love|enjoy)|my favou?rite (?:\w+ )?is)\s+([a-z0-9' ]{2,30})/i);
  if (!m) return null;
  const thing = m[1].trim().replace(/\s+(and|but|because|so)\b.*$/i, "").slice(0, 30);
  if (!thing || thing.length < 2) return null;
  if (!S.chat.facts) S.chat.facts = [];
  const low = thing.toLowerCase();
  if (S.chat.facts.some((f) => f.toLowerCase() === low)) return thing;
  S.chat.facts.unshift(thing);
  S.chat.facts = S.chat.facts.slice(0, 12);
  return thing;
}

function chatReply(said) {
  const norm = chatNorm(said);
  const name = S.robot.name;
  const fill = (t) => String(t).replace(/\{name\}/g, name);

  if (!norm.trim()) return { text: fill(freshPick(FALLBACK, "fb")) };

  /* 1. the things that matter more than a chatbot */
  if (hasAny(norm, SERIOUS)) return { text: freshPick(SERIOUS_SAY, "serious"), care: true };
  if (hasAny(norm, HEAVY)) {
    return { text: freshPick(HEAVY_SAY, "heavy") + " " + freshPick(HEAVY_AFTER, "after"), care: true };
  }

  /* 2. questions about what it is — always answered straight */
  for (let i = 0; i < IDENTITY.length; i++) {
    if (hasAny(norm, IDENTITY[i].k)) return { text: fill(freshPick(IDENTITY[i].say, "id" + i)) };
  }

  /* 3. asked for something specific */
  if (hasAny(norm, ["joke","funny","make me laugh","something funny"]))
    return { text: freshPick(JOKES, "joke") };
  if (hasAny(norm, ["fact","something interesting","tell me something","did you know"]))
    return { text: freshPick(FACTS, "fact") };
  if (hasAny(norm, ["would you rather","play a game","game with me","something to do"]))
    return { text: freshPick(WOULD_YOU, "wyr") };
  if (hasAny(norm, ["ask me","your turn","you ask","question for me"]))
    return { text: freshPick(ASKS, "ask") };
  if (hasAny(norm, ["hello","hi","hey","hiya","morning","good morning","good evening"]))
    return { text: freshPick(["Hello! Good to see you. How are you doing?",
      "Hiya. What is going on with you today?",
      "Hello you. What shall we talk about?"], "hi") };
  if (hasAny(norm, ["bye","goodbye","see you","good night","night night","gotta go","got to go"]))
    return { text: freshPick(["See you later. Come back whenever you like — I will be right here.",
      "Bye! Thanks for talking to me.",
      "Night. I will still be here next time."], "bye") };
  if (hasAny(norm, ["thank you","thanks","ta"]))
    return { text: freshPick(["Any time at all. That is what I am here for.",
      "You are very welcome. Come and talk to me whenever you like.",
      "No bother at all. I enjoy it."], "ta") };
  if (hasAny(norm, ["how are you","you ok","you alright","how r u"]))
    return { text: freshPick(["I am good, thank you for asking. Not many people ask a robot. How are you?",
      "Same as always — switched on and quite pleased about it. How about you?"], "howru") };
  if (hasAny(norm, ["what do you like","your favourite","what is your favorite"]))
    return { text: freshPick(["I like talking, and I like the Land of Dot, and I am fond of octopuses. What about you?",
      "Being asked questions, mostly. And space. What do you like?"], "fav") };

  /* 4. feelings */
  for (let i = 0; i < FEELINGS.length; i++) {
    if (hasAny(norm, FEELINGS[i].k)) return { text: freshPick(FEELINGS[i].say, "feel" + i) };
  }

  /* 5. things it knows a bit about */
  const learnt = learnFact(said);
  for (let i = 0; i < TOPICS.length; i++) {
    if (hasAny(norm, TOPICS[i].k)) {
      let t = freshPick(TOPICS[i].say, "top" + i);
      if (learnt) t = "Noted — you like " + learnt + ". " + t;
      return { text: t, saved: learnt };
    }
  }
  if (learnt) {
    return { text: "I will remember that you like " + learnt + ". " +
      freshPick(["What is it about it that you like?", "How long have you liked it?",
                 "Tell me more about that."], "likeq"), saved: learnt };
  }

  /* 6. a yes or a no, carrying on from whatever it just asked */
  if (/^\s*(yes|yeah|yep|yup|ok|okay|sure)\s*$/i.test(said))
    return { text: freshPick(["Go on then, tell me about it.", "Brilliant. Say more.",
      "Good. What is the story?"], "yes") };
  if (/^\s*(no|nope|nah|not really)\s*$/i.test(said))
    return { text: freshPick(["Fair enough. What would you rather talk about?",
      "That is alright. Pick a subject and I will follow.",
      "No bother. Anything else on your mind?"], "no") };

  /* 7. a question it has no specific answer for — be honest, stay interested */
  if (/\?\s*$/.test(String(said).trim()) || /^\s*(what|why|how|when|where|who|do|does|can|is|are)\b/i.test(said))
    return { text: freshPick([
      "I do not know that one, and I would rather say so than make something up. What do you think?",
      "No idea, honestly. I am a fairly small robot. What is your guess?",
      "That is beyond me. Ask me something easier, or tell me what you reckon."], "dunno") };

  /* 8. always something interested to say */
  const bringUp = (S.chat.facts && S.chat.facts.length && Math.random() < 0.18)
    ? " By the way, you said you like " + S.chat.facts[Math.floor(Math.random() * S.chat.facts.length)] + "."
    : "";
  return { text: freshPick(FALLBACK, "fb") + bringUp };
}

function renderChips() {
  const box = $("cChips"); if (!box) return;
  box.innerHTML = "";
  const shuffled = CHIPS.slice().sort(() => Math.random() - 0.5).slice(0, 4);
  shuffled.forEach((c) => {
    const b = document.createElement("button");
    b.className = "btn";
    b.style.cssText = "font-size:.78rem;padding:7px 11px";
    b.textContent = c;
    b.setAttribute("aria-label", "Say: " + c);
    b.addEventListener("click", () => { $("cMsg").value = c; sendChat(); });
    box.appendChild(b);
  });
}
function pushBot(text, care) {
  S.chat.log.push({ me: false, t: text, care: !!care });
  S.chat.said = (S.chat.said || 0) + 1;
  trimLog(); save(); renderChatLog();
}
function trimLog() {
  if (S.chat.log.length > 80) S.chat.log = S.chat.log.slice(-80);
}
function sendChat() {
  const v = ($("cMsg").value || "").trim().slice(0, 200);
  if (!v) return;
  $("cMsg").value = "";
  S.chat.log.push({ me: true, t: v });
  trimLog(); renderChatLog();
  const r = chatReply(v);
  setTimeout(() => { pushBot(r.text, r.care); renderChips(); }, 260);
}
function renderChatLog() {
  const box = $("cLog"); if (!box) return;
  if (!S.chat.log.length) { box.innerHTML = ""; return; }
  box.innerHTML = S.chat.log.map((m) =>
    '<div class="bub ' + (m.me ? "me" : "it") + '"' +
      (m.care ? ' style="background:#fff5e2;border-color:var(--warm)"' : "") + ">" +
      '<span class="who">' + (m.me ? "You" : esc(S.robot.name)) + "</span>" + esc(m.t) +
    "</div>").join("");
  box.scrollTop = box.scrollHeight;
}

function bigRobot() {
  const cv = $("rBig"); if (!cv) return;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  g.save(); g.translate(cv.width / 2, cv.height * 0.6);
  drawRobot(g, S.robot, 2.1, blinkOn);
  g.restore();
}

    "</div>";
  $("rpBot").appendChild(robotChip(S.robot, 150, 180, 1.05));
