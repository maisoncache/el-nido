<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ezra's Brain Quest: Planet Flag Academy</title>
  <style>
    :root {
      --ink: #1f2a3d;
      --bg: #eef5ff;
      --card: #ffffff;
      --accent: #5a4bff;
      --accent2: #ff5aa0;
      --ok: #12a150;
      --bad: #cc3344;
      --gold: #f5b400;
      --silver: #9aa3b2;
      --bronze: #cd7f32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #d9e9ff, var(--bg));
      color: var(--ink);
      padding: 14px;
      display: grid;
      place-items: center;
    }
    .quiz {
      width: min(820px, 100%);
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(20, 40, 80, 0.15);
      padding: clamp(16px, 4vw, 28px);
    }
    h1 { margin: 0; font-size: clamp(1.5rem, 4.5vw, 2.2rem); }
    h2 { margin: 0 0 8px; font-size: clamp(1.2rem, 3.6vw, 1.6rem); }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .pill {
      background: #edf2ff;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 16px;
    }
    .tile {
      background: linear-gradient(140deg, #f8faff, #eef2ff);
      border: 2px solid #d7def8;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 110px;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }
    .tile:hover { border-color: #9db2ff; transform: translateY(-2px); }
    .tile .emoji { font-size: 2rem; }
    .tile .title { font-weight: bold; font-size: 1.15rem; }
    .tile .meta { font-size: 0.85rem; color: #4a5572; }
    .tile.locked { opacity: 0.55; cursor: not-allowed; }
    .tile.locked:hover { transform: none; border-color: #d7def8; }
    .badge-mark { font-size: 1.2rem; }

    .question {
      margin-top: 18px;
      font-size: clamp(1.1rem, 3.3vw, 1.45rem);
      line-height: 1.35;
      min-height: 60px;
    }
    .answers { display: grid; gap: 10px; margin-top: 14px; }
    button {
      border: 2px solid #d7def8;
      background: #f8faff;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 50px;
      text-align: left;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { border-color: #9db2ff; }
    button:disabled { cursor: default; }
    .controls { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .primary { background: var(--accent); color: white; border-color: var(--accent); }
    .primary:hover { background: #4a3de0; border-color: #4a3de0; }
    .secondary { background: #fff; }
    .hint-btn { background: #fff5e0; border-color: #f5b400; color: #6b4f00; }
    .status { min-height: 24px; margin-top: 10px; font-weight: bold; font-size: 1rem; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .hint-text {
      background: #fff5e0;
      border-left: 4px solid #f5b400;
      padding: 10px 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-weight: bold;
      color: #6b4f00;
    }
    .hidden { display: none !important; }
    .back-link {
      display: inline-block;
      margin-top: 14px;
      color: #264fd8;
      text-decoration: none;
      font-weight: bold;
    }
    .back-link:hover { text-decoration: underline; }
    .end-badge {
      font-size: 4rem;
      text-align: center;
      margin: 8px 0;
    }
    .end-score {
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .answer-correct { border-color: var(--ok) !important; background: #e6f7ec !important; }
    .answer-wrong { border-color: var(--bad) !important; background: #fde8eb !important; }
    .progress-bar {
      height: 8px;
      background: #e3e9f7;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 0.3s ease;
    }
    .muted { color: #6a7390; font-size: 0.9rem; }
    .sound-toggle {
      background: transparent;
      border: 2px solid #d7def8;
      padding: 6px 10px;
      min-height: 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="quiz">
    <div class="top">
      <h1 id="title">🧠 Brain Quest</h1>
      <div class="row">
        <div class="pill" id="score">Score: 0</div>
        <button class="sound-toggle" id="soundToggle" type="button">🔊 Sound</button>
      </div>
    </div>
    <div id="subtitle" class="muted" style="margin-top: 6px;">Pick a world to explore!</div>

    <!-- HOME (category select) -->
    <section id="home">
      <div class="grid" id="categoryGrid"></div>
      <div class="grid" id="unlockGrid" style="margin-top: 14px;"></div>
      <a class="back-link" href="index.html">← Back to Game Hub</a>
    </section>

    <!-- LEVEL SELECT -->
    <section id="levelSelect" class="hidden">
      <h2 id="levelHeading"></h2>
      <div class="grid" id="levelGrid"></div>
      <button class="secondary" id="backToHome" type="button" style="margin-top: 14px;">← Back to Worlds</button>
    </section>

    <!-- QUIZ -->
    <section id="quizPanel" class="hidden">
      <div class="row" style="justify-content: space-between;">
        <div class="pill" id="categoryPill"></div>
        <div class="pill" id="progress">Question 1 / 5</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p class="question" id="question"></p>
      <section class="answers" id="answers"></section>
      <div id="hintBox" class="hint-text hidden"></div>
      <p id="status" class="status" aria-live="polite"></p>
      <div class="controls">
        <button id="hintBtn" class="hint-btn" type="button">💡 Hint</button>
        <button id="nextBtn" class="primary hidden" type="button">Next Question</button>
        <button id="quitBtn" class="secondary" type="button">Quit Level</button>
      </div>
    </section>

    <!-- LEVEL COMPLETE -->
    <section id="endPanel" class="hidden">
      <h2 id="endTitle">Level Complete!</h2>
      <div class="end-badge" id="endBadge">🥇</div>
      <div class="end-score" id="endScore">You scored 0 points</div>
      <div id="endMessage" class="muted" style="text-align: center;"></div>
      <div class="controls" style="justify-content: center;">
        <button id="replayBtn" class="secondary" type="button">🔁 Replay Level</button>
        <button id="nextLevelBtn" class="primary hidden" type="button">➡️ Next Level</button>
        <button id="homeBtn" class="secondary" type="button">🏠 Choose World</button>
      </div>
    </section>
  </main>

    const STORAGE_KEY = "ezraBrainQuestProgress_v1";
    const progress = loadProgress();
    let soundOn = progress.soundOn !== false;

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { badges: {}, soundOn: true };
    }
    function saveProgress() {
      progress.soundOn = soundOn;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
    }
    function badgeKey(catId, levelIdx) { return `${catId}-${levelIdx}`; }
    function getBadge(catId, levelIdx) { return progress.badges[badgeKey(catId, levelIdx)] || null; }
    function setBadge(catId, levelIdx, badge) {
      const key = badgeKey(catId, levelIdx);
      const existing = progress.badges[key];
      const order = { bronze: 1, silver: 2, gold: 3 };
      if (!existing || order[badge] > order[existing]) {
        progress.badges[key] = badge;
        saveProgress();
      }
    }
    function badgeEmoji(b) {
      if (b === "gold") return "🥇";
      if (b === "silver") return "🥈";
      if (b === "bronze") return "🥉";
      return "";
    }
    function isPrincipalUnlocked() {

    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
      }
      return audioCtx;
    }
    function tone(freq, dur, type, vol, delay) {
      if (!soundOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      const start = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(vol || 0.15, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.05);
    }

    function renderQuestion() {
      const item = currentQs[currentIdx];
      hintUsedThis = false;
      locked = false;
      progressEl.textContent = `Question ${currentIdx + 1} / ${currentQs.length}`;
      progressFill.style.width = `${(currentIdx / currentQs.length) * 100}%`;

      statusEl.textContent = "";
      statusEl.className = "status";
      hintBox.classList.add("hidden");
      hintBox.textContent = "";
      hintBtn.disabled = false;
      hintBtn.classList.remove("hidden");
      nextBtn.classList.add("hidden");
      item.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.addEventListener("click", () => submitAnswer(idx, btn));
        answersEl.appendChild(btn);
      });
    }

    function submitAnswer(idx, btn) {
      if (locked) return;
      locked = true;
      const item = currentQs[currentIdx];
      const correct = item.answer;
      const buttons = answersEl.querySelectorAll("button");
      buttons.forEach((b, i) => {
        b.disabled = true;
        if (i === correct) b.classList.add("answer-correct");
        else if (i === idx) b.classList.add("answer-wrong");
      });
      hintBtn.disabled = true;
      if (idx === correct) {
        const earned = hintUsedThis ? 5 : 10;
        totalScore += earned;
        correctCount += 1;
        statusEl.textContent = `✅ Correct! +${earned} points`;
        statusEl.classList.add("ok");
        sfx.correct();
      } else {
        statusEl.textContent = `❌ Not quite. The answer is "${item.choices[correct]}".`;
        statusEl.classList.add("bad");
        sfx.wrong();
      }
      scoreEl.textContent = `Score: ${totalScore}`;
      progressFill.style.width = `${((currentIdx + 1) / currentQs.length) * 100}%`;
      nextBtn.textContent = currentIdx === currentQs.length - 1 ? "See Results 🎉" : "Next Question ➡️";
      nextBtn.classList.remove("hidden");
    }

      if (hintUsedThis || locked) return;

      hintBtn.disabled = true;
      sfx.hint();

      const bonus = 20;
      totalScore += bonus;
      const totalQs = currentQs.length;

      if (correctCount === totalQs) badge = "gold";

        if (badge) setBadge(currentSet.catId, currentSet.levelIdx, badge);
      } else if (badge) {
        const key = currentSet.which + "-0";
        const order = { bronze: 1, silver: 2, gold: 3 };
        const existing = progress.badges[key];
        if (!existing || order[badge] > order[existing]) {
          progress.badges[key] = badge;
          saveProgress();
        }
      }

      showOnly(endPanel);
      sfx.fanfare();
      if (badge) setTimeout(() => sfx.sparkle(), 400);
      endTitle.textContent = badge === "gold" ? "🌟 Perfect Run!" : "Level Complete!";
      endBadge.textContent = badge ? badgeEmoji(badge) : "🎯";
      endScore.textContent = `You scored ${totalScore} points (${correctCount}/${totalQs} correct + ${bonus} bonus)`;
      endMessage.textContent = badge === "gold"
        ? "Gold Badge earned — incredible work!"
        : badge === "silver"
          ? "Silver Badge earned — great effort!"
          : badge === "bronze"
            ? "Bronze Badge earned — keep practising!"
            : "Give it another try!";

      const isCat = currentSet.kind === "category";
      const hasNext = isCat && currentSet.levelIdx < 3;
      nextLevelBtn.classList.toggle("hidden", !hasNext);

      if (!isCat || currentSet.levelIdx >= 2) {
        if (isPrincipalUnlocked() && !progress._notifiedPrincipal) {
          progress._notifiedPrincipal = true;
          saveProgress();
          endMessage.textContent += " · 🎓 Principal Brain Challenge unlocked!";
        }
        if (isChampionUnlocked() && !progress._notifiedChampion) {
          progress._notifiedChampion = true;
          saveProgress();
          endMessage.textContent += " · 🏆 World Champion Quiz unlocked!";
        }
      }
    }

    function replayLevel() {
      sfx.tap();
      startLevel(currentSet);
    }
    function nextLevel() {
      sfx.tap();
      if (currentSet.kind === "category" && currentSet.levelIdx < 3) {
        startLevel({ kind: "category", catId: currentSet.catId, levelIdx: currentSet.levelIdx + 1 });
      } else {
        goHome();
      }
    }
    function quitLevel() {
      if (confirm("Quit this level? Your progress on this attempt will not be saved.")) {
        sfx.tap();
        goHome();
      }
    }

    // ============ EVENTS ============
    hintBtn.addEventListener("click", useHint);
    nextBtn.addEventListener("click", nextQuestion);
    quitBtn.addEventListener("click", quitLevel);
    replayBtn.addEventListener("click", replayLevel);
    nextLevelBtn.addEventListener("click", nextLevel);
    homeBtn.addEventListener("click", () => { sfx.tap(); goHome(); });
    backToHomeBtn.addEventListener("click", () => { sfx.tap(); goHome(); });
    soundToggleBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      soundToggleBtn.textContent = soundOn ? "🔊 Sound" : "🔇 Muted";
      saveProgress();
      if (soundOn) sfx.tap();
    });
    soundToggleBtn.textContent = soundOn ? "🔊 Sound" : "🔇 Muted";

    goHome();
  </script>
</body>
</html>
