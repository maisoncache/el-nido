<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPS Jumper — Prep Level</title>
  <style>
    :root {
      --sky: #8ed0ff;
      --sky2: #cdeeff;
      --ground: #7dcf7d;
      --court: #6f7f93;
      --court-line: #dfe9f6;
      --ui: #1c2a3a;
      --card: rgba(255, 255, 255, 0.9);
      --accent: #ffcc33;
      --danger: #ff5f6d;
      --ok: #41c17d;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(var(--sky), var(--sky2));
      overflow: hidden;
      touch-action: manipulation;
    }

    #gameWrap {
      position: relative;
      width: min(100vw, 1100px);
      height: min(100vh, 680px);
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      background: linear-gradient(var(--sky), var(--sky2));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud {
      position: absolute;
      inset: 12px 12px auto 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 5;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--card);
      color: var(--ui);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: clamp(13px, 1.8vw, 18px);
      border: 2px solid rgba(28, 42, 58, 0.1);
    }

    .progress {
      flex: 1;
      min-width: 160px;
      height: 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      overflow: hidden;
      border: 2px solid rgba(28, 42, 58, 0.1);
    }

    .progressBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #50d890, #35a7ff);
      transition: width 120ms linear;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 10;
      background: rgba(16, 26, 38, 0.35);
      padding: 20px;
    }

    .card {
      width: min(92%, 560px);
      background: var(--card);
      border-radius: 20px;
      padding: clamp(16px, 3vw, 28px);
      text-align: center;
      color: var(--ui);
      border: 3px solid rgba(28, 42, 58, 0.1);
    }

    h1, h2, p { margin: 8px 0; }
    h1 { font-size: clamp(28px, 5vw, 46px); }
    h2 { font-size: clamp(22px, 4vw, 34px); }
    p { font-size: clamp(14px, 2.2vw, 20px); }

    button {
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: bold;
      color: white;
      background: #2f6df3;
      cursor: pointer;
    }

    .small { opacity: 0.85; font-size: clamp(12px, 1.7vw, 16px); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="pill" id="scoreText">Score: 0</div>
      <div class="pill">Prep Level — Top Court</div>
      <div class="progress"><div class="progressBar" id="progressBar"></div></div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card" id="overlayCard"></div>
    </div>
  </div>

  <script>
    // KPS Jumper (single-file beginner version)
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayCard = document.getElementById('overlayCard');
    const scoreText = document.getElementById('scoreText');
    const progressBar = document.getElementById('progressBar');

    const obstacleTypes = [
      { emoji: '🎒', name: 'School Bag', w: 42, h: 42 },
      { emoji: '🧴', name: 'Drink Bottle', w: 28, h: 50 },
      { emoji: '⚽', name: 'Soccer Ball', w: 38, h: 38 },
      { emoji: '🚧', name: 'Cone', w: 34, h: 40 },
      { emoji: '💧', name: 'Puddle', w: 56, h: 20 },
      { emoji: '🍱', name: 'Lunchbox', w: 46, h: 30 }
    ];

    const game = {
      state: 'title', // title, playing, gameover, complete
      w: 0, h: 0,
      groundY: 0,
      speed: 280,
      gravity: 1700,
      jumpPower: 680,
      distance: 0,
      levelDistance: 2800,
      score: 0,
      lastTime: 0,
      obstacleTimer: 0,
      obstacleGap: [0.9, 1.6],
      obstacles: [],
      messageTimer: 0,
      message: '',
      player: { x: 130, y: 0, vy: 0, w: 52, h: 72, onGround: true }
    };

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      game.w = canvas.clientWidth;
      game.h = canvas.clientHeight;
      game.groundY = game.h * 0.78;
      if (game.player.y === 0 || game.player.onGround) {
        game.player.y = game.groundY - game.player.h;
      }
    }

    function setOverlay(html) {
      overlay.classList.remove('hidden');
      overlayCard.innerHTML = html;
    }

    function hideOverlay() { overlay.classList.add('hidden'); }

    function startGame() {
      game.state = 'playing';
      game.distance = 0;
      game.score = 0;
      game.obstacles = [];
      game.obstacleTimer = 0.8;
      game.player.vy = 0;
      game.player.onGround = true;
      game.player.y = game.groundY - game.player.h;
      game.message = '';
      game.messageTimer = 0;
      hideOverlay();
      beep(680, 0.06, 'square');
    }

    function showTitle() {
      game.state = 'title';
      setOverlay(`
        <h1>🏃 KPS Jumper</h1>
        <p><b>Prep Level — Top Court</b></p>
        <p>Tap, click, or press <b>Space</b> to jump!</p>
        <p class="small">Run to <b>The Silver Slide</b> and avoid school obstacles.</p>
        <button onclick="startGame()">Start Game</button>
      `);
    }

    function gameOver() {
      game.state = 'gameover';
      setOverlay(`
        <h2 style="color:var(--danger)">Game Over</h2>
        <p>You hit an obstacle.</p>
        <p><b>Score:</b> ${Math.floor(game.score)}</p>
        <button onclick="startGame()">Restart</button>
      `);
      beep(180, 0.18, 'sawtooth');
    }

    function levelComplete() {
      game.state = 'complete';
      setOverlay(`
        <h2 style="color:var(--ok)">Level Complete! 🎉</h2>
        <p>You reached <b>The Silver Slide</b>!</p>
        <p><b>Score:</b> ${Math.floor(game.score)}</p>
        <button onclick="startGame()">Play Again</button>
      `);
      beep(520, 0.09, 'triangle');
      setTimeout(() => beep(700, 0.09, 'triangle'), 120);
    }

    function jump() {
      if (game.state === 'title') return startGame();
      if (game.state !== 'playing') return;
      if (game.player.onGround) {
        game.player.vy = -game.jumpPower;
        game.player.onGround = false;
        beep(420, 0.06, 'triangle');
      }
    }

    function spawnObstacle() {
      const t = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
      const y = game.groundY - t.h;
      game.obstacles.push({ x: game.w + 20, y, ...t });
      game.message = t.name + '!';
      game.messageTimer = 0.9;
    }

    function update(dt) {
      if (game.state !== 'playing') return;

      game.distance += game.speed * dt;
      game.score += 10 * dt;

      game.player.vy += game.gravity * dt;
      game.player.y += game.player.vy * dt;
      const floorY = game.groundY - game.player.h;
      if (game.player.y >= floorY) {
        game.player.y = floorY;
        game.player.vy = 0;
        game.player.onGround = true;
      }

      game.obstacleTimer -= dt;
      if (game.obstacleTimer <= 0) {
        spawnObstacle();
        const [min, max] = game.obstacleGap;
        game.obstacleTimer = min + Math.random() * (max - min);
      }

      for (const o of game.obstacles) o.x -= game.speed * dt;
      game.obstacles = game.obstacles.filter(o => o.x + o.w > -40);

      const p = game.player;
      const px = p.x + 8, py = p.y + 8, pw = p.w - 16, ph = p.h - 8;
      for (const o of game.obstacles) {
        const hit = px < o.x + o.w && px + pw > o.x && py < o.y + o.h && py + ph > o.y;
        if (hit) return gameOver();
      }

      if (game.messageTimer > 0) game.messageTimer -= dt;

      if (game.distance >= game.levelDistance) levelComplete();
    }

    function drawBackground() {
      ctx.fillStyle = '#8ed0ff';
      ctx.fillRect(0, 0, game.w, game.h);

      // Distant oval hill
      ctx.fillStyle = '#91d98e';
      ctx.beginPath();
      ctx.ellipse(game.w * 0.7, game.h * 0.58, game.w * 0.34, game.h * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Court ground
      ctx.fillStyle = '#71859c';
      ctx.fillRect(0, game.groundY, game.w, game.h - game.groundY);

      // Court lines
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, game.groundY + 22);
      ctx.lineTo(game.w, game.groundY + 22);
      ctx.moveTo(game.w * 0.16, game.groundY);
      ctx.lineTo(game.w * 0.16, game.h);
      ctx.moveTo(game.w * 0.84, game.groundY);
      ctx.lineTo(game.w * 0.84, game.h);
      ctx.stroke();
    }

    function drawPlayer() {
      const p = game.player;
      // Kid made of simple shapes + emoji backpack
      ctx.fillStyle = '#ffc98f';
      ctx.beginPath(); ctx.arc(p.x + 28, p.y + 12, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#224b8f';
      ctx.fillRect(p.x + 16, p.y + 24, 24, 24);
      ctx.fillStyle = '#2e2e2e';
      ctx.fillRect(p.x + 18, p.y + 48, 8, 20);
      ctx.fillRect(p.x + 30, p.y + 48, 8, 20);
      ctx.fillStyle = '#ffc98f';
      ctx.fillRect(p.x + 10, p.y + 26, 8, 20);
      ctx.fillRect(p.x + 40, p.y + 26, 8, 20);
      ctx.font = '18px sans-serif';
      ctx.fillText('🎒', p.x + 2, p.y + 42);
    }

    function drawObstacle(o) {
      ctx.font = `${Math.max(26, o.h)}px sans-serif`;
      ctx.fillText(o.emoji, o.x, o.y + o.h);
    }

    function drawFinishLine() {
      const progress = Math.min(game.distance / game.levelDistance, 1);
      const lineX = game.w - 80 + (1 - progress) * 260;
      ctx.fillStyle = '#d9d9d9';
      ctx.fillRect(lineX, game.groundY - 110, 10, 110);
      ctx.fillStyle = '#a5a5a5';
      ctx.fillRect(lineX + 10, game.groundY - 80, 42, 12);
      ctx.fillRect(lineX + 10, game.groundY - 48, 42, 12);
      ctx.font = 'bold 14px Trebuchet MS';
      ctx.fillStyle = '#334';
      ctx.fillText('Silver Slide', lineX - 22, game.groundY - 118);
    }

    function drawUI() {
      scoreText.textContent = 'Score: ' + Math.floor(game.score);
      const pct = Math.min(100, (game.distance / game.levelDistance) * 100);
      progressBar.style.width = pct + '%';

      if (game.messageTimer > 0) {
        ctx.font = 'bold 26px Trebuchet MS';
        ctx.fillStyle = '#16314f';
        ctx.fillText(game.message, game.w * 0.5 - 70, 84);
      }
    }

    function loop(ts) {
      if (!game.lastTime) game.lastTime = ts;
      const dt = Math.min((ts - game.lastTime) / 1000, 0.033);
      game.lastTime = ts;

      update(dt);
      drawBackground();
      drawFinishLine();
      for (const o of game.obstacles) drawObstacle(o);
      drawPlayer();
      drawUI();

      requestAnimationFrame(loop);
    }

    // Very tiny built-in sound helper (no external files)
    let audioCtx;
    function beep(freq, duration, type = 'sine') {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    // Controls: keyboard + click + tap
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('pointerdown', jump);

    window.addEventListener('resize', resize);
    resize();
    showTitle();
    requestAnimationFrame(loop);

    // Let overlay buttons call these functions
    window.startGame = startGame;
  </script>
</body>
</html>
