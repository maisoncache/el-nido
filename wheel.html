<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ezra's Spinning Wheel</title>
  <style>
    :root {
      --bg: #2a1055;
      --ink: #26203a;
      --accent: #ff9f1c;
      --accent-deep: #cc7000;
      --purple: #7d3fe0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, #4a1d86 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, #3b1470 0%, transparent 50%),
        var(--bg);
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(20, 0, 50, 0.5);
      padding: clamp(12px, 2.2vw, 18px);
      position: relative;
      z-index: 1;
    }
    .back-link {
      display: inline-block;
      color: var(--purple);
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 2px;
      font-size: 0.88rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 1.95rem);
      text-align: center;
      color: var(--purple);
    }
    .subtitle { text-align: center; opacity: 0.85; margin: 3px 0 10px; font-size: 0.87rem; }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn {
      font-size: 0.95rem;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 14px;
      border: 2px solid #d8c6f5;
      background: #f7f2ff;
      color: var(--ink);
    }
    .tab-btn.active { background: var(--purple); border-color: var(--purple); color: white; }
    .pill-btn {
      background: #f7f2ff;
      border: 2px solid #d8c6f5;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 0.82rem;
      transition: transform 0.1s;
    }
    .pill-btn:active { transform: scale(0.94); }

    .cats { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
    .cat {
      border: 2px solid #d8c6f5;
      background: #f7f2ff;
      border-radius: 999px;
      padding: 6px 13px;
      font-weight: bold;
      font-size: 0.84rem;
    }
    .cat.active { background: #ffe7c2; border-color: var(--accent); }

    .wheel-wrap {
      position: relative;
      width: min(100%, 380px);
      margin: 0 auto;
    }
    #wheel { display: block; width: 100%; height: auto; }
    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-top: 30px solid #e0322f;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
      z-index: 3;
      pointer-events: none;
    }
    .spin-btn {
      display: block;
      width: min(100%, 380px);
      margin: 10px auto 0;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(180deg, #ffb648, #ee8500);
      border: none;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 5px 0 #a85e00;
    }
    .spin-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #a85e00; }
    .spin-btn:disabled { background: #c3bcd2; box-shadow: 0 5px 0 #9b95a8; cursor: not-allowed; }

    .result {
      text-align: center;
      font-weight: bold;
      font-size: clamp(1rem, 3.4vw, 1.25rem);
      margin: 10px 0 0;
      min-height: 2.6em;
      /* deliberately not flex — flex items would swallow the spaces around <b> */
      display: block;
      line-height: 1.45;
      background: #fff7e6;
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 8px 12px;
      color: #7a4a00;
    }

    /* number mode */
    .guess-label { text-align: center; font-weight: bold; font-size: 0.9rem; margin: 10px 0 6px; }
    .guess-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .num-btn {
      width: 46px; height: 46px;
      border-radius: 12px;
      border: 3px solid #d8c6f5;
      background: white;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--ink);
      transition: transform 0.1s;
    }
    .num-btn.picked { background: var(--purple); border-color: var(--purple); color: white; transform: scale(1.1); }
    .num-btn.gone { opacity: 0.28; text-decoration: line-through; cursor: not-allowed; }
    .stat-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
    .stat {
      background: #eef7ee;
      border: 2px solid #bfe3c0;
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: bold;
      font-size: 0.84rem;
    }

    /* custom list */
    .custom-box { margin-top: 10px; background: #f7f2ff; border: 2px solid #d8c6f5; border-radius: 14px; padding: 10px; }
    .custom-box h3 { margin: 0 0 6px; font-size: 0.95rem; }
    .add-row { display: flex; gap: 6px; }
    #customInput {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 1rem;
      padding: 9px 11px;
      border-radius: 10px;
      border: 2px solid #d8c6f5;
    }
    #customInput:focus { outline: none; border-color: var(--purple); }
    .add-btn {
      border: none;
      background: var(--purple);
      color: white;
      font-weight: bold;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 0.9rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip {
      background: white;
      border: 2px solid #d8c6f5;
      border-radius: 999px;
      padding: 4px 8px 4px 12px;
      font-size: 0.82rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip button {
      border: none;
      background: #e0322f;
      color: white;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 0.7rem;
      line-height: 1;
      padding: 0;
    }
    .empty-note { font-size: 0.82rem; opacity: 0.75; margin-top: 6px; }

    .confetti-bit {
      position: fixed;
      top: -12px;
      font-size: 1.3rem;
      pointer-events: none;
      z-index: 101;
      animation: confFall linear forwards;
    }
    @keyframes confFall { to { transform: translateY(105vh) rotate(540deg); } }
  </style>
</head>
<body>
  <div class="page">
    <a class="back-link" href="index.html">← Back to Game Hub</a>
    <h1>🎡 Spinning Wheel</h1>
    <p class="subtitle" id="subtitle">Can't decide? Let the wheel choose for you!</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabPick">🎯 Pick For Me</button>
      <button class="tab-btn" id="tabNum">🔢 Number Hunt</button>
      <button class="pill-btn" id="soundBtn">🔊</button>
    </div>

    <!-- ===== PICK MODE ===== -->
    <section id="viewPick">
      <div class="cats" id="cats"></div>
    </section>

    <!-- ===== NUMBER MODE ===== -->
    <section id="viewNum" hidden>
      <div class="stat-row">
        <span class="stat" id="statGot">✅ Right 0</span>
        <span class="stat" id="statLeft">🔢 12 left</span>
        <span class="stat" id="statOdds">🎲 1 in 12</span>
        <span class="stat" id="statBest">🏆 Best 0</span>
        <button class="pill-btn" id="newRoundBtn">🔄 New Round</button>
      </div>
      <div class="guess-label" id="guessLabel">Pick the number you think it will land on!</div>
      <div class="guess-row" id="guessRow"></div>
    </section>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="380" height="380"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn">🎡 SPIN!</button>
    <p class="result" id="result">Give it a spin!</p>

    <div class="custom-box" id="customBox" hidden>
      <h3>✏️ Your own wheel</h3>
      <div class="add-row">
        <input id="customInput" maxlength="22" placeholder="Type something…" autocomplete="off" />
        <button class="add-btn" id="addBtn">Add</button>
      </div>
      <div class="chips" id="chips"></div>
      <p class="empty-note" id="customNote"></p>
    </div>
  </div>

  <script>
    "use strict";

    /* ================= Wheel data ================= */

    const CATEGORIES = [
      { id: "dinner", label: "🍕 Dinner", items: ["Pizza 🍕", "Pasta 🍝", "Tacos 🌮", "Sushi 🍣", "Burgers 🍔", "Curry 🍛", "Nuggets 🍗", "Sandwiches 🥪"] },
      { id: "do", label: "🎲 What to do", items: ["Draw 🎨", "Read 📚", "LEGO 🧱", "Go outside 🌳", "Video game 🎮", "Bake 🧁", "Dance 💃", "Build a fort 🏰"] },
      { id: "treat", label: "🍦 Treat", items: ["Ice cream 🍦", "Chocolate 🍫", "Biscuit 🍪", "Fruit 🍓", "Popcorn 🍿", "Jelly 🍮"] },
      { id: "animal", label: "🐾 Animal", items: ["Dog 🐶", "Cat 🐱", "Dragon 🐉", "Shark 🦈", "Penguin 🐧", "Tiger 🐯", "Frog 🐸", "Koala 🐨"] },
      { id: "chore", label: "🧹 Who does it?", items: ["Ezra 🙂", "Mum 💜", "Dad 💙", "Nobody! 🎉", "Everyone 👨‍👩‍👦", "Spin again 🔁"] },
      { id: "custom", label: "✏️ My own wheel", items: [] },
    ];

    const COLORS = ["#ff6b6b", "#ffa94d", "#ffd43b", "#8ce99a", "#63e6be", "#66d9e8", "#748ffc", "#b197fc", "#f783ac", "#ffc078", "#a9e34b", "#4dd4c8"];
    const SAVE_KEY = "wheel-game-save-v1";
    const RANGE = 12;

    /* ================= State ================= */

    let mode = "pick";
    let cat = 0;
    let custom = [];
    let segments = [];        // {label, color}
    let angle = 0;            // current rotation, radians
    let spinning = false;
    let soundOn = true;
    // number mode
    let numbers = [];
    let guess = null;
    let correct = 0, best = 0, played = 0;

    /* ================= Sound ================= */

    let actx = null;
    function audio() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      }
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function tone(freq, dur, type, vol, delay, slideTo) {
      if (!soundOn) return;
      const ctx = audio();
      if (!ctx) return;
      const t0 = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol || 0.1, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    const sTick = () => tone(1150, 0.03, "square", 0.05);
    const sClick = () => tone(600, 0.07, "square", 0.05);
    const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, "triangle", 0.13, i * 0.09));
    const sLand = () => [660, 880].forEach((f, i) => tone(f, 0.18, "triangle", 0.11, i * 0.08));
    const sMiss = () => tone(300, 0.28, "sawtooth", 0.08, 0, 170);
    const sNope = () => tone(180, 0.14, "square", 0.06);

    /* ================= Helpers ================= */

    const $ = (id) => document.getElementById(id);
    const cv = $("wheel");
    const ctx2d = cv.getContext("2d");

    function save() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ custom, best, soundOn })); } catch (e) {}
    }
    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        custom = Array.isArray(s.custom) ? s.custom.filter((x) => typeof x === "string").slice(0, 12) : [];
        best = Math.max(0, Math.floor(s.best || 0));
        soundOn = s.soundOn !== false;
      } catch (e) {}
    }

    /* ================= Building the wheel ================= */

    function buildSegments() {
      if (mode === "num") {
        segments = numbers.map((n, i) => ({ label: String(n), color: COLORS[(n - 1) % COLORS.length], value: n }));
      } else {
        const c = CATEGORIES[cat];
        const items = c.id === "custom" ? custom : c.items;
        segments = items.map((label, i) => ({ label, color: COLORS[i % COLORS.length], value: label }));
      }
      drawWheel();
      $("spinBtn").disabled = spinning || segments.length < 2 || (mode === "num" && guess === null);
    }

    function drawWheel() {
      const size = cv.width;
      const cx = size / 2, cy = size / 2, R = size / 2 - 8;
      const g = ctx2d;
      g.clearRect(0, 0, size, size);

      // outer ring
      g.save();
      g.beginPath();
      g.arc(cx, cy, R + 6, 0, Math.PI * 2);
      g.fillStyle = "#3a2a5c";
      g.fill();
      g.restore();

      const n = segments.length;
      if (n === 0) {
        g.fillStyle = "#e9e2f7";
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#6b6480";
        g.font = "bold 18px 'Trebuchet MS', sans-serif";
        g.textAlign = "center";
        const lines = mode === "num"
          ? ["All the numbers", "are gone! 🏆"]
          : ["Add some things", "to your wheel!"];
        g.fillText(lines[0], cx, cy - 6);
        g.fillText(lines[1], cx, cy + 18);
        return;
      }
      if (n === 1) {
        g.fillStyle = segments[0].color;
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
        drawLabel(g, cx, cy, R, angle, segments[0].label, 1);
      } else {
        const step = (Math.PI * 2) / n;
        for (let i = 0; i < n; i++) {
          const a0 = angle + i * step, a1 = a0 + step;
          g.beginPath();
          g.moveTo(cx, cy);
          g.arc(cx, cy, R, a0, a1);
          g.closePath();
          g.fillStyle = segments[i].color;
          g.fill();
          g.strokeStyle = "rgba(255,255,255,0.85)";
          g.lineWidth = 2;
          g.stroke();
        }
        for (let i = 0; i < n; i++) {
          drawLabel(g, cx, cy, R, angle + (i + 0.5) * step, segments[i].label, n);
        }
      }
      // hub
      g.beginPath();
      g.arc(cx, cy, 26, 0, Math.PI * 2);
      g.fillStyle = "#fff";
      g.fill();
      g.strokeStyle = "#3a2a5c";
      g.lineWidth = 5;
      g.stroke();
      g.font = "20px serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("🎡", cx, cy + 1);
    }

    function drawLabel(g, cx, cy, R, mid, text, n) {
      g.save();
      g.translate(cx, cy);
      g.rotate(mid);
      g.textAlign = "right";
      g.textBaseline = "middle";
      const size = n > 9 ? 15 : n > 6 ? 17 : 19;
      g.font = "bold " + size + "px 'Trebuchet MS', sans-serif";
      const t = text.length > 15 ? text.slice(0, 14) + "…" : text;
      g.lineWidth = 3;
      g.strokeStyle = "rgba(255,255,255,0.85)";
      g.strokeText(t, R - 14, 0);
      g.fillStyle = "#2a2340";
      g.fillText(t, R - 14, 0);
      g.restore();
    }

    /* ================= Spinning ================= */

    function segmentAtPointer() {
      // the pointer sits at the top, which is -90° in canvas terms
      const n = segments.length;
      if (n === 0) return -1;
      const step = (Math.PI * 2) / n;
      const target = -Math.PI / 2;
      let rel = (target - angle) % (Math.PI * 2);
      if (rel < 0) rel += Math.PI * 2;
      return Math.floor(rel / step) % n;
    }

    function spin() {
      if (spinning || segments.length < 2) { if (segments.length < 2) sNope(); return; }
      if (mode === "num" && guess === null) { sNope(); setResult("Pick a number first! 👇"); return; }
      audio();
      spinning = true;
      $("spinBtn").disabled = true;
      setResult("Spinning… 🌀");

      const n = segments.length;
      const step = (Math.PI * 2) / n;
      const winner = Math.floor(Math.random() * n);
      // land the winning wedge's middle under the pointer
      const targetAngle = -Math.PI / 2 - (winner + 0.5) * step;
      const turns = 4 + Math.floor(Math.random() * 3);
      const from = angle % (Math.PI * 2);
      let to = targetAngle;
      while (to < from + turns * Math.PI * 2) to += Math.PI * 2;

      const dur = 3600 + Math.random() * 900;
      const t0 = performance.now();
      let lastSeg = -1;

      const tick = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3.2);        // ease out
        angle = from + (to - from) * e;
        drawWheel();
        const s = segmentAtPointer();
        if (s !== lastSeg) { lastSeg = s; sTick(); }
        if (p < 1) { requestAnimationFrame(tick); return; }
        angle = to % (Math.PI * 2);
        drawWheel();
        spinning = false;
        landed(segmentAtPointer());
      };
      requestAnimationFrame(tick);
    }

    function setResult(html) { $("result").innerHTML = html; }

    function landed(i) {
      const seg = segments[i];
      if (!seg) { $("spinBtn").disabled = false; return; }
      if (mode === "pick") {
        sLand();
        confetti(8);
        setResult("🎉 The wheel says… <b>" + escapeHtml(seg.label) + "</b>!");
        $("spinBtn").disabled = false;
        return;
      }
      // number mode
      const landedNum = seg.value;
      played += 1;
      const wasRight = landedNum === guess;
      if (wasRight) {
        correct += 1;
        sWin();
        confetti(18);
        setResult("🎯 YES! It landed on <b>" + landedNum + "</b> — you guessed it!");
      } else {
        sMiss();
        setResult("It landed on <b>" + landedNum + "</b>. You said " + guess + " — try again!");
      }
      numbers = numbers.filter((x) => x !== landedNum);
      guess = null;
      if (correct > best) { best = correct; save(); }
      renderNumbers();
      buildSegments();
      updateStats();
      if (numbers.length === 0) {
        setTimeout(() => {
          sWin();
          confetti(24);
          setResult("🏆 All gone! You guessed <b>" + correct + " out of " + played + "</b> right. Tap New Round to play again!");
        }, 700);
      } else if (numbers.length === 1) {
        setResult($("result").innerHTML + "<br>Only one number left — it has to be " + numbers[0] + "! 😄");
      }
      $("spinBtn").disabled = guess === null;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    /* ================= Number mode UI ================= */

    function newRound() {
      numbers = [];
      for (let i = 1; i <= RANGE; i++) numbers.push(i);
      guess = null;
      correct = 0;
      played = 0;
      renderNumbers();
      buildSegments();
      updateStats();
      setResult("Pick a number, then spin! 🎯");
    }

    function renderNumbers() {
      const row = $("guessRow");
      row.innerHTML = "";
      for (let i = 1; i <= RANGE; i++) {
        const gone = !numbers.includes(i);
        const b = document.createElement("button");
        b.className = "num-btn" + (gone ? " gone" : "") + (guess === i ? " picked" : "");
        b.textContent = i;
        b.dataset.num = i;
        b.disabled = gone || spinning;
        if (!gone) {
          b.addEventListener("click", () => {
            sClick();
            guess = (guess === i) ? null : i;
            renderNumbers();
            $("spinBtn").disabled = guess === null;
            setResult(guess ? "You picked <b>" + guess + "</b> — spin the wheel! 🎡" : "Pick a number, then spin! 🎯");
          });
        }
        row.appendChild(b);
      }
      const btn = $("guessLabel");
      btn.textContent = numbers.length
        ? "Pick the number you think it will land on!"
        : "All the numbers are gone — start a new round!";
    }

    function updateStats() {
      $("statGot").textContent = "✅ Right " + correct;
      $("statLeft").textContent = "🔢 " + numbers.length + " left";
      $("statOdds").textContent = numbers.length ? "🎲 1 in " + numbers.length : "🎲 —";
      $("statBest").textContent = "🏆 Best " + best;
    }

    /* ================= Pick mode UI ================= */

    function renderCats() {
      const box = $("cats");
      box.innerHTML = "";
      CATEGORIES.forEach((c, i) => {
        const b = document.createElement("button");
        b.className = "cat" + (i === cat ? " active" : "");
        b.textContent = c.label;
        b.dataset.cat = c.id;
        b.addEventListener("click", () => {
          if (spinning) return;
          cat = i;
          sClick();
          renderCats();
          buildSegments();
          $("customBox").hidden = CATEGORIES[cat].id !== "custom";
          setResult(CATEGORIES[cat].id === "custom" && custom.length < 2
            ? "Add at least 2 things to your wheel below! ✏️"
            : "Give it a spin!");
        });
        box.appendChild(b);
      });
      $("customBox").hidden = CATEGORIES[cat].id !== "custom";
    }

    function renderChips() {
      const box = $("chips");
      box.innerHTML = "";
      custom.forEach((item, i) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = item;
        const x = document.createElement("button");
        x.textContent = "✕";
        x.setAttribute("aria-label", "remove " + item);
        x.addEventListener("click", () => {
          custom.splice(i, 1);
          sClick();
          renderChips();
          if (CATEGORIES[cat].id === "custom") buildSegments();
          save();
        });
        chip.appendChild(x);
        box.appendChild(chip);
      });
      $("customNote").textContent = custom.length < 2
        ? "Add at least 2 things (you can add up to 12)."
        : custom.length + " things on your wheel. Spin away!";
    }

    function addCustom() {
      const inp = $("customInput");
      const v = inp.value.trim();
      if (!v) return;
      if (custom.length >= 12) { sNope(); $("customNote").textContent = "That's the most the wheel can hold (12)!"; return; }
      custom.push(v);
      inp.value = "";
      sClick();
      renderChips();
      if (CATEGORIES[cat].id === "custom") buildSegments();
      save();
      inp.focus();
    }

    /* ================= Confetti ================= */

    function confetti(n) {
      const emo = ["🎉", "✨", "⭐", "🎊", "🎡"];
      for (let i = 0; i < n; i++) {
        const c = document.createElement("span");
        c.className = "confetti-bit";
        c.textContent = emo[Math.floor(Math.random() * emo.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
        c.style.animationDelay = Math.random() * 0.4 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    /* ================= Tabs & buttons ================= */

    function switchMode(m) {
      if (spinning) return;
      mode = m;
      $("tabPick").classList.toggle("active", m === "pick");
      $("tabNum").classList.toggle("active", m === "num");
      $("viewPick").hidden = m !== "pick";
      $("viewNum").hidden = m !== "num";
      $("customBox").hidden = m !== "pick" || CATEGORIES[cat].id !== "custom";
      $("subtitle").textContent = m === "pick"
        ? "Can't decide? Let the wheel choose for you!"
        : "Guess where it will land! Every number it lands on gets taken off the wheel.";
      if (m === "num") { newRound(); } else { buildSegments(); setResult("Give it a spin!"); }
    }

    $("tabPick").addEventListener("click", () => { sClick(); switchMode("pick"); });
    $("tabNum").addEventListener("click", () => { sClick(); switchMode("num"); });
    $("spinBtn").addEventListener("click", spin);
    $("addBtn").addEventListener("click", addCustom);
    $("customInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addCustom(); });
    $("soundBtn").addEventListener("click", () => {
      soundOn = !soundOn;
      $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
      if (soundOn) sClick();
      save();
    });
    cv.addEventListener("click", () => { if (!spinning) spin(); });
    $("newRoundBtn").addEventListener("click", () => { if (spinning) return; sClick(); newRound(); });

    /* ================= Start ================= */

    load();
    $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
    renderCats();
    renderChips();
    buildSegments();
    updateStats();
  </script>
</body>
</html>
