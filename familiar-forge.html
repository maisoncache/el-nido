<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Familiar Forge</title>
</head>
<body>
  <h1>Familiar Forge</h1>
  <p>Choose a body, colour, name, and silly job. Then forge your familiar.</p>

  <p>
    <label for="body">Body</label><br />
    <select id="body">
      <option value="cat">Cat</option>
      <option value="owl">Owl</option>
      <option value="frog">Frog</option>
      <option value="fox">Fox</option>
      <option value="moth">Moth</option>
      <option value="teapot">Teapot</option>
    </select>
  </p>

  <p>
    <label for="colour">Colour</label><br />
    <select id="colour">
      <option value="moss green">Moss green</option>
      <option value="midnight blue">Midnight blue</option>
      <option value="ember orange">Ember orange</option>
      <option value="plum purple">Plum purple</option>
      <option value="silver grey">Silver grey</option>
      <option value="rose pink">Rose pink</option>
    </select>
  </p>

  <p>
    <label for="name">Name</label><br />
    <input id="name" type="text" placeholder="e.g. Biscuit" />
  </p>

  <p>
    <label for="job">Silly job</label><br />
    <select id="job">
      <option value="sock finder">Sock finder</option>
      <option value="snack inspector">Snack inspector</option>
      <option value="cloud counter">Cloud counter</option>
      <option value="puddle judge">Puddle judge</option>
      <option value="keeper of lost pens">Keeper of lost pens</option>
      <option value="official yawner">Official yawner</option>
    </select>
  </p>

  <button id="forge" type="button">Forge my familiar</button>

  <div id="card"></div>

  <script>
    document.getElementById("forge").addEventListener("click", function () {
      var body = document.getElementById("body").value;
      var colour = document.getElementById("colour").value;
      var name = document.getElementById("name").value.trim() || "Nameless";
      var job = document.getElementById("job").value;

      document.getElementById("card").textContent =
        "Forging " + name + ", the " + colour + " " + body + " who works as a " + job + "...";
    });
  </script>
</body>
</html>
